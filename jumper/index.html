<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ホップ・ステップ・キャッチ！</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f0c1b;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Mochiy Pop One", "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    background: #1a162b;
    overflow: hidden;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* 下部ジャンプボタンエリア */
  #jump-button-area {
    position: absolute;
    bottom: 70px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }

  /* 丸型ジャンプボタン */
  .jump-btn {
    pointer-events: auto;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff4081 0%, #ff1744 100%);
    color: #ffffff;
    border: 3.5px solid #ffffff;
    font-family: "Mochiy Pop One", sans-serif;
    font-size: 15px;
    font-weight: 900;
    line-height: 1.2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 20px rgba(255, 23, 68, 0.45), 0 5px 0 #99002b;
    cursor: pointer;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.35);
    transition: transform 0.06s, box-shadow 0.06s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .jump-btn:active {
    transform: translateY(4px);
    box-shadow: 0 3px 10px rgba(255, 23, 68, 0.35), 0 1px 0 #99002b;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="jump-button-area" class="hidden">
    <button class="jump-btn" id="btn-jump">
      <span style="font-size: 18px; margin-bottom: 2px;">👆</span>
      <span>JUMP</span>
    </button>
  </div>
</div>
<script>
"use strict";

const GAS_URL = "https://script.google.com/macros/s/AKfycb.../exec";

let storeCd = "000000";
let deviceId = localStorage.getItem('device_id') || 'unknown';

function getStoreCdFromUrl() {
  const hash = window.location.hash.replace('#', '').trim();
  if (hash && hash.length === 6) storeCd = hash;
}
getStoreCdFromUrl();

function logAccess(actionName) {
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: 'access_log',
      store_cd: storeCd,
      device_id: deviceId,
      action: actionName
    })
  }).catch(err => console.warn("ログ送信失敗:", err));
}

const stage = document.getElementById("stage");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const jumpBtnArea = document.getElementById("jump-button-area");
const jumpBtn = document.getElementById("btn-jump");

let W = 0, H = 0, dpr = 1;
let groundY = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = stage.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  groundY = Math.floor(H * 0.72);
}
let resizeScheduled = false;
function scheduleResize() {
  if (resizeScheduled) return;
  resizeScheduled = true;
  requestAnimationFrame(() => { resizeScheduled = false; resize(); });
}
window.addEventListener("resize", scheduleResize);
window.addEventListener("orientationchange", scheduleResize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleResize);
resize();

// ----------------------------- 画像 & メニューJSON読み込み ---------------------------
const defaultPlayerPath = 'image/000000.png';
let currentPlayerPath = storeCd !== "000000" ? `image/${storeCd}.png` : defaultPlayerPath;

const playerImg = new Image();
let playerImgLoaded = false;
playerImg.onload = () => { playerImgLoaded = true; };
playerImg.onerror = () => {
  if (currentPlayerPath !== defaultPlayerPath) {
    currentPlayerPath = defaultPlayerPath;
    playerImg.src = defaultPlayerPath;
  }
};
playerImg.src = currentPlayerPath;

const diaKeys = ['dia_r', 'dia_y', 'dia_pr', 'dia_g', 'dia_b', 'dia_p'];
const diaImgs = diaKeys.map(key => {
  const img = new Image();
  img.src = `image/${key}.png`;
  return { key, img };
});

const monsterDefs = [
  { name: 'monster_1.png', w: 321, h: 281, tall: false },
  { name: 'monster_2.png', w: 231, h: 378, tall: true  },
  { name: 'monster_3.png', w: 338, h: 352, tall: false },
  { name: 'monster_4.png', w: 263, h: 450, tall: true  },
  { name: 'monster_5.png', w: 322, h: 350, tall: false },
  { name: 'monster_6.png', w: 377, h: 293, tall: false }
];
const monsterImgs = monsterDefs.map(def => {
  const img = new Image();
  img.src = `image/${def.name}`;
  return { img, aspect: def.w / def.h, tall: def.tall };
});

let menuData = null;
const loadedMenuImgs = {};
fetch('menu.json')
  .then(res => res.json())
  .then(data => {
    menuData = data;
    if (menuData && menuData[storeCd]) {
      Object.values(menuData[storeCd]).forEach(m => {
        if (m.image) {
          const mi = new Image();
          mi.src = m.image;
          loadedMenuImgs[m.image] = mi;
        }
      });
    }
  })
  .catch(err => console.warn("menu.json の読み込みをスキップしました:", err));

// ----------------------------- サウンド ---------------------------
function createSfxPool(src, size, vol) {
  const pool = [];
  for (let i = 0; i < size; i++) {
    const a = new Audio(src);
    a.preload = "auto";
    a.volume = vol;
    pool.push(a);
  }
  let i = 0;
  return () => {
    const a = pool[i];
    i = (i + 1) % pool.length;
    try { a.currentTime = 0; } catch (e) {}
    a.play().catch(() => {});
  };
}
const sndJump = createSfxPool("assets/jump.mp3", 3, 0.6);
const sndGem  = createSfxPool("assets/gem.mp3", 4, 0.7);
const sndHit  = createSfxPool("assets/hit.mp3", 2, 0.7);

// ----------------------------- ステート ---------------------------
const STATE = { READY: 0, PLAY: 1, OVER: 2 };
let state = STATE.READY;

const BALL_R = 24;
const GRAVITY = 1600;
const JUMP_V = -680;
const BASE_SPEED = 220;
const MAX_SPEED = 480;

const ball = { x: 0, y: 0, vy: 0, jumpsLeft: 2, onGround: true };
let speed = BASE_SPEED;
let distance = 0;
let gemsScore = 0;
let score = 0;
let best = 0;
try { best = parseInt(localStorage.getItem("hc_best_m") || "0", 10) || 0; } catch (e) {}

let diaCounts = { dia_r: 0, dia_y: 0, dia_pr: 0, dia_g: 0, dia_b: 0, dia_p: 0 };
let totalDiaCount = 0;
let bestDiaKey = 'dia_r';

let obstacles = [];
let gems = [];
let particles = [];
let caveGems = [];
let distToNextSpawn = 0;
let overTime = 0;
let shake = 0;

function initCaveGems() {
  caveGems = [];
  for (let i = 0; i < 16; i++) {
    caveGems.push({
      x: Math.random() * W,
      y: Math.random() * (groundY - 60) + 40,
      r: 2 + Math.random() * 3,
      color: ['#00e5ff', '#ff4081', '#ffe57f', '#b388ff', '#69f0ae'][Math.floor(Math.random() * 5)],
      twinkle: Math.random() * 6.28
    });
  }
}
initCaveGems();

function resetGame() {
  ball.x = Math.max(90, W * 0.24);
  ball.y = groundY - BALL_R;
  ball.vy = 0;
  ball.jumpsLeft = 2;
  ball.onGround = true;
  speed = BASE_SPEED;
  distance = 0;
  gemsScore = 0;
  score = 0;
  obstacles = [];
  gems = [];
  particles = [];
  diaCounts = { dia_r: 0, dia_y: 0, dia_pr: 0, dia_g: 0, dia_b: 0, dia_p: 0 };
  totalDiaCount = 0;
  distToNextSpawn = W * 0.45;
  shake = 0;
}
resetGame();

// ----------------------------- 入力 ---------------------------
function press() {
  if (state === STATE.READY) {
    state = STATE.PLAY;
    jumpBtnArea.classList.remove("hidden");
    logAccess("ゲーム開始: 洞窟脱出大作戦");
    return;
  }
  if (state === STATE.OVER) {
    if (overTime > 0.6) {
      resetGame();
      state = STATE.PLAY;
      jumpBtnArea.classList.remove("hidden");
      logAccess("リトライ: 洞窟脱出大作戦");
    }
    return;
  }

  if (ball.jumpsLeft > 0) {
    ball.vy = ball.jumpsLeft === 2 ? JUMP_V : JUMP_V * 0.88;
    ball.jumpsLeft--;
    ball.onGround = false;
    sndJump();
    spawnDust(ball.x, groundY, 4, -1);
  }
}

window.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  press();
}, { passive: false });

jumpBtn.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  e.preventDefault();
  press();
});

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    press();
  }
});

// --------------------------- スポーン ---------------------------
function spawnObstacleGroup() {
  const x = W + 80;
  const mIdx = Math.floor(Math.random() * monsterImgs.length);
  const def = monsterImgs[mIdx];
  
  const heightMultiplier = def.tall ? 1.9 : 1.5;
  const renderH = (54 + Math.random() * 10) * heightMultiplier;
  const renderW = renderH * def.aspect;

  obstacles.push({
    x: x,
    w: renderW,
    h: renderH,
    mIdx: mIdx,
    hopPhase: Math.random() * 6.28
  });

  if (Math.random() < 0.85) {
    const gx = x + renderW + 110 + Math.random() * 50;
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const px = gx + i * 44;
      const py = groundY - 80 - Math.sin((i / (n - 1)) * Math.PI) * 80;
      const randomDiaIdx = Math.floor(Math.random() * diaImgs.length);
      gems.push({ x: px, y: py, r: 16, phase: Math.random() * 6.28, diaIdx: randomDiaIdx });
    }
  }

  distToNextSpawn = Math.max(340, speed * (1.15 + Math.random() * 0.4));
}

function spawnDust(x, y, n, dir) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 14,
      y: y - Math.random() * 6,
      vx: (Math.random() * 50 + 20) * (Math.random() < 0.5 ? -1 : 0.4) - speed * 0.15,
      vy: (dir || -1) * (Math.random() * 50 + 20),
      life: 0, maxLife: 0.4 + Math.random() * 0.25,
      size: 3 + Math.random() * 3,
      color: "#ba68c8"
    });
  }
}

function spawnBurst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 200;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,
      life: 0, maxLife: 0.5 + Math.random() * 0.4,
      size: 3 + Math.random() * 4,
      color: color
    });
  }
}

function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

function gameOver() {
  state = STATE.OVER;
  overTime = 0;
  shake = 12;
  sndHit();
  spawnBurst(ball.x, ball.y, 25, "#ff4081");
  jumpBtnArea.classList.add("hidden");

  // ダイヤ獲得総数と最多ダイヤの判定
  totalDiaCount = 0;
  let maxCount = 0;
  bestDiaKey = diaKeys[Math.floor(Math.random() * diaKeys.length)];

  diaKeys.forEach(k => {
    totalDiaCount += diaCounts[k];
    if (diaCounts[k] > maxCount) {
      maxCount = diaCounts[k];
      bestDiaKey = k;
    }
  });

  logAccess(`ゲーム終了: 洞窟脱出大作戦 (${score}m / 総ダイヤ: ${totalDiaCount})`);

  if (score > best) {
    best = score;
    try { localStorage.setItem("hc_best_m", String(best)); } catch (e) {}
  }
}

// ---------------------------- 更新 ----------------------------
function update(dt) {
  const bgSpeed = state === STATE.PLAY ? speed : 30;

  for (const cg of caveGems) {
    cg.twinkle += dt * 4;
    cg.x -= bgSpeed * 0.15 * dt;
    if (cg.x < -10) {
      cg.x = W + 10;
      cg.y = Math.random() * (groundY - 60) + 40;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
    p.vy += 800 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.y > groundY - 2) { p.y = groundY - 2; p.vy *= -0.4; }
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  if (state === STATE.OVER) {
    overTime += dt;
    return;
  }

  if (state === STATE.READY) {
    ball.vy += GRAVITY * dt;
    ball.y += ball.vy * dt;
    if (ball.y >= groundY - BALL_R) {
      ball.y = groundY - BALL_R;
      ball.vy = -420;
      spawnDust(ball.x, groundY, 2, -1);
    }
    return;
  }

  speed = Math.min(MAX_SPEED, speed + 4 * dt);
  distance += speed * dt;
  score = Math.floor(distance / 70) + gemsScore;

  const wasAirborne = !ball.onGround;
  ball.vy += GRAVITY * dt;
  ball.y += ball.vy * dt;
  if (ball.y >= groundY - BALL_R) {
    ball.y = groundY - BALL_R;
    ball.vy = 0;
    ball.onGround = true;
    ball.jumpsLeft = 2;
    if (wasAirborne) {
      spawnDust(ball.x, groundY, 5, -1);
    }
  } else {
    ball.onGround = false;
  }

  distToNextSpawn -= speed * dt;
  if (distToNextSpawn <= 0) spawnObstacleGroup();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed * dt;
    o.hopPhase += dt * 4;
    if (o.x + o.w < -60) { obstacles.splice(i, 1); continue; }
    
    const cr = BALL_R - 4;
    const hitX = o.x + o.w * 0.15;
    const hitY = groundY - o.h + o.h * 0.15;
    const hitW = o.w * 0.7;
    const hitH = o.h * 0.85;

    if (circleRectHit(ball.x, ball.y, cr, hitX, hitY, hitW, hitH)) {
      gameOver(); return;
    }
  }

  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.x -= speed * dt;
    g.phase += dt * 3;
    if (g.x < -40) { gems.splice(i, 1); continue; }
    const dx = g.x - ball.x, dy = (g.y + Math.sin(g.phase) * 4) - ball.y;
    if (dx * dx + dy * dy < (BALL_R + g.r + 10) * (BALL_R + g.r + 10)) {
      const key = diaImgs[g.diaIdx].key;
      diaCounts[key]++;

      gems.splice(i, 1);
      gemsScore += 3;
      sndGem();
      spawnBurst(g.x, g.y, 8, "#ffe57f");
    }
  }
}

// ----------------------------- 描画 -----------------------------
function drawCaveBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, groundY);
  grad.addColorStop(0, "#120d24");
  grad.addColorStop(0.5, "#1f183d");
  grad.addColorStop(1, "#2e1e47");
  ctx.fillStyle = grad;
  ctx.fillRect(-20, -20, W + 40, groundY + 20);

  ctx.fillStyle = "#161129";
  const stCount = 8;
  const stW = W / stCount;
  const offX = -(distance * 0.2 % stW);
  ctx.beginPath();
  ctx.moveTo(-20, 0);
  for (let i = -1; i <= stCount + 1; i++) {
    const bx = offX + i * stW;
    const h = ((i % 3) * 18) + 38;
    ctx.lineTo(bx + stW * 0.5, h);
    ctx.lineTo(bx + stW, 0);
  }
  ctx.closePath();
  ctx.fill();

  for (const cg of caveGems) {
    const alpha = 0.4 + Math.sin(cg.twinkle) * 0.35;
    ctx.fillStyle = cg.color;
    ctx.globalAlpha = Math.max(0.1, alpha);
    ctx.beginPath();
    ctx.arc(cg.x, cg.y, cg.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = "#ff6eb4";
  ctx.fillRect(-20, groundY, W + 40, 4);

  const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, "#2a1b38");
  groundGrad.addColorStop(1, "#120a1c");
  ctx.fillStyle = groundGrad;
  ctx.fillRect(-20, groundY + 4, W + 40, H - groundY);

  ctx.strokeStyle = "#472e5e";
  ctx.lineWidth = 2;
  const tickGap = 70;
  const off = -(distance % tickGap);
  for (let x = off; x < W + tickGap; x += tickGap) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + 12);
    ctx.lineTo(x + 20, groundY + 12);
    ctx.stroke();
  }
}

function drawBall() {
  ctx.save();
  ctx.translate(ball.x, ball.y);

  if (playerImgLoaded && playerImg.naturalWidth > 0) {
    const targetH = BALL_R * 3.5;
    const aspect = playerImg.naturalWidth / playerImg.naturalHeight;
    const targetW = targetH * aspect;
    ctx.drawImage(playerImg, -targetW / 2, -targetH + BALL_R, targetW, targetH);
  } else {
    ctx.fillStyle = "#ff6eb4";
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawMonster(o) {
  const def = monsterImgs[o.mIdx];
  const bounceY = Math.abs(Math.sin(o.hopPhase)) * 6;
  const y = groundY - o.h - bounceY;

  ctx.save();
  if (def.img && def.img.complete && def.img.naturalWidth !== 0) {
    ctx.drawImage(def.img, o.x, y, o.w, o.h);
  } else {
    ctx.fillStyle = "#e91e63";
    ctx.fillRect(o.x, y, o.w, o.h);
  }
  ctx.restore();
}

function drawGem(g) {
  const y = g.y + Math.sin(g.phase) * 4;
  const item = diaImgs[g.diaIdx];
  const w = 38;
  const h = w * (152 / 200);

  ctx.save();
  ctx.translate(g.x, y);

  if (item && item.img && item.img.complete && item.img.naturalWidth !== 0) {
    ctx.drawImage(item.img, -w / 2, -h / 2, w, h);
  } else {
    ctx.fillStyle = "#00e5ff";
    ctx.beginPath();
    ctx.moveTo(0, -g.r);
    ctx.lineTo(g.r, 0);
    ctx.lineTo(0, g.r);
    ctx.lineTo(-g.r, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawCenteredText(text, x, y, size, weight, color, strokeColor) {
  ctx.font = (weight || "700") + " " + size + "px 'Mochiy Pop One', 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (strokeColor) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 4;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// ----------------------------- リザルト画面 -----------------------------
function drawResultScreen() {
  ctx.fillStyle = "rgba(15, 12, 27, 0.94)";
  ctx.fillRect(-20, -20, W + 40, H + 40);

  const storeMenus = (menuData && menuData[storeCd]) ? menuData[storeCd] : null;

  let rec = null;
  if (storeMenus) {
    rec = storeMenus[bestDiaKey] || Object.values(storeMenus)[0];
  }
  const hasMenu = rec !== null && rec !== undefined;

  if (hasMenu) {
    // 1. タイトル
    drawCenteredText("結果発表！", W / 2, H * 0.055, 26, "900", "#ff4081", "#ffffff");

    // 2. 距離（○m）
    drawCenteredText(`きろく: ${score} m`, W / 2, H * 0.105, 20, "900", "#ffe57f", "#0f0c1b");

    // 3. ダイヤ集計バー
    const diaBoxY = H * 0.14;
    const diaBoxW = W * 0.9;
    const diaBoxX = (W - diaBoxW) / 2;
    ctx.fillStyle = "rgba(42, 27, 56, 0.85)";
    ctx.strokeStyle = "#ff6eb4";
    ctx.lineWidth = 2;
    ctx.fillRect(diaBoxX, diaBoxY, diaBoxW, 52);
    ctx.strokeRect(diaBoxX, diaBoxY, diaBoxW, 52);

    const colW = diaBoxW / 6;
    diaKeys.forEach((key, idx) => {
      const cx = diaBoxX + colW * idx + colW / 2;
      const cy = diaBoxY + 18;
      const item = diaImgs[idx];
      if (item.img.complete) {
        ctx.drawImage(item.img, cx - 12, cy - 9, 24, 18);
      }
      drawCenteredText(`${diaCounts[key]}`, cx, cy + 20, 13, "700", "#ffffff");
    });

    // 4. おすすめメニューカード
    const cardY = H * 0.235;
    const cardW = W * 0.88;
    const cardH = H * 0.58;
    const cardX = (W - cardW) / 2;

    // 白枠カード土台
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#ffe57f";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardW, cardH, 18);
    ctx.fill();
    ctx.stroke();

    // 帯（高さを54pxに150%拡大）
    const headerH = 54;
    ctx.fillStyle = "#ff4081";
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardW, headerH, [16, 16, 0, 0]);
    ctx.fill();

    // 帯の文字（ダイヤ0個判定 & アイコンなし・上下中央配置）
    let headerText = "";
    if (totalDiaCount === 0) {
      headerText = "また挑戦しよう！おすすめは";
    } else {
      headerText = `${rec.colorName || "おすすめ"}のあなたへ！`;
    }
    drawCenteredText(headerText, W / 2, cardY + headerH / 2, 14, "900", "#ffffff");

    // メニュー画像とメニュー名をカード内の残りスペースの中央に配置
    const contentAreaTop = cardY + headerH;
    const contentAreaH = cardH - headerH;
    const imgSize = Math.min(cardW * 0.72, contentAreaH * 0.62);
    const imgX = (W - imgSize) / 2;
    const imgY = contentAreaTop + (contentAreaH - (imgSize + 40)) / 2;

    const menuImgObj = loadedMenuImgs[rec.image];
    if (menuImgObj && menuImgObj.complete && menuImgObj.naturalWidth !== 0) {
      ctx.drawImage(menuImgObj, imgX, imgY, imgSize, imgSize);
    } else {
      ctx.fillStyle = "#f5f5f5";
      ctx.fillRect(imgX, imgY, imgSize, imgSize);
      drawCenteredText("🍴", W / 2, imgY + imgSize / 2, 48, "700", "#999");
    }

    // メニュー名（画像の下に中央配置）
    drawCenteredText(rec.name, W / 2, imgY + imgSize + 26, 18, "900", "#1a162b");

    // リトライ案内
    if (overTime > 0.6 && Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでもう一度あそぶ", W / 2, H * 0.89, 21, "900", "#ffe57f", "#0f0c1b");
    }

  } else {
    // メニューなし店舗用表示
    drawCenteredText("ゲーム終了！", W / 2, H * 0.15, 36, "900", "#ff4081", "#ffffff");

    drawCenteredText("逃げ切った距離", W / 2, H * 0.25, 18, "700", "#cccccc");
    drawCenteredText(`${score} m`, W / 2, H * 0.33, 56, "900", "#ffe57f", "#0f0c1b");
    
    const isBest = score >= best && score > 0;
    drawCenteredText(isBest ? "🎉 新記録達成！" : `ベスト記録: ${best} m`, W / 2, H * 0.40, 18, "700", isBest ? "#ff4081" : "#b388ff");

    const cardY = H * 0.46;
    const cardW = W * 0.88;
    const cardH = H * 0.26;
    const cardX = (W - cardW) / 2;

    ctx.fillStyle = "rgba(42, 27, 56, 0.9)";
    ctx.strokeStyle = "#ffe57f";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardW, cardH, 16);
    ctx.fill();
    ctx.stroke();

    drawCenteredText("あつめたダイヤ", W / 2, cardY + 28, 16, "900", "#ffe57f");

    const rowCount = 2;
    const colCount = 3;
    const cellW = cardW / colCount;
    const cellH = (cardH - 45) / rowCount;

    diaKeys.forEach((key, idx) => {
      const col = idx % colCount;
      const row = Math.floor(idx / colCount);
      const cx = cardX + col * cellW + cellW / 2;
      const cy = cardY + 45 + row * cellH + cellH / 2;

      const item = diaImgs[idx];
      if (item.img.complete) {
        ctx.drawImage(item.img, cx - 38, cy - 13, 32, 24);
      }
      ctx.font = "900 18px 'Mochiy Pop One', sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(`× ${diaCounts[key]}`, cx + 2, cy);
    });

    if (overTime > 0.6 && Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでもう一度あそぶ", W / 2, H * 0.82, 24, "900", "#ffe57f", "#0f0c1b");
    }
  }
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawCaveBackground();

  for (const g of gems) drawGem(g);
  for (const o of obstacles) drawMonster(o);

  for (const p of particles) {
    const a = 1 - p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  if (state !== STATE.OVER || overTime < 0.05) drawBall();

  // ---------------- UI ----------------
  if (state === STATE.PLAY) {
    drawCenteredText(`${score} m`, W / 2, H * 0.12, 48, "900", "#ffeb3b", "#0f0c1b");
  }

  if (state === STATE.READY) {
    drawCenteredText("ホップ・ステップ・キャッチ！", W / 2, H * 0.22, Math.min(26, W * 0.072), "900", "#ff4081", "#ffffff");
    drawCenteredText("モンスターをよけてダイヤを集めよう！", W / 2, H * 0.32, Math.min(15, W * 0.038), "700", "#e0e0e0");
    drawCenteredText("集めたダイヤでおすすめメニューがわかるよ！", W / 2, H * 0.37, Math.min(15, W * 0.038), "900", "#ffe57f");
    
    if (Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでスタート", W / 2, H * 0.48, Math.min(24, W * 0.055), "900", "#ff4081", "#ffffff");
    }
    if (best > 0) {
      drawCenteredText("ベスト記録: " + best + " m", W / 2, H * 0.56, 18, "700", "#b388ff");
    }
  }

  if (state === STATE.OVER) {
    drawResultScreen();
  }

  ctx.restore();
}

// ----------------------------- ループ -----------------------------
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 1 / 30) dt = 1 / 30;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastT = performance.now();
});
</script>
</body>
</html>
