const videoCache = {};
function getVideo(src){
  if(videoCache[src]) return videoCache[src];
  const v = document.createElement("video");
  v.src = src; v.preload = "auto"; v.playsInline = true; v.setAttribute("playsinline","");
  v.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
  document.body.appendChild(v);
  return (videoCache[src] = v);
}
const TIER_STYLE = {
  blue:   {stops:["#f2fbff","#9fd8ff","#2f8cff","#d6efff","#1f6fe0","#0a3a8a"], rim:["#e8f6ff","#2a6fd0"], glow:"#3da5ff", lines:"170,215,255"},
  green:  {stops:["#f2fff4","#a6f5b8","#25c25a","#d8ffe2","#1aa14a","#0b5a26"], rim:["#eaffef","#1f9a4a"], glow:"#3fe07a", lines:"190,255,210"},
  red:    {stops:["#fff3f0","#ffb3a6","#ff3b2b","#ffe0d9","#e01b0b","#7a0600"], rim:["#fff0ec","#c4160a"], glow:"#ff3b2b", lines:"255,190,180"},
  gold:   {stops:["#fffbe6","#ffe27a","#d9a21a","#fff1b0","#e0a816","#8a5a00"], rim:["#fff6cf","#b8860b"], glow:"#ffd34d", lines:"255,235,170"},
};
function drawReachText(c, w, h, ms, cy, tier){
  const st = TIER_STYLE.gold, rainbow = false;   // 「リーチ!!」の文字はいつも金色
  // 虹：背景にも虹色の光をまわす
  if(rainbow){
    c.save(); c.globalCompositeOperation="lighter"; c.translate(w/2,cy); c.rotate(ms/900);
    for(let i=0;i<12;i++){ c.rotate(Math.PI/6); c.fillStyle=`hsla(${(i*30+ms/6)%360},100%,60%,.22)`;
      c.beginPath(); c.moveTo(0,0); c.lineTo(Math.hypot(w,h),-60); c.lineTo(Math.hypot(w,h),60); c.fill(); }
    c.restore();
  }
  // 集中線
  c.save(); c.translate(w/2, cy);
  const R = Math.hypot(w,h), n = 46;
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2 + Math.sin(i*7.3)*.04, len = R*(.55+.45*((i*37)%10)/10);
    c.strokeStyle = rainbow ? `hsla(${(i*24+ms/4)%360},100%,75%,${.18+.14*((i*13)%5)/5})` : `rgba(${st.lines},${.12+.14*((i*13)%5)/5})`; c.lineWidth = 1.5+((i*7)%4);
    c.beginPath(); c.moveTo(Math.cos(a)*R*.28, Math.sin(a)*R*.28); c.lineTo(Math.cos(a)*len, Math.sin(a)*len); c.stroke();
  }
  c.restore();
  // 文字
  const p = Math.min(1, ms/420), sc = (1.7 - .7*easeOutBack(p)) * (1 + Math.sin(ms/110)*.02*(p>=1));
  c.globalAlpha = Math.min(1, ms/220);
  const size = Math.min(w*.2, h*.34, 130);
  c.save(); c.translate(w/2 + (p<1?0:Math.sin(ms/23)*1.2), cy); c.scale(sc,sc); c.rotate(-.06);
  c.font = `900 ${size}px "Noto Sans JP", sans-serif`; c.textAlign="center"; c.textBaseline="middle";
  let g;
  if(rainbow){
    g = c.createLinearGradient(-size*2,0,size*2,0);
    for(let k=0;k<=6;k++) g.addColorStop(k/6, `hsl(${(k*60+ms/3)%360},100%,${k%2?62:55}%)`);
  } else {
    g = c.createLinearGradient(0,-size/2,0,size/2);
    [0,.28,.48,.52,.75,1].forEach((o,k)=>g.addColorStop(o, st.stops[k]));
  }
  c.lineJoin="round";
  c.lineWidth = size*.26; c.strokeStyle="#140a00"; c.strokeText("リーチ!!",0,0);
  const rim = c.createLinearGradient(0,-size/2,0,size/2);
  if(rainbow){ rim.addColorStop(0,"#ffffff"); rim.addColorStop(1,"#ffe6ff"); } else { rim.addColorStop(0,st.rim[0]); rim.addColorStop(1,st.rim[1]); }
  c.lineWidth = size*.13; c.strokeStyle=rim; c.strokeText("リーチ!!",0,0);
  c.shadowColor = rainbow ? `hsl(${(ms/3)%360},100%,60%)` : st.glow; c.shadowBlur = 34;
  c.fillStyle = g; c.fillText("リーチ!!",0,0);
  c.shadowBlur = 0; c.globalCompositeOperation = "lighter";   // きらっと光るハイライト
  const sh = c.createLinearGradient(-size*2,0,size*2,0), x = ((ms/700)%1.6)-.3;
  sh.addColorStop(clamp01(x-.08),"rgba(255,255,255,0)"); sh.addColorStop(clamp01(x),"rgba(255,255,255,.55)"); sh.addColorStop(clamp01(x+.08),"rgba(255,255,255,0)");
  c.fillStyle = sh; c.fillText("リーチ!!",0,0); c.globalCompositeOperation = "source-over";
  c.restore();
}

function playReach(m, rare, tier="gold"){
  return new Promise(resolve=>{
    const box = $("#reach"), mon = $("#monitor"), cv = $("#rc"), ctx = cv.getContext("2d");
    const dpr = Math.min(2, devicePixelRatio||1);
    const INTRO = 1700, EXP = 750, XF = 500, FULL = rare ? 3200 : 2400, SHR = 650;  // ①モニターで「リーチ!!」＋トラック ②全画面へ ③動画へクロスフェード ④モニターへ戻る
    const VIDEO_RATE = 1.35;   // 動画の再生速度（1＝そのまま）
    const ease = x=>x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
    const parts = Array.from({length:90},()=>({x:Math.random(), y:Math.random(), r:1+Math.random()*4, s:.3+Math.random()*1.2, a:Math.random()*6.28, w:(Math.random()-.5)*2}));
    const t0 = performance.now();
    let shrinkAt = null, done = false, raf, video = null, videoStarted = false, curT = 0;
    const ovPx = ()=> ovOf(0);

    const list = reachList(m).filter(src=>!getVideo(src).error);
    if(list.length){ video = getVideo(pick(list)); }
    const startVideo = ()=>{
      if(!video || videoStarted) return; videoStarted = true;
      video.currentTime = 0; video.muted = false; video.playbackRate = VIDEO_RATE;
      video.onended = ()=>{ if(shrinkAt===null) shrinkAt = performance.now(); };
      video.onerror = ()=>{ video = null; };
      video.play().catch(()=>{ if(!video) return; video.muted = true; video.play().catch(()=>{ video = null; }); });
    };

    // 描画：前半はトラックの映像＋「リーチ!!」、後半はガチャ動画（無ければ内蔵アニメ）
    const intro = (c,w,h,e,isMonitor)=>{
      const ov = isMonitor ? ovPx() : ovPx()*(1-clamp01((e-INTRO)/EXP));
      Delivery.draw(c, w, h, performance.now(), ov);
      drawReachText(c, w, h, e, (h-ov)/2, tier);
    };
    // 動画：少しずつズームインしながら、入りの一瞬だけ画面を揺らして躍動感を出す
    // 動画は切らずに全体を見せる（すき間は同じ動画をぼかして敷く）
    const drawVideo = (c,w,h)=>{
      const vw0=video.videoWidth, vh0=video.videoHeight;
      const cs = Math.max(w/vw0, h/vh0);
      c.save(); c.filter="blur(18px) brightness(.55)"; c.drawImage(video,(w-vw0*cs*1.1)/2,(h-vh0*cs*1.1)/2,vw0*cs*1.1,vh0*cs*1.1); c.restore();
      const pr = video.duration ? video.currentTime/video.duration : 0, kick = Math.max(0, 1-video.currentTime/.4);
      const sc = Math.min(w/vw0, h/vh0)*(1 + pr*.05), vw=vw0*sc, vh=vh0*sc;
      const jx = Math.sin(performance.now()/22)*4*kick, jy = Math.cos(performance.now()/19)*3*kick;
      c.drawImage(video,(w-vw)/2+jx,(h-vh)/2+jy,vw,vh);
    };
    const videoReady = ()=> video && video.readyState>=2 && video.videoWidth;
    let vReadyAt = 0;
    const paint = (c,w,h,isMonitor)=>{
      const now = performance.now(), e = (shrinkAt!==null ? shrinkAt : now) - t0;
      if(e < INTRO+EXP){ intro(c,w,h,e,isMonitor); return; }
      // 動画の絵が来てから切り替える（来るまではトラックの映像のまま＝黒い画面にならない）
      if(video && !vReadyAt && videoReady() && video.currentTime>0) vReadyAt = now;
      const xf = video ? (vReadyAt ? clamp01((now-vReadyAt)/XF) : 0) : clamp01((e-INTRO-EXP)/XF);
      if(xf<1) intro(c,w,h,Math.min(e, INTRO+EXP+XF),isMonitor);
      c.save(); c.globalAlpha = xf*xf*(3-2*xf);
      if(video && vReadyAt) drawVideo(c,w,h);
      else if(!video){ SCENES[m](c,w,h,curT,parts,rare); if(rare) goldBurst(c,w,h,curT); }
      c.restore();
      // 終わり：モニターへ戻りながら、トラックの映像へふわっと戻す
      if(shrinkAt!==null){
        const p = clamp01((now-shrinkAt)/SHR), a = clamp01((p-.35)/.65);
        if(a>0){ c.save(); c.globalAlpha=a; Delivery.draw(c,w,h,now, isMonitor ? ovPx() : ovPx()*a); c.restore(); }
      }
    };

    mon.classList.add("live");
    monitorOverride = (c,w,h)=>paint(c,w,h,true);
    Delivery.dash(INTRO/1000);
    sfx.reach(tier);
    box.dataset.tier = tier;
    box.onclick = ()=>{ const e=performance.now()-t0; if(e > INTRO+EXP && shrinkAt===null) shrinkAt = performance.now(); };

    const setGeo = (k,r0)=>{
      const fi = $("#frameInner").getBoundingClientRect();
      box.style.left   = r0.left+(fi.left-r0.left)*k+"px";
      box.style.top    = r0.top+(fi.top-r0.top)*k+"px";
      box.style.width  = r0.width+(fi.width-r0.width)*k+"px";
      box.style.height = r0.height+(fi.height-r0.height)*k+"px";
      box.style.borderRadius = 6*(1-k)+"px";
      box.classList.toggle("full", k>=1);
      $("#reachDim").style.opacity = (k*.85).toFixed(3);   // 後ろの台をふわっと暗く
    };
    const finish = ()=>{
      if(done) return; done = true;
      cancelAnimationFrame(raf);
      if(video){ video.pause(); video.onended = null; }
      box.classList.remove("show","full"); mon.classList.remove("live");
      $("#reachDim").style.opacity = 0;
      monitorOverride = null;
      resolve();
    };
    const frame = now=>{
      const e = now - t0;
      if(e >= INTRO+EXP-120) startVideo();
      if(shrinkAt===null && !video && e >= INTRO+EXP+FULL) shrinkAt = now;
      curT = clamp01((Math.min(e, shrinkAt!==null ? shrinkAt-t0 : e) - INTRO - EXP)/FULL);
      const r0 = $("#mc").getBoundingClientRect();
      let k;
      if(shrinkAt!==null){
        const p = clamp01((now-shrinkAt)/SHR);
        if(p>=1){ finish(); return; }
        k = 1-ease(p);
      } else k = e<INTRO ? -1 : ease(clamp01((e-INTRO)/EXP));

      if(k<0) box.classList.remove("show");
      else {
        box.classList.add("show"); setGeo(k, r0);
        const w = box.clientWidth, h = box.clientHeight;
        if(cv.width!==Math.round(w*dpr) || cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.save(); paint(ctx,w,h,false); ctx.restore();
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  });
}
const clamp01 = x=>Math.max(0,Math.min(1,x));
const eOut = x=>1-Math.pow(1-x,3);

const SCENES = {
  // ビール：画面いっぱいにビールが注がれ、泡があふれる
  beer(ctx,W,H,t,parts){
    ctx.fillStyle="#0d0702"; ctx.fillRect(0,0,W,H);
    const lvl = H*(1-eOut(clamp01(t/.7))*.92);
    const g = ctx.createLinearGradient(0,lvl,0,H); g.addColorStop(0,"#ffd24f"); g.addColorStop(1,"#c96a00");
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8) ctx.lineTo(x, lvl+Math.sin(x/38+t*18)*7);
    ctx.lineTo(W,H); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.7)";
    parts.forEach(p=>{ const y = H-((p.y*H + t*p.s*H*1.4)%H); if(y>lvl+10){ ctx.beginPath(); ctx.arc(p.x*W+Math.sin(t*10+p.a)*4, y, p.r*.7, 0, 7); ctx.fill(); }});
    // 泡
    const fh = 30+eOut(clamp01((t-.25)/.5))*70;
    ctx.fillStyle="#fffaf0";
    for(let x=-20;x<W+40;x+=34){ const y=lvl-fh*.4+Math.sin(x*.7+t*6)*6; ctx.beginPath(); ctx.arc(x, y, 26+Math.sin(x)*8, 0, 7); ctx.fill(); }
    ctx.fillRect(0, lvl-fh*.4, W, fh*.6);
  },
  // 日本酒：藍の夜に朱の筆が走り、桜が舞う
  sake(ctx,W,H,t,parts){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0b1a3d"); g.addColorStop(1,"#02040b");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,255,255,.05)"; for(let y=0;y<H;y+=6){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y+3); ctx.stroke(); }
    const p = eOut(clamp01((t-.04)/.3)), cy=H*.5, x1=W*.04+W*.92*p;
    for(let k=0;k<26;k++){
      ctx.strokeStyle=`rgba(${200+k%3*15},${30+k%5*6},${35},${.55+.02*k})`;
      ctx.lineWidth = 3+((k*37)%9); ctx.lineCap="round";
      const off=(k-13)*4.2;
      ctx.beginPath(); ctx.moveTo(W*.04, cy+off+Math.sin(k)*3);
      ctx.quadraticCurveTo((W*.04+x1)/2, cy+off-26*p, x1-((k*13)%30)*p, cy+off+18*p+Math.cos(k)*4); ctx.stroke();
    }
    parts.forEach(q=>{
      const y=((q.y*H + t*q.s*H*.9))%H, x=q.x*W+Math.sin(t*4+q.a)*30;
      ctx.save(); ctx.translate(x,y); ctx.rotate(q.a+t*q.w*6);
      ctx.fillStyle="rgba(255,190,205,.9)"; ctx.beginPath(); ctx.ellipse(0,0,q.r+3,q.r*.6+1.5,0,0,7); ctx.fill(); ctx.restore();
    });
  },
  // ワイン：深紅のうずとグラスの輝き
  wine(ctx,W,H,t,parts){
    ctx.fillStyle="#0c0105"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(let k=0;k<4;k++){
      const a=t*5+k*1.57, R=Math.min(W,H)*(.25+.06*k);
      const x=W/2+Math.cos(a)*R*.5, y=H/2+Math.sin(a)*R*.5;
      const g=ctx.createRadialGradient(x,y,0,x,y,R*1.2);
      g.addColorStop(0,`rgba(${200-k*20},10,${50+k*10},.55)`); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    parts.forEach(q=>{ const tw=(Math.sin(t*20+q.a*3)+1)/2; ctx.fillStyle=`rgba(255,215,140,${tw*.8})`;
      ctx.beginPath(); ctx.arc(q.x*W, q.y*H, q.r*.6*tw+.3, 0, 7); ctx.fill(); });
    ctx.globalCompositeOperation="source-over";
    // 波打つワインの水面
    const lvl = H*(1-.32*eOut(clamp01(t/.5)));
    const g=ctx.createLinearGradient(0,lvl,0,H); g.addColorStop(0,"#b0103c"); g.addColorStop(1,"#3a0010");
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8) ctx.lineTo(x, lvl+Math.sin(x/60+t*10)*12);
    ctx.lineTo(W,H); ctx.fill();
  }
};
function goldBurst(ctx,W,H,t){
  ctx.save(); ctx.translate(W/2,H*.45); ctx.rotate(t*2);
  const n=18, R=Math.hypot(W,H);
  for(let i=0;i<n;i++){ ctx.rotate(Math.PI*2/n); ctx.fillStyle=i%2?"rgba(255,215,80,.28)":"rgba(255,245,200,.12)";
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(R,-R*.09); ctx.lineTo(R,R*.09); ctx.fill(); }
  ctx.restore();
}
function drawTitle(ctx,W,H,t,m,rare){
  const p = clamp01((t-.18)/.16);
  if(p<=0) return;
  const sc = 2.6 - 1.6*easeOutBack(p), shake = p<1?0:Math.sin(t*90)*1.5;
  const main = rare ? "激アツ" : ({beer:"REACH!", sake:"好機", wine:"CHANCE"})[m];
  const sub  = rare ? "PREMIUM REACH" : ({beer:"泡立つリーチ", sake:"リーチ", wine:"リーチ"})[m];
  const latin = /^[A-Z!]+$/.test(main);
  const size = Math.min(W*.24, H*.4, 150) * (latin?.9:1);
  ctx.save(); ctx.translate(W/2+shake, H*.45); ctx.scale(sc,sc); ctx.globalAlpha=clamp01(p*1.5);
  ctx.font = latin ? `700 ${size}px Oswald, sans-serif` : `800 ${size}px "Shippori Mincho B1", serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const gr = ctx.createLinearGradient(0,-size/2,0,size/2);
  if(rare){ gr.addColorStop(0,"#fffbe0"); gr.addColorStop(.5,"#ffd34d"); gr.addColorStop(1,"#b77905"); }
  else if(m==="beer"){ gr.addColorStop(0,"#fff"); gr.addColorStop(1,"#ffcf4a"); }
  else if(m==="sake"){ gr.addColorStop(0,"#fff"); gr.addColorStop(1,"#d7e4ff"); }
  else { gr.addColorStop(0,"#fff"); gr.addColorStop(1,"#ffc0cf"); }
  ctx.lineWidth = size*.1; ctx.strokeStyle = rare?"#5a2a00":(m==="beer"?"#5a2a00":m==="sake"?"#7a0f12":"#3d0012");
  ctx.shadowColor = rare?"#ffb300":"rgba(0,0,0,.8)"; ctx.shadowBlur = 30;
  ctx.strokeText(main,0,0); ctx.shadowBlur=0; ctx.fillStyle=gr; ctx.fillText(main,0,0);
  ctx.font = `900 ${Math.max(16,size*.2)}px "Noto Sans JP", sans-serif`;
  ctx.fillStyle="#fff"; ctx.globalAlpha=clamp01((t-.3)/.1);
  ctx.fillText(sub, 0, size*.78);
  ctx.restore();
}

/* =================================================================
   効果音（外部ファイル不要）・振動・紙吹雪
   ================================================================= */
const sfx = (()=>{
  let ac=null, master=null, verb=null, noiseBuf=null;
  const ctx=()=>{
    try{
      if(!ac){
        ac=new (window.AudioContext||window.webkitAudioContext)();
        master=ac.createGain(); master.gain.value=.9;
        const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
        master.connect(comp).connect(ac.destination);
        // 残響（ホールっぽい響き）
        const len=ac.sampleRate*1.6, ir=ac.createBuffer(2,len,ac.sampleRate);
        for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
        verb=ac.createConvolver(); verb.buffer=ir; const vg=ac.createGain(); vg.gain.value=.28; verb.connect(vg).connect(master);
        noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
      }
      if(ac.state==="suspended") ac.resume();
    }catch(e){ ac=null; }
    return ac;
  };
  const out=(node,wet=0)=>{ node.connect(master); if(wet&&verb){ const g=ac.createGain(); g.gain.value=wet; node.connect(g).connect(verb); } };
  const tone=(f,dur,vol,type="square",when=0,slide=0,wet=0)=>{ if(!ac) return;
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+when;
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); out(g,wet); o.start(t); o.stop(t+dur+.05); };
  const noise=(dur,vol,type="bandpass",freq=1200,q=1,when=0,freqEnd=0,wet=0)=>{ if(!ac) return;
    const n=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(), t=ac.currentTime+when;
    n.buffer=noiseBuf; n.loop=true; f.type=type; f.frequency.setValueAtTime(freq,t); if(freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd,t+dur); f.Q.value=q;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(f).connect(g); out(g,wet); n.start(t); n.stop(t+dur+.05); };
  const chord=(fs,dur,vol,when,type="sawtooth",wet=.4)=>fs.forEach(f=>{ tone(f,dur,vol,type,when,0,wet); tone(f*1.004,dur,vol*.6,type,when,0,wet); });
  return {
    ctx,
    // リールが回る「カタカタ」
    tick:(f,v)=>{ noise(.03,v*6,"bandpass",2400+Math.random()*600,6); tone(f*.5,.02,v*.6,"triangle"); },
    // START：レバーを叩く「ガシャン」
    lever:()=>{ noise(.09,.5,"bandpass",900,1.4); noise(.25,.25,"lowpass",400,1,.02); tone(95,.22,.5,"sine",0,55); tone(1800,.05,.12,"square",.03); },
    // STOP：リールが止まる「ガチッ」
    clunk:()=>{ noise(.05,.6,"highpass",3000,1); tone(160,.12,.45,"sine",0,70); noise(.08,.25,"bandpass",600,2,.01); },
    // 最後のリールがすべるときの「カチッ…カチッ」
    slide:p=>{ noise(.04,.35,"bandpass",2200-p*900,5); tone(320-p*120,.05,.18,"triangle"); },
    // リーチ：色ごとに音が派手になる
    reach:tier=>{
      const lv = {blue:0, green:1, red:2, gold:3, rainbow:4}[tier] ?? 3;
      noise(.5,.35,"bandpass",400,1,0,4000,.5);                                    // シュワッ
      const arp=[523,659,784,1047,1319,1568,2093].slice(0,4+lv);
      arp.forEach((f,i)=>{ tone(f,.18,.14,"square",.05+i*.07,0,.3); tone(f*2,.12,.04,"triangle",.05+i*.07); });
      if(lv>=2){ tone(400,.5,.18,"sawtooth",.1+arp.length*.07,2600,.4); }       // キュイン
      if(lv>=3){ chord([523,659,784],.9,.06,.2+arp.length*.07); noise(1.2,.12,"highpass",6000,.7,.2+arp.length*.07,0,.6); }
      if(lv>=4){ chord([587,740,880,1175],1.2,.05,.6+arp.length*.07); }
    },
    // 当たり：和音のファンファーレ（7は豪華に）
    fanfare:rare=>{
      const seq = rare ? [[523,659,784],[587,740,880],[659,830,988],[784,988,1175,1568]] : [[523,659,784],[659,784,1047]];
      seq.forEach((c,i)=>chord(c, i===seq.length-1?1.4:.24, .07, i*.18));
      noise(rare?1.8:1,.15,"highpass",5000,.7,seq.length*.18-.18,0,.7);         // シャーン
      tone(rare?130:196, 1.2, .25, "sine", seq.length*.18-.18);
    },
    feed:()=>{ noise(1.5,.22,"bandpass",600,2,0,2400,.2); tone(160,1.45,.08,"sawtooth",0,420); tone(1400,.06,.12,"square",1.5); tone(1900,.1,.1,"square",1.58); },
    flip:()=>{ noise(.25,.3,"bandpass",2200,2,0,600,.3); tone(500,.3,.08,"triangle",0,1200,.3); },
    spin:()=>{ for(let i=0;i<7;i++) noise(.09,.22,"bandpass",1500+i*180,3,i*.16,0,.3); tone(300,1.1,.1,"sawtooth",0,1400,.3); },
    goldopen:()=>{ tone(800,.5,.12,"triangle",0,2400,.5); noise(.6,.2,"highpass",5000,.7,.05,0,.6); [1047,1319,1568,2093].forEach((f,i)=>tone(f,.25,.08,"square",.1+i*.06,0,.4)); },
    heart:()=>{ [0,.32,.64].forEach(w=>{ tone(62,.16,.6,"sine",w,40); tone(58,.14,.45,"sine",w+.14,38); }); },
    suck:()=>{ tone(300,.7,.12,"sine",0,1800,.4); noise(.7,.18,"bandpass",600,2,0,5000,.5); tone(1568,.18,.1,"triangle",.62,0,.5); },
    hop:()=>{ tone(420,.12,.1,"triangle",0,880); noise(.05,.15,"bandpass",1500,2); },
    // 予告：ドーン
    boom:()=>{ tone(70,1.1,.7,"sine",0,32); noise(.9,.4,"lowpass",300,1,0,80,.6); },
    // 予告：キキーッ（急ブレーキ）
    screech:()=>{ noise(.9,.35,"bandpass",2600,9,0,1700,.3); tone(1900,.8,.06,"sawtooth",0,1500); },
    miss:()=>{ tone(330,.25,.08,"triangle",0,220); },
  };
})();
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function confetti(n){
  const cols=["#ffd34d","#ff6b8b","#8fb8ff","#ffffff","#7ee0a1"];
  for(let i=0;i<n;i++){
    const s=document.createElement("div"); s.className="sparkle";
    s.style.left=Math.random()*100+"vw"; s.style.top="-20px"; s.style.background=pick(cols);
    s.style.animationDuration=1.6+Math.random()*1.6+"s"; s.style.animationDelay=Math.random()*.5+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),4000);
  }
}
