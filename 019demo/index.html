<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>開運あみだdemo</title>
<meta name="theme-color" content="#07060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Yuji+Boku&display=swap">
<style>
/* Layout: 全画面のWebGLステージに、セーフエリアを守ったHTMLレイヤーを重ねる。単一の暗色テーマ(漆黒×金継ぎ×灯籠) */
:root{
  --ink:#07060a; --lacquer:#100d0b; --gold:#d8aa52; --gold-hi:#f3d58e; --shu:#c63e2b; --washi:#efe7d8;
  --mist:rgba(239,231,216,.64); --line:rgba(216,170,82,.4);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  /* ボタン・案内の調整値(金の色/光の筋の周期/案内の時間) */
  --gold-dk:#8f6420; --gold-mid:#c99a46; --gold-glow:rgba(243,213,142,.5);
  --streak-period:5.2s;      /* 主ボタンの光の筋が横切る周期 */
  --streak-first:1.2s;       /* 最初の筋が走るまで */
  --streak-alpha:.36;        /* 光の筋の明るさ */
  --btn-aura:.14;            /* 主ボタン周囲の常時の金のにじみ */
  --ripple-ms:700ms;         /* 押下の波紋 */
  --guide-fade:.8s;          /* 案内のふわっと出る時間 */
  --guide-pulse:1.9s;        /* 約5秒触らなかったときの脈動の周期 */
  --finger-bob:2.2s;         /* 指アイコンの上下の周期 */
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--washi);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none;
  position:fixed;inset:0;width:100%}   /* iOSのバウンド(画面ごと引っ張られる動き)を止める */
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;-webkit-touch-callout:none}

.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:5;pointer-events:none;transition:height 1s cubic-bezier(.6,0,.2,1)}
.bar.top{top:0}.bar.bottom{bottom:0}
body.cine .bar.top{height:calc(7vh + env(safe-area-inset-top,0px))}
body.cine .bar.bottom{height:calc(7vh + env(safe-area-inset-bottom,0px))}

.layer{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 26px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  opacity:0;transition:opacity .7s ease}
.layer.in{opacity:1}
.layer button,.layer details{pointer-events:auto}

#loading{align-items:center;justify-content:center;gap:16px;opacity:1;background:var(--ink);z-index:30}
#loading svg{width:84px;height:84px}
#enso{transition:stroke-dashoffset .5s ease}
#load-text{margin:0;font-family:var(--f-display);letter-spacing:.4em;color:var(--mist);font-size:13px;text-align:center;max-width:30ch}
#load-text.err{letter-spacing:.05em;line-height:1.8}

#title{justify-content:space-between}
#title::before{content:"";position:fixed;inset:auto 0 0 0;height:56%;background:linear-gradient(to top,rgba(5,4,6,.93) 36%,rgba(5,4,6,0));z-index:-1}
#result::before{content:"";position:fixed;inset:auto 0 0 0;height:44%;background:linear-gradient(to top,rgba(5,4,6,.94) 42%,rgba(5,4,6,0));z-index:-1}
.brand{position:relative;isolation:isolate;align-self:flex-start;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 20px 10px 14px}
.brand::before{content:"";position:absolute;inset:3px;z-index:-1;border-radius:20px;background:rgba(252,250,245,.6);box-shadow:0 0 14px 9px rgba(252,250,245,.45)}   /* 枠は無し。ロゴと店名の後ろにだけ、縁がぼやけた白い下地を敷き、元の色(黒)のまま読めるようにする */
.brand img{display:block;height:46px;width:auto;flex:none}
.brand #store-word{height:40px}
.brand #store-logo{display:none}   /* デモ版:ロゴは社名の画像に含まれるので出さない */   /* 店名は、ロゴ画像の文字部分をそのまま使う */   /* 白・透過のロゴ */
#store-name{font-family:"Yuji Boku",var(--f-display);font-size:22px;line-height:1.1;letter-spacing:.1em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}   /* ロゴに合わせた筆の書体 */
.seal{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--shu);color:#fbe9d6;font-family:var(--f-display);font-weight:800;font-size:15px;border-radius:3px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.eyebrow{margin:0;font-size:14px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.goldtext{background:linear-gradient(170deg,#fff1c4 0%,#e6b65e 42%,#a8792b 70%,#f3d58e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold-hi)}
.ttl{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(48px,15vw,76px);line-height:1.05;letter-spacing:.08em;filter:drop-shadow(0 0 18px rgba(216,170,82,.28))}
.sub{margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:.14em}
.meta{margin:0;font-size:13px;letter-spacing:.12em;color:var(--mist)}
.btn,.ghost{appearance:none;-webkit-appearance:none;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-display);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn .lbl,.ghost .lbl{position:relative;z-index:3}
.lock{pointer-events:none!important}
/* 主ボタン:漆塗りの板に、金の縁(金継ぎ) */
.btn{width:100%;max-width:320px;min-height:56px;padding:15px 0 14px;margin-top:6px;font-weight:600;font-size:19px;letter-spacing:.38em;text-indent:.38em;color:var(--gold-hi);
  border:1.5px solid transparent;border-radius:2px;
  background:
    repeating-linear-gradient(90deg,rgba(255,244,214,.016) 0 1px,transparent 1px 3px,rgba(0,0,0,.05) 3px 4px,transparent 4px 7px) padding-box,   /* 木目/和紙のごく薄いノイズ */
    radial-gradient(120% 90% at 30% 0%,rgba(255,236,190,.07),transparent 60%) padding-box,
    linear-gradient(180deg,#221b15 0%,#120e0b 46%,#070605 100%) padding-box,
    linear-gradient(112deg,var(--gold-hi) 0%,var(--gold-dk) 24%,var(--gold-hi) 46%,var(--gold-mid) 62%,var(--gold-dk) 80%,var(--gold-hi) 100%) border-box;
  box-shadow:inset 0 1px 0 rgba(255,240,200,.3),inset 0 -1px 0 rgba(0,0,0,.7),0 5px 12px rgba(0,0,0,.62),0 0 26px rgba(216,170,82,var(--btn-aura));
  transition:transform .14s ease,box-shadow .2s ease}
.btn .lbl{background:linear-gradient(170deg,#fff3cc 0%,#f0c46c 42%,#d9a64d 68%,#f6dc9a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold-hi);text-shadow:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
/* 金継ぎ:縁の一部だけが太く光る */
.btn::before{content:"";position:absolute;z-index:2;right:12%;bottom:-1px;width:26%;height:3px;border-radius:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff1c4 30%,#f3d58e 70%,transparent);box-shadow:0 0 9px rgba(243,213,142,.85)}
/* 光の筋:数秒に一度、左から右へ */
.btn::after{content:"";position:absolute;z-index:2;top:0;bottom:0;left:0;width:30%;pointer-events:none;transform:translateX(-160%) skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,238,185,var(--streak-alpha)),transparent);animation:streak var(--streak-period) ease-in-out var(--streak-first) infinite}
@keyframes streak{0%{transform:translateX(-160%) skewX(-18deg)}34%,100%{transform:translateX(480%) skewX(-18deg)}}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:inset 0 0 0 1px var(--gold-hi),inset 0 0 26px rgba(243,213,142,.42),inset 0 1px 0 rgba(255,240,200,.2),0 1px 4px rgba(0,0,0,.6),0 0 30px rgba(243,213,142,.28)}
.btn:disabled,.ghost:disabled{cursor:default;pointer-events:none}
.btn:disabled{opacity:.5;filter:saturate(.45)}
.btn:disabled::after{animation:none}
@media (hover:hover){.btn:hover{box-shadow:inset 0 1px 0 rgba(255,240,200,.4),inset 0 -1px 0 rgba(0,0,0,.7),0 5px 14px rgba(0,0,0,.62),0 0 34px rgba(243,213,142,.26)}
  .ghost:hover{border-color:rgba(243,213,142,.85);background-color:rgba(24,18,12,.7)}}
/* 副ボタン:細い金の縁だけの、控えめな板 */
.ghost{min-height:48px;min-width:180px;padding:11px 24px;color:#efe7d8;font-weight:500;font-size:15px;letter-spacing:.22em;text-indent:.22em;
  background:rgba(10,8,7,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(216,170,82,.55);border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,240,200,.1);transition:transform .14s ease,background-color .2s ease,border-color .2s ease}
.ghost:active{transform:translateY(1px) scale(.98);border-color:var(--gold-hi);background-color:rgba(216,170,82,.16);box-shadow:inset 0 0 16px rgba(243,213,142,.28)}
.ghost small{display:block;font-family:var(--f-body);font-size:14px;font-weight:500;letter-spacing:.08em;text-indent:0;color:#f1eadb;line-height:1.35;margin-top:2px}
/* 押下の波紋 */
.rip{position:absolute;z-index:1;border-radius:50%;pointer-events:none;transform:scale(0);opacity:.55;
  background:radial-gradient(circle,rgba(255,236,180,.75) 0,rgba(243,213,142,.35) 38%,transparent 68%);animation:ripple var(--ripple-ms) ease-out forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}


#skipLayer{justify-content:flex-end;align-items:center;z-index:12;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
/* スキップの案内:枠なしの文字だけを、ゆっくり点滅させる(押せる範囲は従来どおり。点滅は約0.55Hzで、速い点滅にはしない) */
#btn-skip{--skip-blink:1.8s;appearance:none;-webkit-appearance:none;background:none;border:0;box-shadow:none;border-radius:0;min-height:48px;min-width:200px;padding:11px 22px;margin:0;
  font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.14em;text-indent:.14em;color:#f6efe0;text-shadow:0 1px 8px #000,0 0 14px #000;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;animation:skipblink var(--skip-blink) ease-in-out infinite}
@keyframes skipblink{0%,100%{opacity:.3}50%{opacity:1}}

#result{justify-content:flex-end;align-items:center;text-align:center}
.r-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:360px}
details{width:100%;text-align:left;font-size:13px;color:var(--mist);margin-top:4px}
summary{cursor:pointer;letter-spacing:.14em;text-align:center;list-style:none}
summary::-webkit-details-marker{display:none}
#r-route{margin:6px 0 0;padding:8px 10px 8px 2em;max-height:20vh;overflow:auto;background:rgba(16,13,11,.9);border:1px solid var(--line);border-radius:2px;line-height:1.8}

#menu{justify-content:flex-end;align-items:center}
.m-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:360px}
/* くじ選択の案内 */
#guide{--guide-top:36%;justify-content:flex-start;align-items:center;text-align:center;z-index:11;padding-top:var(--guide-top)}   /* 札のすぐ下に出す(位置は guidePlace が札の下端に合わせる) */
#guide::before{content:"";position:absolute;left:0;right:0;top:calc(var(--guide-top) - 6px);height:96px;background:linear-gradient(180deg,transparent 0%,rgba(7,6,10,.62) 30%,rgba(7,6,10,.62) 70%,transparent 100%);pointer-events:none}
.g-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(10px);transition:transform var(--guide-fade) ease}
#guide.in .g-wrap{transform:none}
.g-finger{flex:none;fill:rgba(12,9,7,.55);stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:28px;height:28px;color:#f3d58e;filter:drop-shadow(0 0 6px rgba(243,213,142,.6));animation:fingerbob var(--finger-bob) ease-in-out infinite}
.g-text{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;white-space:nowrap;color:#fff1c4;text-shadow:0 1px 10px #000,0 0 18px rgba(0,0,0,.9)}
#guide.strong .g-text{color:#fff;animation:guidepulse var(--guide-pulse) ease-in-out infinite}
#guide.strong .g-finger{color:#fff;filter:drop-shadow(0 0 10px rgba(255,236,170,.95))}
@keyframes fingerbob{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@keyframes guidepulse{0%,100%{opacity:.82;text-shadow:0 1px 10px #000}50%{opacity:1;text-shadow:0 1px 10px #000,0 0 16px rgba(255,226,150,.85)}}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#result .btn{min-height:60px;font-size:20px;max-width:340px}
#result .ghost{margin-top:2px;min-width:180px;opacity:.92}
#result.in .btn::after{animation:streak 1.5s ease-in-out .5s 1 both}   /* 結果ボタンが現れたとき、光の筋を一度だけ */
#quality{position:fixed;z-index:11;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
  font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:rgba(239,231,216,.3);pointer-events:none}
#fade{position:fixed;inset:0;background:#000;z-index:40;opacity:0;pointer-events:none;transition:opacity .45s ease}
#fade.on{opacity:1}
/* 演出の確認パネル(アーティファクト版のみ) */
#pv{display:flex;flex-direction:column;align-items:flex-end;position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:60;font-family:var(--f-display);font-size:13px;color:#efe7d8}
#pv-open{appearance:none;border:1px solid rgba(216,170,82,.6);background:rgba(12,9,7,.72);color:#f3d58e;border-radius:14px;padding:4px 12px;font:inherit;letter-spacing:.1em;min-height:32px}
#pv[hidden]{display:none}
#pv-box{margin-top:6px;padding:10px 12px;width:210px;background:rgba(12,9,7,.92);border:1px solid rgba(216,170,82,.5);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#pv-box[hidden]{display:none}
#pv-box h3{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.1em;color:#d8aa52}
#pv-box .pv-row{display:flex;gap:6px;margin-bottom:10px}
#pv-box .pv-row button{flex:1;appearance:none;border:1px solid rgba(216,170,82,.4);background:transparent;color:#efe7d8;border-radius:4px;padding:8px 2px;font:inherit;font-size:12px;min-height:40px}
#pv-box .pv-row button.on{background:rgba(216,170,82,.22);border-color:#f3d58e;color:#fff1c4}
#pv-box label{display:flex;align-items:center;gap:8px;min-height:36px}
#pv-box p{margin:6px 0 0;font-size:11px;line-height:1.5;color:rgba(239,231,216,.65)}
/* 開発用の表示は #debug のときだけ */
body:not(.debug) #quality,body:not(.debug) #result details{display:none}

/* 横向きのスマホ:縦向きをお願いする */
#rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--ink);color:var(--washi);text-align:center;font-family:var(--f-display);letter-spacing:.2em;font-size:16px}
#rotate small{font-family:var(--f-body);font-size:13px;letter-spacing:.12em;color:var(--mist)}
#rotate svg{width:56px;height:56px;color:var(--gold);animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:520px){#rotate{display:flex}}

/* タイトル:最初の3秒で、文字が一字ずつ浮かび、金の光が走る */
.ttl .ch{display:inline-block;background:linear-gradient(110deg,#a8792b 0%,#e6b65e 30%,#fff6d8 46%,#e6b65e 60%,#a8792b 100%);background-size:320% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold-hi);opacity:0}
#title .brand,#title .eyebrow,#title .sub,#title .meta,#btn-start{opacity:0}
#title.in .brand{animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}
#title.in .eyebrow{animation:spread 1.4s .35s cubic-bezier(.2,.7,.2,1) both}
#title.in .ttl .ch{animation:ink 1.1s cubic-bezier(.2,.7,.2,1) both,shine 5s linear infinite;animation-delay:calc(.5s + var(--i) * .12s),calc(1.9s + var(--i) * .1s)}
/* 3Dタイトル文字の表示中:HTMLの文字は見た目だけ隠す(要素と aria-label は残すので読み上げは従来どおり) */
.ttl3d #title .ttl{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);opacity:0;white-space:nowrap}
#title.in .sub{animation:rise .9s 1.15s cubic-bezier(.2,.7,.2,1) both}
#title.in .meta{animation:rise .9s 1.3s cubic-bezier(.2,.7,.2,1) both}
#title.in #btn-start{animation:rise .9s 1.45s cubic-bezier(.2,.7,.2,1) both,breathe 2.8s 2.4s ease-in-out infinite}
.tap-sub{margin:-2px 0 0;font-size:14px;letter-spacing:.3em;text-indent:.3em;color:#f1eadb;text-shadow:0 1px 8px #000;opacity:0}
#title.in .tap-sub{animation:rise .9s 1.7s cubic-bezier(.2,.7,.2,1) both,subfade 2.8s 2.6s ease-in-out infinite}
@keyframes subfade{0%,100%{color:#d9cfb9}50%{color:#fff4d6}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spread{from{opacity:0;letter-spacing:1em}to{opacity:1;letter-spacing:.36em}}
@keyframes ink{0%{opacity:0;filter:blur(10px);transform:translateY(18px) scale(1.15)}60%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes shine{0%{background-position:100% 0}35%,100%{background-position:0 0}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 6px rgba(216,170,82,.12))}50%{filter:drop-shadow(0 0 16px rgba(243,213,142,.5))}}

/* 2D表示(WebGLが使えない端末)の開運メニュー */
#menu.flat{justify-content:center;gap:14px;padding-top:calc(env(safe-area-inset-top,0px) + 62px)}   /* 右上の音ボタンと重ならない */
.card2d{width:100%;max-width:340px;max-height:calc(100dvh - 150px);overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;background:linear-gradient(170deg,#1a1511,#0a0807);border:1px solid var(--gold);border-radius:4px;
  box-shadow:inset 0 0 0 5px #0b0907,inset 0 0 0 6px rgba(216,170,82,.35),0 18px 50px rgba(0,0,0,.6);padding:16px 16px 18px;text-align:left}
.c2-title{margin:0 0 10px;text-align:center;font-family:var(--f-display);font-size:16px;letter-spacing:.3em;color:var(--gold-hi)}
.c2-photo{position:relative;height:min(250px,31vh);border-radius:3px;overflow:hidden;border:1px solid rgba(216,170,82,.6);background:#0b0907}
.c2-photo img{position:relative;width:100%;height:100%;object-fit:contain;display:block}   /* 写真は見切れないよう全体を見せる */
.c2-photo img.bg{position:absolute;inset:0;object-fit:cover;filter:blur(14px) brightness(.55);transform:scale(1.25)}   /* 余った左右は、ぼかした同じ写真で埋める */
.c2-photo .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:42px;color:rgba(243,213,142,.85)}
.c2-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,5,.25),rgba(8,6,5,0) 30%,rgba(8,6,5,0) 60%,rgba(8,6,5,.5))}

<!-- =========================================================
     1. ロジック層(DOMにも描画にも依存しない。3D版でもそのまま使う)
     ========================================================= -->
<script id="amida-logic">
(function (root) {
  'use strict';

  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const randInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

  /**
   * 横線を生成する。
   * 高さは rows 段の離散値。同じ段で隣り合う隙間に横線を置かない(=同じ縦線を共有しない)。
   * 横線の総数は minRungs〜maxRungs、各隙間に最低 minPerGap 本(未指定なら1本)。
   * @returns {{lanes:number, rows:number, rungs:{row:number,gap:number,y:number}[]}}
   */
  function generateLadder(opt, rng) {
    const { lanes = 3, rows = 10, minRungs = 4, maxRungs = 7, avoidSameGapOnNextRow = true, minPerGap = 1 } = opt;
    const gaps = lanes - 1;
    for (let attempt = 0; attempt < 100; attempt++) {
      const target = randInt(rng, minRungs, maxRungs);
      const grid = Array.from({ length: rows }, () => new Array(gaps).fill(false));
      const cells = [];
      for (let r = 0; r < rows; r++) for (let g = 0; g < gaps; g++) cells.push([r, g]);
      let count = 0;
      for (const [r, g] of shuffle(cells, rng)) {
        if (count >= target) break;
        if (grid[r][g - 1] || grid[r][g + 1]) continue;                 // 同じ高さで隣と重なる
        if (avoidSameGapOnNextRow && ((r > 0 && grid[r - 1][g]) || (r < rows - 1 && grid[r + 1][g]))) continue; // 真上/真下の段に同じ横線(行って戻るだけになる)
        grid[r][g] = true; count++;
      }
      const perGap = Array.from({ length: gaps }, (_, g) => grid.filter(row => row[g]).length);
      if (count >= minRungs && perGap.every(n => n >= minPerGap)) {
        const rungs = [];
        grid.forEach((row, r) => row.forEach((on, g) => { if (on) rungs.push({ row: r, gap: g, y: (r + 1) / (rows + 1) }); }));
        return { lanes, rows, rungs };
      }
    }
    throw new Error('ladder generation failed');
  }

  /**
   * 入口 start から線をたどる。
   * route は通過点の配列。lane=縦線番号(0始まり)、y=0(上端)〜1(下端)。
   */
  function traceRoute(ladder, start) {
    const at = new Map(ladder.rungs.map(r => [r.row + ':' + r.gap, r]));
    let lane = start;
    const route = [{ lane, y: 0, kind: 'start' }];
    for (let row = 0; row < ladder.rows; row++) {
      const right = at.get(row + ':' + lane), left = at.get(row + ':' + (lane - 1));
      const rung = right || left;
      if (!rung) continue;
      route.push({ lane, y: rung.y, kind: 'turn', row });
      lane = right ? lane + 1 : lane - 1;
      route.push({ lane, y: rung.y, kind: 'cross', row, gap: rung.gap });
    }
    route.push({ lane, y: 1, kind: 'end' });
    return { start, end: lane, route };
  }

  /** 全入口の行き先(順列になる) */
  function mapping(ladder) { return Array.from({ length: ladder.lanes }, (_, i) => traceRoute(ladder, i).end); }

  /* 経路の長さと補間。横1マス=1、縦の全長=heightUnits の抽象空間で測る */
  function segLen(a, b, H) { return Math.abs(b.lane - a.lane) + Math.abs(b.y - a.y) * H; }
  function routeLength(route, H) { let L = 0; for (let i = 1; i < route.length; i++) L += segLen(route[i - 1], route[i], H); return L; }
  function pointAt(route, t, H) {
    const L = routeLength(route, H); let d = Math.max(0, Math.min(1, t)) * L;
    for (let i = 1; i < route.length; i++) {
      const a = route[i - 1], b = route[i], s = segLen(a, b, H);
      if (d <= s || i === route.length - 1) {
        const k = s > 0 ? Math.min(1, d / s) : 1;
        return { lane: a.lane + (b.lane - a.lane) * k, y: a.y + (b.y - a.y) * k, seg: i - 1 };
      }
      d -= s;
    }
    const e = route[route.length - 1]; return { lane: e.lane, y: e.y, seg: route.length - 2 };
  }

  /* ---------- ゲーム状態(状態遷移と時間の進行だけを持つ) ---------- */
  class AmidaGame {
    constructor(config, rng = Math.random) {
      this.cfg = config; this.rng = rng; this.state = 'start'; this.stateTime = 0; this.listeners = {};
      this.ladder = generateLadder(config.ladder, rng);   // スタート画面の背景用
      this.results = config.results.map(r => r.id);
      this.revealed = this.results.map(() => false);
      this.chosen = null; this.trace = null; this.progress = 0; this.drawProgress = 0; this.speedMul = 1; this.round = 0;
    }
    on(ev, fn) { (this.listeners[ev] ||= []).push(fn); return this; }
    emit(ev, data) { (this.listeners[ev] || []).forEach(fn => fn(data, this)); }
    setState(s) { this.state = s; this.stateTime = 0; this.emit('state', s); }

    /** スタート→くじ選択 / もう一度 */
    newRound() {
      this.round++;
      this.ladder = generateLadder(this.cfg.ladder, this.rng);
      this.results = shuffle(this.cfg.results.map(r => r.id), this.rng);   // 下端の運勢をシャッフル
      this.revealed = this.results.map(() => false);
      this.chosen = null; this.trace = null; this.progress = 0; this.drawProgress = 0; this.speedMul = 1;
      this.setState('select');
    }
    /** 入口を選ぶ → 経路アニメへ */
    choose(lane) {
      if (this.state !== 'select' || lane < 0 || lane >= this.ladder.lanes) return false;
      this.chosen = lane;
      this.trace = traceRoute(this.ladder, lane);
      this.length = routeLength(this.trace.route, this.cfg.heightUnits);
      this.drawProgress = this.cfg.hideRungsUntilChosen ? 0 : 1;
      this.setState('animating');
      return true;
    }
    skip() { if (this.state === 'animating') this.speedMul = this.cfg.skipMultiplier; }

    update(dt) {
      this.stateTime += dt;
      if (this.state !== 'animating') return;
      const d = dt * this.speedMul;
      if (this.drawProgress < 1) { this.drawProgress = Math.min(1, this.drawProgress + d / this.cfg.drawDuration); return; }
      this.progress = Math.min(1, this.progress + d * this.cfg.speed / this.length);
      if (this.progress >= 1) this.finish();
    }
    finish() {
      this.progress = 1;
      this.revealed = this.results.map(() => true);
      this.setState('result');
      this.emit('result', this.result());
    }
    result() {
      if (!this.trace) return null;
      const id = this.results[this.trace.end];
      return { start: this.trace.start, end: this.trace.end, fortune: this.cfg.results.find(r => r.id === id), route: this.trace.route,
               mapping: mapping(this.ladder), ladder: this.ladder, bottom: this.results.slice() };
    }
    /** 描画側に渡すスナップショット(描画はこれだけを見る) */
    view() {
      const ball = this.trace && this.state !== 'select' && this.drawProgress >= 1 ? pointAt(this.trace.route, this.progress, this.cfg.heightUnits) : null;
      return { state: this.state, stateTime: this.stateTime, ladder: this.ladder, results: this.results, revealed: this.revealed,
               chosen: this.chosen, trace: this.trace, progress: this.progress, drawProgress: this.drawProgress, ball,
               hideRungs: this.cfg.hideRungsUntilChosen && (this.state === 'select' || this.state === 'start'),
               heightUnits: this.cfg.heightUnits, resultsDef: this.cfg.results };
    }
  }

  root.AmidaLogic = { shuffle, generateLadder, traceRoute, mapping, routeLength, pointAt, AmidaGame };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script type="importmap">
{ "imports": {

<script type="module">
let THREE = null;   // 3Dが使えるときだけ、起動時に import('three') で読み込む

/* =========================================================
   3. アプリ設定(ロジック層の CONFIG は骨格版と同じ形)
   ========================================================= */
// レア演出「超大吉」の発動率。結果が確定した瞬間に1回だけ抽選する
// 確認用:URLに ?rare=1 で必ず発動、?rare=0 で発動しない(#rare=1 / #rare=0 でも可)
const RARE_RATE = 0.25;

const preview = { rare: null, slow: false };

/* 効果音:この店では音声を使わないので、既定は無音(音声ボタンも置いていない)。鳴らしたいときは true に */
const SOUND_ENABLED = false;
// 操作案内・ボタンの調整値(見た目の色/周期は CSS の :root 変数)
const UI_FX = {
  guideGap: 14,          // 案内(指の絵)と御札の下端のすき間(px)
  guideDelay: .8,        // くじ選択に入ってから、案内が出るまで(秒)
  guideEmphasis: 5,      // 何も触らずにこの秒数たつと、案内を強調(秒)
  pressLock: 600,        // 押した直後に、ボタンを無効にする時間(ms。二重実行の防止)
  haptic: 10             // ボタン押下の振動(ms)
};
// 御札(入口)の金の縁の明滅(選択中だけ)。amp は光の増え方(上限=素の約2倍)、period は1往復の秒数(3秒以上でゆっくり)
const OFUDA_BLINK = { amp: .9, period: 3.4, stagger: .9 };
// 御札の「縁の光」(選択中だけ。どこをタップするかを示す)。base:常にある光の強さ(0〜1)、amp:明滅で増える量、
// width:縁の太さ(札テクスチャ256px基準)、blur:にじみの大きさ、fade:出入りの速さ(大きいほど速い)。動きを減らす設定では明滅せず base のまま

const RARE_READ = { glowK: .42, emissiveL: .5, kickK: .65, light2d: 74, outline2d: .8 };
const OFUDA_EDGE = { base: .5, amp: .35, width: 7, blur: 22, fade: 5, color: '#ffd37a', blur2d: 16 };

const RUNG_FX = {
  // リズム(横線を引く時間 drawDuration の中での割り当て)
  endAt: .8,             // 最後の横線が伸び切る位置(0〜1)。残りは「全体が光ってから玉が動き出す」までの間

  overshoot: 1.1,        // 先端の行き過ぎ量(easeOutBack の係数。0で無し、1.1で約4%行き過ぎて戻る)

  jointSize: .55,        // 分岐点の光の大きさ(3D・ワールド単位)
  laneGlow: .8,          // 分岐点が灯った瞬間に、縦線の芯が明るくなる量
  tipGlow: 2.2,          // 伸びている間の先端の明るさ(先端ほど明るいグラデーション)
  settleGlow: 2.4,       // 伸び切った瞬間に横線全体がふっと光る量(r.glow)
  connectFlash: .05,     // 接続の瞬間の画面の閃光(FLASH_MAX 以下に丸められる)
  finalGlow: 1.1,        // 全部出そろった瞬間に、ラダー全体が一度だけ光る量(S.panelGlow)

  connectSparks: 16,     // 接続の瞬間に弾ける火花の数

/* ---------------------------------------------------------
   超大吉の抽選。結果が確定した瞬間に1回だけ引く。実際に引いた回数と当たりは rareStats に記録される
   コンソールで window.amidaRareSim(1000) を実行すると、抽選の偏りを検証できる(実ゲームのロジックで1000ラウンド回す)
   --------------------------------------------------------- */
const rareStats = { rolls: 0, hits: 0 };

window.amidaRareStats = rareStats;
window.amidaRareSim = (n = 1000, rate = RARE_RATE) => {
  const ids = CONFIG.results.map(r => r.id), tab = Object.fromEntries(ids.map(id => [id, { rounds: 0, rare: 0 }]));
  let hits = 0, run = 0, maxRun = 0, gap = 0, maxGap = 0;
  const g = new window.AmidaLogic.AmidaGame(CONFIG);
  for (let i = 0; i < n; i++) {
    g.newRound(); g.choose(Math.floor(Math.random() * CONFIG.ladder.lanes)); g.finish();
    const base = g.result().fortune.id, hit = rollRare(rate);   // 本番と同じ関数
    tab[base].rounds++; if (hit) { hits++; tab[base].rare++; run++; maxRun = Math.max(maxRun, run); maxGap = Math.max(maxGap, gap); gap = 0; } else { run = 0; gap++; }

  let chi = 0; ids.forEach(id => { const t = tab[id], e1 = t.rounds * p, e0 = t.rounds * (1 - p); if (e1 > 0) chi += (t.rare - e1) ** 2 / e1 + ((t.rounds - t.rare) - e0) ** 2 / e0; });

    byFortune: tab, chi2: +chi.toFixed(2), chi2Ok: chi < 5.99 };

  return out;
};

  const q = new window.URLSearchParams(location.search).get('rare') ?? new window.URLSearchParams(location.hash.replace(/^#/, '')).get('rare');
  if (q === '1') return true; if (q === '0') return false;
  return /super/.test(location.hash) ? true : null;
}
const DEBUG = /debug/.test(location.hash + location.search);     // #debug:経路データと品質表示を出す
const FORCE2D = /2d/.test(location.hash + location.search);      // #2d:2D表示を強制(確認用)
document.body.classList.toggle('debug', DEBUG);
if (PREVIEW_PANEL) {   // 演出の確認パネル:設定は preview に入るだけ(ロジックには触らない)
  const pv = $('#pv'), box = $('#pv-box'); pv.hidden = false;
  try { const v = localStorage.getItem('pvRare'); preview.rare = v === '1' ? true : v === '0' ? false : null; preview.slow = localStorage.getItem('pvSlow') === '1'; } catch (e) { /* 保存できない環境では毎回初期値 */ }
  const sync = () => { const cur = preview.rare === null ? '' : preview.rare ? '1' : '0'; pv.querySelectorAll('#pv-rare button').forEach(b => b.classList.toggle('on', b.dataset.v === cur)); $('#pv-slow').checked = preview.slow; };
  ['pointerdown', 'pointerup', 'click', 'touchstart'].forEach(t => pv.addEventListener(t, e => e.stopPropagation()));
  $('#pv-open').addEventListener('click', () => { box.hidden = !box.hidden; });
  $('#pv-rare').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; preview.rare = b.dataset.v === '' ? null : b.dataset.v === '1'; try { localStorage.setItem('pvRare', b.dataset.v); } catch (er) { /* 保存は任意 */ } sync(); });

}

const VIBE = { super: [40, 50, 40, 50, 180], dai: [35, 40, 90, 40, 150], chu: [30, 40, 70], sho: [24] };
const haptic = p => { if (reduceMotion || !navigator.vibrate) return; try { navigator.vibrate(p); } catch (e) { /* 非対応 */ } };

// 描画層からのできごと → 効果音と振動
let rungIdx = 0;
function onRenderEvent(name, d) {
  switch (name) {
    case 'draw': sfx.brush(); break;
    case 'connect': sfx.connect(d.i); break;
    case 'rung': if (rungIdx++ % Math.max(1, MOTION_FX.rungEvery) === 0) sfx.rung(rungIdx); haptic(8); break;
    case 'wind': sfx.wind(d.v); break;
    case 'burst': sfx.burstGo(); haptic(MOTION_FX.burstHaptic); break;
    case 'reveal': sfx.land(); haptic(14); break;
    case 'upgradeStart': sfx.riser(); break;
    case 'upgradeBurst': sfx.burst(); haptic([30, 30, 60]); break;
    case 'impact': { const nf = NORMAL_FX[d.key]; sfx.result(d.key, nf ? nf.vol : 1); haptic(nf ? VIBE[d.key].map((v, i) => i % 2 ? v : Math.round(v * nf.vibe)) : VIBE[d.key]); break; }   // 通常の結果は、音と振動を格に応じて
    case 'glint': sfx.glint(d.key); break;
    case 'cardFly': sfx.whoosh(); break;
    case 'cardLand': sfx.thud(); haptic(16); break;
    // レア演出:予兆は短い振動、書き換わりの瞬間は強い振動。ミュート中は音だけ鳴らない
    case 'rareSign': sfx.ambientDuck(true, true); sfx.rareSign(); break;
    case 'rareCrack': sfx.crackTick(d.i); sfx.heartbeat(); haptic(RARE_VIBE.crack); break;
    case 'rareBreak': sfx.shatter(); haptic(RARE_VIBE.break); break;
    case 'rareGap': sfx.ambientDuck(true); break;   // 間:環境音をほぼ無音に
    case 'rareImpact': sfx.rareImpact(); haptic(RARE_VIBE.impact); break;
    case 'rareSettle': sfx.rareSettle(); break;
    case 'rareDone': sfx.ambientDuck(false); break;
  }
}

/* ---------------------------------------------------------
   描画層の起動。3D(WebGL)が使えなければ、簡易2Dへ自動で切り替える
   - WebGL非対応 / Three.js が読めない(通信不良・古いブラウザ) / 3Dの初期化失敗・時間切れ / 途中で3Dが落ちた
   - URLの末尾に #2d を付けると2Dを強制(確認用)
   --------------------------------------------------------- */
const rOpts = {
  lanes: CONFIG.ladder.lanes, results: [...CONFIG.results, CONFIG.super], grades: CONFIG.grades, reduceMotion,
  travelSec: CONFIG.travelSec > 0 ? CONFIG.travelSec : 10, onTier: n => { $('#quality').textContent = n; }, on: onRenderEvent, onLost: () => switchTo2D('WebGLのコンテキストが失われた')
};
let view3d = null, mode = '';
let canvas = $('#stage');
const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' timeout')), ms))]);
function hasWebGL() {
  try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
  catch (e) { return false; }
}
async function boot3D() {
  if (FORCE2D) throw new Error('#2d が指定された');
  if (!hasWebGL()) throw new Error('WebGL非対応');
  THREE = await withTimeout(import('three'), 9000, 'Three.js の読み込み');
  setProgress(.2);
  view3d = createRenderer3D(canvas, rOpts); mode = '3d';
  await withTimeout(view3d.init(setProgress), 10000, '3Dの準備');
}
/** 新しいキャンバスに差し替える(WebGLで使ったキャンバスでは2Dの描画ができないため) */
function replaceStage() {
  const old = canvas, c = document.createElement('canvas');
  c.id = 'stage'; c.setAttribute('aria-label', old.getAttribute('aria-label') || '');
  old.replaceWith(c); canvas = c; bindStage(c); return c;
}
function switchTo2D(reason) {
  if (mode === '2d') return;
  console.warn('2D表示に切り替えます:', reason);
  const prev = view3d; mode = '2d';
  try { prev && prev.dispose && prev.dispose(); } catch (e) { /* 片付けに失敗しても続ける */ }
  view3d = createRenderer2D(replaceStage(), rOpts); view3d.init();
  $('#quality').textContent = '2d';
  if (current && game.state === 'result') {          // 途中で切り替わっても、いまの場面から続ける
    if (current.menuOpen) view3d.openMenu(menuData());
    else if (current.celebrated || rareActive) view3d.celebrate(current.final.id, current.final.label, true, current.upgraded);
  }
  if (rareCancel) rareCancel();                       // レア演出の途中なら、書き換え後へ進める
  sfx.omenStop(); sfx.ambientDuck(false);
}

// 最初の操作で音を有効化する(iOS/Androidは操作の中でないと鳴らせない)。タブが隠れたら止める
['pointerup', 'click', 'touchend'].forEach(ev => addEventListener(ev, () => sfx.unlock(), { capture: true, passive: true }));
document.addEventListener('visibilitychange', () => sfx.pause(document.hidden));

/* スマホでの意図しない動き(ピンチ拡大・ダブルタップ拡大・画面の引っ張り・長押しメニュー)を止める */
['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('#r-route')) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (e.target === canvas) e.preventDefault(); });

/* ---------------------------------------------------------
   待ち時間。画面をタップすると、待ちを切り上げて先へ進む(演出の余韻は背景で続く)
   --------------------------------------------------------- */
let hurryFn = null;
/** ms 待つ。画面タップで切り上げられるが、minMs(ミリ秒)より前のタップは minMs まで待つ */
function waitOrTap(ms, minMs = 0) {
  return new Promise(res => {
    const t0 = performance.now();
    const done = () => { clearTimeout(tm); if (hurryFn === tap) hurryFn = null; res(); };
    const tap = () => { const el = performance.now() - t0; if (el >= minMs) { done(); return; } clearTimeout(tm); tm = setTimeout(done, Math.min(ms, minMs) - el); };
    let tm = setTimeout(done, ms); hurryFn = tap;
  });
}
const hurry = () => { const f = hurryFn; hurryFn = null; f && f(); };

/* ---------------------------------------------------------
   超大吉への昇格演出(仮)
   ロジックの結果(大吉/中吉/小吉)が出たあと、superChance の確率でここが呼ばれる。
   本番の演出を作ったら play() の中身を差し替える。終わったら resolve(return) すること。
   --------------------------------------------------------- */
let rareActive = false, rareCancel = null;
const SuperUpgrade = {
  /** 通常の結果を見せる → 予兆 → 静寂 → 砕ける → 超大吉。タップで加速できるが、書き換えは必ず最後まで行う */
  async play(renderer, ctx) {
    rareActive = true;
    try {
      await Promise.race([renderer.rare(ctx.from.id, ctx.from.label, ctx.to), new Promise(r => { rareCancel = r; }), wait(40000)]);   // 描画が止まっても進行は止めない
    } finally { rareActive = false; rareCancel = null; }
  }
};

let current = null;   // { base, final, upgraded, round, menuOpen, celebrated }
const BASE = { speed: CONFIG.speed, drawDuration: CONFIG.drawDuration };
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
/** 経路が決まったとき:玉の速度(目標の秒数に合うように)と、横線を引く時間(本数に合わせて)を決める */
function tuneTiming() {
  const route = game.trace.route;
  // 玉の速度の計画(区間ごとの緩急・溜め・終点のドラマ)。ラウンドごとに乱数で変わる(#seed=数字 のときは固定)
  const rng = MOTION_SEED ? mulberry32(+MOTION_SEED * 7919 + game.round * 131) : Math.random;
  const plan = makeMotionPlan(route, CONFIG.heightUnits, rng, reduceMotion);
  MOTION_PLANS.set(game.trace, plan);
  if (MOTION_SEED) window.amidaMotionPlan = plan;   // 確認用(#seed)
  if (CONFIG.travelSec > 0) game.cfg.speed = clampN(motionIntegral(plan) / CONFIG.travelSec, .3, 8);   // 緩急込みで travelSec に収まる速さ
  else game.cfg.speed = BASE.speed;
  // 横線が出そろうまでの時間 ÷ RUNG_FX.endAt(残りが、全体が光ってから玉が動き出すまでの間)
  game.cfg.drawDuration = (CONFIG.drawPerRung > 0 ? clampN(game.ladder.rungs.length * CONFIG.drawPerRung, 1.6, 3.4) : BASE.drawDuration) / RUNG_FX.endAt;
}
// くじ選択の案内:select に入って約0.8秒後にふわっと出て、御札を選ぶ(状態が変わる)と消える。約5秒触らないと強調
let guideT1 = 0, guideT2 = 0, guideRaf = 0;
/** 案内を御札のすぐ下に置く(札の位置はカメラや画面の大きさで変わるので、選択中は毎フレーム合わせる) */
function guidePlace() {
  window.cancelAnimationFrame(guideRaf);
  const g = $('#guide'), tick = () => {
    if (game.state !== 'select') return;
    try { const y = view3d && view3d.ofudaBottom ? view3d.ofudaBottom() : 0; if (y > 0) g.style.setProperty('--guide-top', Math.round(y + UI_FX.guideGap) + 'px'); } catch (e) { /* 位置が取れないときは既定の位置のまま */ }
    guideRaf = requestAnimationFrame(tick);
  };
  tick();
}
function guideState(s) {
  clearTimeout(guideT1); clearTimeout(guideT2);
  if (s === 'select') guidePlace(); else window.cancelAnimationFrame(guideRaf);
  const g = $('#guide');
  if (s !== 'select') { g.classList.remove('strong'); if (!g.hidden) hide(g, 300); return; }
  g.classList.remove('strong');
  guideT1 = setTimeout(() => { if (game.state !== 'select') return; show(g); guideTouch(); }, UI_FX.guideDelay * 1000);
}
function guideTouch() {   // 触ったら、強調のカウントを仕切り直す
  if (game.state !== 'select') return;
  const g = $('#guide'); g.classList.remove('strong');
  clearTimeout(guideT2); guideT2 = setTimeout(() => { if (game.state === 'select') g.classList.add('strong'); }, UI_FX.guideEmphasis * 1000);
}
game.on('state', s => {
  if (s === 'animating') tuneTiming();
  if (s === 'select') rungIdx = 0;
  guideState(s);
  if (s === 'animating') { sfx.select(); haptic(14); document.body.classList.add('cine'); setTimeout(() => game.state === 'animating' && show($('#skipLayer')), 250); }
  else hide($('#skipLayer'), 300);
  if (s === 'result') setTimeout(() => document.body.classList.remove('cine'), 900);
});
game.on('result', async r => {
  const round = game.round, stale = () => game.round !== round || game.state !== 'result';
  const forced = rareParam();
  const upgraded = forced !== null ? forced : rollRare();   // 結果が確定したこの瞬間に、1回だけ抽選
  rareStats.rolls++; if (upgraded) rareStats.hits++;
  const final = upgraded ? CONFIG.super : r.fortune;
  current = { base: r.fortune, final, upgraded, round, menuOpen: false, celebrated: false };

  const steps = [`入口 ${LANE_NO(r.start)} から出発`];
  r.route.filter(n => n.kind === 'cross').forEach((n, i, arr) => {
    const prev = i === 0 ? r.start : arr[i - 1].lane;
    steps.push(`${n.row + 1}段目で${n.lane > prev ? '右' : '左'}へ(→ ${LANE_NO(n.lane)}の線)`);
  });
  steps.push(`結果 ${LANE_NO(r.end)} に到着:${r.fortune.label}${upgraded ? ' → 超大吉に昇格' : ''}`);
  $('#r-route').innerHTML = steps.map(x => `<li>${x}</li>`).join('');

  view3d.prepare(r.fortune.id, r.fortune.label);
  if (upgraded) view3d.prepareRare(CONFIG.super);
  await waitOrTap(upgraded ? 600 : 900);    // 札が裏返って、元の運勢を見せる
  if (stale()) return;
  if (upgraded) {                           // レア演出:結果表示の前段に差し込む
    await SuperUpgrade.play(view3d, { from: r.fortune, to: CONFIG.super, lane: r.end });
    if (stale()) return;
  } else view3d.celebrate(final.id, final.label);  // 金文字・光・カメラの結果演出(運勢ごとに格が違う)
  current.celebrated = true;
  await waitOrTap(CONFIG.grades[final.id].overlayDelay, NORMAL_FX[final.id] ? (NORMAL_FX.minReadSec + .6) * 1000 : 0);   // 文字が出て(最大0.6秒)から、最低 minReadSec 秒は見せる
  if (stale()) return;
  $('#r-fortune').textContent = final.label;
  $('#btn-menu').disabled = false;
  $('#result').classList.toggle('rare', !!final.rare);
  show($('#result'));
});

function menuData() {
  const f = current.final, m = MENUS.find(x => x.fortune === f.id) || MENUS[0];
  return { ...m, id: f.id, label: f.label, rare: !!f.rare, benefit: f.benefit, store: CONFIG.storeName };
}
function openMenu() {
  if (!current || current.menuOpen) return;
  current.menuOpen = true; $('#btn-menu').disabled = true;
  const d = menuData();
  hide($('#result'), 400);
  view3d.openMenu(d);
  $('#m-text').textContent = `本日の開運御膳。${d.label}、${d.name}。${d.desc}${d.reason}`;
  setTimeout(() => show($('#menu')), mode === '2d' ? 350 : 700);
}
// メニューの案内:カードが出てから数秒は強調、その後は控えめに。実際にカードを触ったら薄くする
// ボタン共通:押した位置から金の波紋・振動・押した直後の短い無効化
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.btn,.ghost');
  if (!b || b.disabled) return;
  haptic(UI_FX.haptic);
  if (reduceMotion) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, rip = document.createElement('span');
  rip.className = 'rip'; rip.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(rip); setTimeout(() => rip.remove(), 900);
}, true);
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.btn,.ghost');
  if (!b) return;
  b.classList.add('lock'); setTimeout(() => b.classList.remove('lock'), UI_FX.pressLock);
});
let busy = false;
function again() {
  if (busy) return; busy = true; sfx.ui(); hurryFn = null;
  if (rareCancel) rareCancel(); sfx.omenStop(); sfx.goldFlowStop(); sfx.cut(); sfx.ambientDuck(false);
  $('#fade').classList.add('on');                 // 暗転しながら、カードが舞い上がって消える
  hide($('#result'), 300); hide($('#menu'), 300); view3d.dismissMenu();
  setTimeout(() => {
    view3d.closeMenu(); game.newRound();
    if (CONFIG.againTo === 'title') { game.setState('start'); show($('#title')); view3d.intro && view3d.intro(); }
    view3d.resetCamera();                         // 引いた位置から、くじ選択の構図へ降りてくる
    $('#fade').classList.remove('on'); busy = false;
  }, 480);
}
$('#btn-start').addEventListener('click', () => {
  if (game.state !== 'start') return;           // 連打で二重に始まらないように
  sfx.ui(); hide($('#title')); game.newRound();
});
$('#btn-skip').addEventListener('click', () => game.skip());
$('#btn-menu').addEventListener('click', openMenu);
$('#btn-again').addEventListener('click', again);
$('#btn-again2').addEventListener('click', again);

// タップ:選択中は列の判定、経路アニメ中は早送り、結果演出中は待ちの切り上げ、メニュー表示中はカード操作
let pressLane = -1;
function bindStage(el) {
  el.addEventListener('pointerdown', e => {
    if (!view3d) return;                       // 読み込み中のタッチは無視
    if (game.state === 'select') { pressLane = view3d.hitLane(e.clientX, e.clientY); view3d.setPress(pressLane); guideTouch(); }
    else { el.setPointerCapture?.(e.pointerId); view3d.cardPointer('down', e.clientX, e.clientY); }
  });
  el.addEventListener('pointermove', e => view3d && view3d.cardPointer('move', e.clientX, e.clientY));
  el.addEventListener('pointerup', e => {
    if (!view3d) return;
    if (game.state === 'select') { const lane = view3d.hitLane(e.clientX, e.clientY); if (lane >= 0 && lane === pressLane) game.choose(lane); }
    else if (game.state === 'animating') game.skip();
    else if (game.state === 'result' && current && !current.menuOpen && !$('#result').classList.contains('in')) { if (rareActive) view3d.rareHurry(); else hurry(); }
    else view3d.cardPointer('up', e.clientX, e.clientY);
    pressLane = -1; view3d.setPress(-1);
  });
  el.addEventListener('pointercancel', () => { if (!view3d) return; pressLane = -1; view3d.setPress(-1); view3d.cardPointer('up', -999, -999); });
}
bindStage(canvas);

const FRAME_MIN_MS = 10;   // これより短い間隔のフレームは飛ばす(10ms=100fps超。60/90Hzの画面は間引かれない)
let last = performance.now(), ts = 1, frameErr = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < FRAME_MIN_MS) return;   // 120Hz級の画面でも約60fpsで止める(見た目は変わらず、発熱と電池の消費が約半分)。時間は積み上がるので動きの速さは変わらない
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const v0 = game.view();
  const target = game.speedMul > 1 ? 1 : view3d.timeScaleHint(v0);
  // 緩急:減速は速度の計画そのものがなめらかなので、すぐ追従(遅れると溜めが浅くなる)。加速はなめらかに立ち上げる。スキップ中は一定の早送り
  ts += (target - ts) * (1 - Math.exp(-dt * (target < ts ? 40 : MOTION_FX.smoothRate)));
  game.update(dt * ts);                // ロジックの時間だけを伸縮(ロジック自体は無改造)
  try { view3d.frame(game.view(), dt); frameErr = 0; }
  catch (e) { console.error(e); if (++frameErr > 3 && mode === '3d') switchTo2D('描画エラー'); }
}

(async () => {
  setProgress(.08);
  try {
    await Promise.race([Promise.all([document.fonts.load('800 150px "Shippori Mincho B1"', '超大吉運開あみだ'), document.fonts.load('400 200px "Yuji Boku"', '超大吉中小'), document.fonts.load('500 24px "Shippori Mincho B1"', '御札運勢結果本日の開運御膳'), document.fonts.load('500 28px "Zen Kaku Gothic New"', 'ご利益仕事運'), document.fonts.load('700 28px "Zen Kaku Gothic New"', 'ご利益金運')]), wait(1500)]);
  } catch (e) { /* フォントが無くても代わりの書体で進める */ }
  try { await Promise.all([MARK_IMG, STORE_WORD, STORE_LOGO].map(im => im.decode ? im.decode().catch(() => {}) : 0)); } catch (e) { /* 読み込めなくても進める */ }
  try { await boot3D(); } catch (e) { switchTo2D(e && e.message); }
  setProgress(1);
  await wait(200);
  view3d.intro && view3d.intro();      // 灯籠が灯り、カメラが引いて全景を見せる
  requestAnimationFrame(t => { last = t; loop(t); });
  hide($('#loading'), 800); document.body.classList.add('ready');
  setTimeout(() => show($('#title')), 250);
})().catch(e => { console.error(e); fail('読み込みに失敗しました。ページを再読み込みしてください。'); });
</script>
