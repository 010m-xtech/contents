<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ホップ・ステップ・キャッチ！ - 洞窟脱出大作戦</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f0c1b;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Mochiy Pop One", "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    background: #1a162b;
    overflow: hidden;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<div id="stage">
<canvas id="game"></canvas>
</div>
<script>
"use strict";

const GAS_URL = "https://script.google.com/macros/s/AKfycb.../exec";

let storeCd = "000000";
let deviceId = localStorage.getItem('device_id') || 'unknown';

function getStoreCdFromUrl() {
  const hash = window.location.hash.replace('#', '').trim();
  if (hash && hash.length === 6) storeCd = hash;
}
getStoreCdFromUrl();

function logAccess(actionName) {
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: 'access_log',
      store_cd: storeCd,
      device_id: deviceId,
      action: actionName
    })
  }).catch(err => console.warn("ログ送信失敗:", err));
}

const stage = document.getElementById("stage");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, dpr = 1;
let groundY = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = stage.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  groundY = Math.floor(H * 0.76);
}
let resizeScheduled = false;
function scheduleResize() {
  if (resizeScheduled) return;
  resizeScheduled = true;
  requestAnimationFrame(() => { resizeScheduled = false; resize(); });
}
window.addEventListener("resize", scheduleResize);
window.addEventListener("orientationchange", scheduleResize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleResize);
resize();

document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("gesturechange", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
document.addEventListener("contextmenu", (e) => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ----------------------------- 画像読み込み ---------------------------
const defaultPlayerPath = 'image/000000.png';
let currentPlayerPath = storeCd !== "000000" ? `image/${storeCd}.png` : defaultPlayerPath;

const playerImg = new Image();
let playerImgLoaded = false;
playerImg.onload = () => { playerImgLoaded = true; };
playerImg.onerror = () => {
  if (currentPlayerPath !== defaultPlayerPath) {
    currentPlayerPath = defaultPlayerPath;
    playerImg.src = defaultPlayerPath;
  }
};
playerImg.src = currentPlayerPath;

// ダイヤ画像 (6色 / 200x152)
const diaFiles = ['dia_r.png', 'dia_y.png', 'dia_pr.png', 'dia_g.png', 'dia_b.png', 'dia_p.png'];
const diaImgs = diaFiles.map(name => {
  const img = new Image();
  img.src = `image/${name}`;
  return img;
});

// モンスター画像 (6種 / 各種サイズ比率保持)
const monsterDefs = [
  { name: 'monster_1.png', w: 321, h: 281 },
  { name: 'monster_2.png', w: 231, h: 378 },
  { name: 'monster_3.png', w: 338, h: 352 },
  { name: 'monster_4.png', w: 263, h: 450 },
  { name: 'monster_5.png', w: 322, h: 350 },
  { name: 'monster_6.png', w: 377, h: 293 }
];
const monsterImgs = monsterDefs.map(def => {
  const img = new Image();
  img.src = `image/${def.name}`;
  return { img, aspect: def.w / def.h, rawW: def.w, rawH: def.h };
});

// ----------------------------- サウンド ---------------------------
function createSfxPool(src, size, vol) {
  const pool = [];
  for (let i = 0; i < size; i++) {
    const a = new Audio(src);
    a.preload = "auto";
    a.volume = vol;
    pool.push(a);
  }
  let i = 0;
  return () => {
    const a = pool[i];
    i = (i + 1) % pool.length;
    try { a.currentTime = 0; } catch (e) {}
    a.play().catch(() => {});
  };
}
const sndJump = createSfxPool("assets/jump.mp3", 3, 0.6);
const sndGem  = createSfxPool("assets/gem.mp3", 4, 0.7);
const sndHit  = createSfxPool("assets/hit.mp3", 2, 0.7);

// ----------------------------- ステート ---------------------------
const STATE = { READY: 0, PLAY: 1, EVENT: 2, OVER: 3, CLEAR: 4 };
let state = STATE.READY;

const GOAL_SCORE = 200;
const BALL_R = 22;
const GRAVITY = 1600;
const JUMP_V = -680;
const BASE_SPEED = 210;
const MAX_SPEED = 430;

const ball = { x: 0, y: 0, vy: 0, jumpsLeft: 2, onGround: true, squash: 0 };
let speed = BASE_SPEED;
let distance = 0;
let gemsScore = 0;
let score = 0;
let best = 0;
try { best = parseInt(localStorage.getItem("hc_best") || "0", 10) || 0; } catch (e) {}

let obstacles = [];
let gems = [];
let particles = [];
let caveGems = [];
let distToNextSpawn = 0;
let overTime = 0;
let shake = 0;

let eventProgress = 0;
let eventTriggered = false;
let slopeAngle = 0;

// 洞窟背景用のキラキラ鉱石
function initCaveGems() {
  caveGems = [];
  for (let i = 0; i < 16; i++) {
    caveGems.push({
      x: Math.random() * W,
      y: Math.random() * (groundY - 60) + 40,
      r: 2 + Math.random() * 3,
      color: ['#00e5ff', '#ff4081', '#ffe57f', '#b388ff', '#69f0ae'][Math.floor(Math.random() * 5)],
      twinkle: Math.random() * 6.28
    });
  }
}
initCaveGems();

function resetGame() {
  ball.x = Math.max(90, W * 0.24);
  ball.y = groundY - BALL_R;
  ball.vy = 0;
  ball.jumpsLeft = 2;
  ball.onGround = true;
  ball.squash = 0;
  speed = BASE_SPEED;
  distance = 0;
  gemsScore = 0;
  score = 0;
  obstacles = [];
  gems = [];
  particles = [];
  distToNextSpawn = W * 1.1;
  shake = 0;
  eventProgress = 0;
  eventTriggered = false;
  slopeAngle = 0;
}
resetGame();

// ----------------------------- 入力 ---------------------------
function press() {
  if (state === STATE.READY) {
    state = STATE.PLAY;
    logAccess("ゲーム開始: 洞窟脱出大作戦");
    return;
  }
  if (state === STATE.OVER || state === STATE.CLEAR) {
    if (overTime > 0.6) {
      resetGame();
      state = STATE.PLAY;
      logAccess("リトライ: 洞窟脱出大作戦");
    }
    return;
  }
  
  if (state === STATE.EVENT) {
    eventProgress += 8;
    sndJump();
    spawnDust(ball.x, ball.y + BALL_R, 3, -1);
    if (eventProgress >= 100) {
      state = STATE.PLAY;
      gemsScore += 20;
      spawnBurst(W / 2, H / 2, 35, "#ffe57f");
    }
    return;
  }

  if (ball.jumpsLeft > 0) {
    ball.vy = ball.jumpsLeft === 2 ? JUMP_V : JUMP_V * 0.88;
    ball.jumpsLeft--;
    ball.onGround = false;
    ball.squash = -0.25;
    sndJump();
    spawnDust(ball.x, groundY, 4, -1);
  }
}
window.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); }, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    press();
  }
});

// --------------------------- スポーン ---------------------------
function spawnObstacleGroup() {
  if (state === STATE.EVENT || score > GOAL_SCORE - 15) return;

  const x = W + 80;
  const mIdx = Math.floor(Math.random() * monsterImgs.length);
  const def = monsterImgs[mIdx];
  
  // モンスターの高さ設定（跳び越えやすいよう 50〜65px 前後にスケール）
  const renderH = 54 + Math.random() * 12;
  const renderW = renderH * def.aspect;

  obstacles.push({
    x: x,
    w: renderW,
    h: renderH,
    mIdx: mIdx,
    hopPhase: Math.random() * 6.28
  });

  // ダイヤ出現（アーチ配置）
  if (Math.random() < 0.75) {
    const gx = x + renderW + 120 + Math.random() * 60;
    const n = 3 + Math.floor(Math.random() * 2);
    const diaIdx = Math.floor(Math.random() * diaImgs.length);
    for (let i = 0; i < n; i++) {
      const px = gx + i * 42;
      const py = groundY - 75 - Math.sin((i / (n - 1)) * Math.PI) * 75;
      gems.push({ x: px, y: py, r: 16, phase: Math.random() * 6.28, diaIdx: diaIdx });
    }
  }

  distToNextSpawn = Math.max(340, speed * (1.15 + Math.random() * 0.5));
}

function spawnDust(x, y, n, dir) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 14,
      y: y - Math.random() * 6,
      vx: (Math.random() * 50 + 20) * (Math.random() < 0.5 ? -1 : 0.4) - speed * 0.15,
      vy: (dir || -1) * (Math.random() * 50 + 20),
      life: 0, maxLife: 0.4 + Math.random() * 0.25,
      size: 3 + Math.random() * 3,
      color: "#ba68c8"
    });
  }
}

function spawnBurst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 200;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,
      life: 0, maxLife: 0.5 + Math.random() * 0.4,
      size: 3 + Math.random() * 4,
      color: color
    });
  }
}

function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

function gameOver() {
  state = STATE.OVER;
  overTime = 0;
  shake = 12;
  sndHit();
  spawnBurst(ball.x, ball.y, 24, "#ff4081");
  logAccess(`ゲームオーバー: 洞窟脱出大作戦 (${score}点)`);

  if (score > best) {
    best = score;
    try { localStorage.setItem("hc_best", String(best)); } catch (e) {}
  }
}

function gameClear() {
  state = STATE.CLEAR;
  overTime = 0;
  shake = 6;
  sndGem();
  spawnBurst(W / 2, H / 2, 45, "#ffe57f");
  logAccess(`ゲームクリア: 洞窟脱出大作戦 (${score}点)`);

  if (score > best) {
    best = score;
    try { localStorage.setItem("hc_best", String(best)); } catch (e) {}
  }
}

// ---------------------------- 更新 ----------------------------
function update(dt) {
  const bgSpeed = (state === STATE.PLAY || state === STATE.EVENT) ? speed : 30;

  // 鉱石のきらめきとスクロール
  for (const cg of caveGems) {
    cg.twinkle += dt * 4;
    cg.x -= bgSpeed * 0.15 * dt;
    if (cg.x < -10) {
      cg.x = W + 10;
      cg.y = Math.random() * (groundY - 60) + 40;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
    p.vy += 800 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.y > groundY - 2) { p.y = groundY - 2; p.vy *= -0.4; }
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  if (state === STATE.OVER || state === STATE.CLEAR) {
    overTime += dt;
    return;
  }

  if (state === STATE.READY) {
    ball.vy += GRAVITY * dt;
    ball.y += ball.vy * dt;
    if (ball.y >= groundY - BALL_R) {
      ball.y = groundY - BALL_R;
      ball.vy = -420;
      spawnDust(ball.x, groundY, 2, -1);
    }
    return;
  }

  if (state === STATE.EVENT) {
    eventProgress = Math.max(0, eventProgress - 15 * dt);
    slopeAngle = -0.25;
    ball.y = groundY - BALL_R - (eventProgress * 1.2);
    ball.squash += (0 - ball.squash) * Math.min(1, dt * 12);
    distance += speed * 0.5 * dt;
    score = Math.floor(distance / 50) + gemsScore;
    return;
  } else {
    slopeAngle = 0;
  }

  speed = Math.min(MAX_SPEED, speed + 5 * dt);
  distance += speed * dt;
  score = Math.floor(distance / 50) + gemsScore;

  if (score >= GOAL_SCORE) {
    gameClear();
    return;
  }

  if (score >= 120 && !eventTriggered) {
    eventTriggered = true;
    state = STATE.EVENT;
    eventProgress = 10;
    obstacles = [];
    return;
  }

  const wasAirborne = !ball.onGround;
  ball.vy += GRAVITY * dt;
  ball.y += ball.vy * dt;
  if (ball.y >= groundY - BALL_R) {
    ball.y = groundY - BALL_R;
    ball.vy = 0;
    ball.onGround = true;
    ball.jumpsLeft = 2;
    if (wasAirborne) {
      ball.squash = 0.25;
      spawnDust(ball.x, groundY, 5, -1);
    }
  } else {
    ball.onGround = false;
  }
  ball.squash += (0 - ball.squash) * Math.min(1, dt * 12);

  distToNextSpawn -= speed * dt;
  if (distToNextSpawn <= 0) spawnObstacleGroup();

  // モンスターとの衝突（甘い判定）
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed * dt;
    o.hopPhase += dt * 4;
    if (o.x + o.w < -60) { obstacles.splice(i, 1); continue; }
    
    // 当たり判定を小さめに（左右-10px、上部-8px）
    const cr = BALL_R - 6;
    const hitX = o.x + 8;
    const hitY = groundY - o.h + 8;
    const hitW = o.w - 16;
    const hitH = o.h - 8;

    if (circleRectHit(ball.x, ball.y, cr, hitX, hitY, hitW, hitH)) {
      gameOver(); return;
    }
  }

  // ダイヤ取得判定
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.x -= speed * dt;
    g.phase += dt * 3;
    if (g.x < -40) { gems.splice(i, 1); continue; }
    const dx = g.x - ball.x, dy = (g.y + Math.sin(g.phase) * 4) - ball.y;
    if (dx * dx + dy * dy < (BALL_R + g.r + 8) * (BALL_R + g.r + 8)) {
      gems.splice(i, 1);
      gemsScore += 5;
      sndGem();
      spawnBurst(g.x, g.y, 10, "#ffe57f");
    }
  }
}

// ----------------------------- 描画 -----------------------------
function drawCaveBackground() {
  // 1. 洞窟奥のグラデーション
  const grad = ctx.createLinearGradient(0, 0, 0, groundY);
  grad.addColorStop(0, "#120d24");
  grad.addColorStop(0.5, "#1f183d");
  grad.addColorStop(1, "#2e1e47");
  ctx.fillStyle = grad;
  ctx.fillRect(-20, -20, W + 40, groundY + 20);

  // 2. 洞窟天井の鍾乳石（つらら岩）
  ctx.fillStyle = "#161129";
  const stCount = 8;
  const stW = W / stCount;
  const offX = -(distance * 0.2 % stW);
  ctx.beginPath();
  ctx.moveTo(-20, 0);
  for (let i = -1; i <= stCount + 1; i++) {
    const bx = offX + i * stW;
    const h = ((i % 3) * 18) + 38;
    ctx.lineTo(bx + stW * 0.5, h);
    ctx.lineTo(bx + stW, 0);
  }
  ctx.closePath();
  ctx.fill();

  // 3. 壁面のキラキラ鉱石
  for (const cg of caveGems) {
    const alpha = 0.4 + Math.sin(cg.twinkle) * 0.35;
    ctx.fillStyle = cg.color;
    ctx.globalAlpha = Math.max(0.1, alpha);
    ctx.beginPath();
    ctx.arc(cg.x, cg.y, cg.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 4. 地面（洞窟の岩肌層）
  ctx.fillStyle = "#ff6eb4";
  ctx.fillRect(-20, groundY, W + 40, 4);

  const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, "#2a1b38");
  groundGrad.addColorStop(1, "#120a1c");
  ctx.fillStyle = groundGrad;
  ctx.fillRect(-20, groundY + 4, W + 40, H - groundY);

  // 地面のブロック模様（スクロール）
  ctx.strokeStyle = "#472e5e";
  ctx.lineWidth = 2;
  const tickGap = 70;
  const off = -(distance % tickGap);
  for (let x = off; x < W + tickGap; x += tickGap) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + 12);
    ctx.lineTo(x + 20, groundY + 12);
    ctx.stroke();
  }
}

function drawBall() {
  const sq = ball.squash;
  ctx.save();
  ctx.translate(ball.x, ball.y + sq * BALL_R * 0.5);
  ctx.scale(1 + sq * 0.5, 1 - sq * 0.5);

  if (playerImgLoaded) {
    const size = BALL_R * 3.6; 
    ctx.drawImage(playerImg, -size / 2, -size / 2, size, size);
  } else {
    ctx.fillStyle = "#ff6eb4";
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawMonster(o) {
  const def = monsterImgs[o.mIdx];
  const bounceY = Math.abs(Math.sin(o.hopPhase)) * 6; // ちょこんと跳ねる演出
  const y = groundY - o.h - bounceY;

  ctx.save();
  if (def.img && def.img.complete && def.img.naturalWidth !== 0) {
    ctx.drawImage(def.img, o.x, y, o.w, o.h);
  } else {
    // フォールバック
    ctx.fillStyle = "#e91e63";
    ctx.fillRect(o.x, y, o.w, o.h);
  }
  ctx.restore();
}

function drawGem(g) {
  const y = g.y + Math.sin(g.phase) * 4;
  const img = diaImgs[g.diaIdx];
  const w = 36;
  const h = w * (152 / 200); // 200x152の比率維持

  ctx.save();
  ctx.translate(g.x, y);

  if (img && img.complete && img.naturalWidth !== 0) {
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
  } else {
    ctx.fillStyle = "#00e5ff";
    ctx.beginPath();
    ctx.moveTo(0, -g.r);
    ctx.lineTo(g.r, 0);
    ctx.lineTo(0, g.r);
    ctx.lineTo(-g.r, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawCenteredText(text, x, y, size, weight, color, strokeColor) {
  ctx.font = (weight || "700") + " " + size + "px 'Mochiy Pop One', 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (strokeColor) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 5;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  if (slopeAngle !== 0) {
    ctx.translate(W / 2, H / 2);
    ctx.rotate(slopeAngle);
    ctx.translate(-W / 2, -H / 2);
  }

  drawCaveBackground();

  for (const g of gems) drawGem(g);
  for (const o of obstacles) drawMonster(o);

  for (const p of particles) {
    const a = 1 - p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  if (state !== STATE.OVER || overTime < 0.05) drawBall();

  // ---------------- UI ----------------
  if (state === STATE.PLAY) {
    drawCenteredText(`${score} / ${GOAL_SCORE}`, W / 2, H * 0.12, 46, "900", "#ffeb3b", "#0f0c1b");
  }

  if (state === STATE.EVENT) {
    drawCenteredText("さかみちを れんだして だっしゅつだ！", W / 2, H * 0.18, Math.min(20, W * 0.052), "900", "#ffe57f", "#0f0c1b");
    
    const barW = W * 0.72;
    const barH = 22;
    const barX = (W - barW) / 2;
    const barY = H * 0.25;
    ctx.fillStyle = "rgba(18, 13, 36, 0.85)";
    ctx.fillRect(barX, barY, barW, barH);
    ctx.strokeStyle = "#ffe57f";
    ctx.lineWidth = 3;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = "#ff4081";
    ctx.fillRect(barX, barY, barW * (eventProgress / 100), barH);
  }

  if (state === STATE.READY) {
    drawCenteredText("ホップ・ステップ・キャッチ！", W / 2, H * 0.22, Math.min(26, W * 0.072), "900", "#ff4081", "#ffffff");
    drawCenteredText("モンスターをよけてダイヤを集めよう！", W / 2, H * 0.32, Math.min(15, W * 0.038), "700", "#e0e0e0");
    drawCenteredText(`めざせ！ ${GOAL_SCORE} てんで だっしゅつ！`, W / 2, H * 0.37, Math.min(17, W * 0.042), "900", "#ffe57f");
    
    if (Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでスタート", W / 2, H * 0.48, Math.min(24, W * 0.055), "900", "#ff4081", "#ffffff");
    }
    if (best > 0) {
      drawCenteredText("ベスト記録: " + best, W / 2, H * 0.56, 18, "700", "#b388ff");
    }
  }

  if (state === STATE.OVER) {
    ctx.fillStyle = "rgba(15, 12, 27, 0.85)";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    drawCenteredText("つかまっちゃった！", W / 2, H * 0.28, Math.min(38, W * 0.08), "900", "#ff4081", "#ffffff");
    drawCenteredText("スコア", W / 2, H * 0.40, 18, "700", "#e0e0e0");
    drawCenteredText(String(score), W / 2, H * 0.48, 52, "900", "#ffe57f", "#0f0c1b");
    drawCenteredText("ベスト記録: " + best, W / 2, H * 0.57, 18, "700", "#b388ff");
    if (overTime > 0.6 && Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでリトライ", W / 2, H * 0.68, 22, "900", "#ff4081", "#ffffff");
    }
  }

  if (state === STATE.CLEAR) {
    ctx.fillStyle = "rgba(15, 12, 27, 0.88)";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    drawCenteredText("🎉 だっしゅつ せいこう！ 🎉", W / 2, H * 0.28, Math.min(28, W * 0.07), "900", "#ffe57f", "#ff4081");
    drawCenteredText("モンスターからにげきったよ！", W / 2, H * 0.38, Math.min(16, W * 0.04), "700", "#ffffff");
    drawCenteredText(String(score) + " 点", W / 2, H * 0.48, 52, "900", "#ffe57f", "#0f0c1b");
    if (overTime > 0.6 && Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでもう一度あそぶ", W / 2, H * 0.65, 22, "900", "#ff4081", "#ffffff");
    }
  }

  ctx.restore();
}

// ----------------------------- ループ -----------------------------
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 1 / 30) dt = 1 / 30;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastT = performance.now();
});
</script>
</body>
</html>
