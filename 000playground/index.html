<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナルゲームポータル</title>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-color: #1e293b;
      --accent-color: #2563eb;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 12px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 6px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .game-card:active {
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }

    .game-thumbnail {
      width: 100%;
      height: auto;
      aspect-ratio: 572 / 1024;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>お待ちの時間！笑顔のきっかけに！</h1>
      <p>お食事までのひとときを、手軽なミニゲームとともに</p>
    </header>

    <section id="top-section">
      <div id="game-grid" class="game-grid"></div>
    </section>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbywUquCksD91EOG9taXWzUZ5ncoD0IhjIF4etILA__iK8Du0fMR5SpbyLtvPlSBIvddRg/exec";

    let storeCd = "000000";
    let deviceId = "";

    window.addEventListener('DOMContentLoaded', () => {
      initIds();
      loadGameConfig();
      sendEventLog('top_view', '');
    });

    // 1. 店舗IDとデバイスIDの初期化・引き継ぎ
    function initIds() {
      const params = new URLSearchParams(window.location.search);

      const hash = window.location.hash.replace('#', '').trim();
      const queryShopId = params.get('shop_id') || params.get('cd') || '';
      const match6Digits = window.location.href.match(/(?:#|shop_id=|cd=|\/|_)(\d{6})(?:$|&|\?|\/|_)/);

      if (hash && /^\d{6}$/.test(hash)) {
        storeCd = hash;
      } else if (queryShopId && /^\d{6}$/.test(queryShopId)) {
        storeCd = queryShopId;
      } else if (match6Digits) {
        storeCd = match6Digits[1];
      }

      const urlDeviceId = params.get('device_id');
      if (urlDeviceId) {
        deviceId = urlDeviceId;
        localStorage.setItem('device_id', deviceId);
      } else {
        deviceId = localStorage.getItem('device_id');
        if (!deviceId) {
          deviceId = 'dev_' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2));
          localStorage.setItem('device_id', deviceId);
        }
      }
    }

    // 2. 遷移先URLに device_id と（append_shop_idがtrueなら）#店舗CD を付与
    function buildGameUrl(game, storeCode, devId) {
      const url = new URL(game.url);
      url.searchParams.set('device_id', devId);
      if (game.append_shop_id) {
        url.hash = storeCode;
      }
      return url.toString();
    }

    // 3. 日本時間取得
    function getFormattedTimestamp() {
      const d = new Date();
      return d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
    }

    // 4. config.jsonを読み込み、カードを動的生成
    async function loadGameConfig() {
      const grid = document.getElementById('game-grid');
      try {
        const response = await fetch('config.json?t=' + new Date().getTime());
        const configData = await response.json();

        const games = configData[storeCd] || configData["000000"];

        grid.innerHTML = '';
        games.forEach(game => {
          const card = document.createElement('a');
          card.className = 'game-card';
          card.dataset.title = game.title;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          card.href = buildGameUrl(game, storeCd, deviceId);

          card.innerHTML = `
            <img class="game-thumbnail" src="${game.thumbnail}" alt="${game.title}" onerror="this.src='thumbnail/default_game1.webp'">
          `;

          card.addEventListener('click', () => {
            sendEventLog('game_choice', game.title);
          });

          grid.appendChild(card);
        });

      } catch (error) {
        console.error("設定ファイルの読み込みに失敗しました:", error);
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>コンテンツの読み込みに失敗しました。</p>";
      }
    }

    // 5. GASの event_data シートへイベントログを送信
    function sendEventLog(eventName, resultValue) {
      const payload = {
        type: 'event',
        timestamp: getFormattedTimestamp(),
        shop_id: storeCd,
        device_id: deviceId,
        event: eventName,
        content_name: 'あそび場',
        result: resultValue || ''
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.warn("ログ送信失敗:", err));
    }
  </script>
</body>
</html>
