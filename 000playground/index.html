<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナルゲームポータル</title>

  <style>
    /* ベーススタイル（高級感・清潔感のあるモダンデザイン） */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-color: #1e293b;
      --accent-color: #2563eb;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 12px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 6px;
    }

    /* ゲーム一覧（トップ画面）スタイル */
    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2列並び */
      gap: 12px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .game-card:active {
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }

    .game-thumbnail {
      width: 100%;
      height: auto;
      aspect-ratio: 572 / 1024;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>お待ちの時間！笑顔のきっかけに！</h1>
      <p>お食事までのひとときを、手軽なミニゲームとともに</p>
    </header>

    <!-- トップ画面（ゲーム一覧） -->
    <section id="top-section">
      <div id="game-grid" class="game-grid">
        <!-- JavaScriptでJSONからカードを動的に生成します -->
      </div>
    </section>
  </div>

  <script>
    // GASのウェブアプリURL（アンケート画面と共通）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbywUquCksD91EOG9taXWzUZ5ncoD0IhjIF4etILA__iK8Du0fMR5SpbyLtvPlSBIvddRg/exec";

    let storeCd = "000000";
    let deviceId = "";

    window.addEventListener('DOMContentLoaded', () => {
      initIds();
      loadGameConfig();
      // 遊び場ページ表示イベント送信
      sendEventLog('top_view', '');
    });

    // 1. 店舗IDとデバイスIDの初期化・引き継ぎ
    function initIds() {
      // ハッシュ(#073810)から店舗CDを取得
      const hash = window.location.hash.replace('#', '').trim();
      if (hash && hash.length === 6) {
        storeCd = hash;
      }

      // URLパラメータ(?device_id=...) または localStorage からデバイスIDを取得
      const params = new URLSearchParams(window.location.search);
      const urlDeviceId = params.get('device_id');

      if (urlDeviceId) {
        deviceId = urlDeviceId;
        localStorage.setItem('device_id', deviceId);
      } else {
        deviceId = localStorage.getItem('device_id');
        if (!deviceId) {
          deviceId = 'dev_' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2));
          localStorage.setItem('device_id', deviceId);
        }
      }
    }

    // 2. 遷移先URLに device_id と 店舗CD(#) を安全に付与する
    function buildGameUrl(baseUrl, storeCode, devId) {
      const url = new URL(baseUrl);
      url.searchParams.set('device_id', devId);
      url.hash = storeCode;
      return url.toString();
    }

    // 3. 日本時間（YYYY/MM/DD HH:mm:ss）を取得
    function getFormattedTimestamp() {
      const d = new Date();
      return d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
    }

    // 4. config.jsonを読み込み、カードを動的生成
    async function loadGameConfig() {
      const grid = document.getElementById('game-grid');
      try {
        const response = await fetch('config.json');
        const configData = await response.json();

        // 該当する店舗CDの設定を取得（なければデフォルト 000000）
        const games = configData[storeCd] || configData["000000"];

        grid.innerHTML = '';
        games.forEach(game => {
          const card = document.createElement('a');
          card.className = 'game-card';
          card.dataset.title = game.title;
          
          // 別タブで開く設定（遊び場に戻りやすくし、通信キャンセルも防ぐ）
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          // 遷移先に device_id と #店舗CD を引き継ぐ
          card.href = buildGameUrl(game.url, storeCd, deviceId);

          card.innerHTML = `
            <img class="game-thumbnail" src="${game.thumbnail}" alt="${game.title}" onerror="this.src='thumbnail/default_game1.webp'">
          `;

          // タップ時にGASへ game_choice イベントを送信
          card.addEventListener('click', () => {
            sendEventLog('game_choice', game.title);
          });

          grid.appendChild(card);
        });

      } catch (error) {
        console.error("設定ファイルの読み込みに失敗しました:", error);
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>コンテンツの読み込みに失敗しました。</p>";
      }
    }

    // 5. GASの event_data シートへイベントログを送信
    function sendEventLog(eventName, resultValue) {
      const payload = {
        type: 'event',
        timestamp: getFormattedTimestamp(),
        shop_id: storeCd,
        device_id: deviceId,
        event: eventName,
        content_name: 'あそび場',
        result: resultValue || ''
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.warn("ログ送信失敗:", err));
    }
  </script>
</body>
</html>
