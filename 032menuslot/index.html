
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>今夜の一杯スロット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;700&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060a; --text:#f6f1ea; --muted:#a49c93; --glass:rgba(255,255,255,.06); --glass-line:rgba(255,255,255,.12);
  --accent:#f5b83d; --accent2:#ffdf8a; --ink:#2b1a03; --glow:rgba(245,184,61,.55);
  --body1:#3a2a14; --body2:#120c05;
  --cell:58px;
}
body[data-m="beer"]{ --accent:#f5b83d; --accent2:#ffe39a; --ink:#2b1a03; --glow:rgba(245,184,61,.55); --body1:#3d2a10; --body2:#120b03; }
body[data-m="sake"]{ --accent:#8fb8ff; --accent2:#d9e6ff; --ink:#071631; --glow:rgba(120,165,255,.55); --body1:#15223f; --body2:#050915; }
body[data-m="wine"]{ --accent:#ff6b8b; --accent2:#ffd0da; --ink:#2d0510; --glow:rgba(255,90,130,.55); --body1:#3d0d1c; --body2:#120207; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%; background:var(--bg)}
body{
  color:var(--text); font-family:"Noto Sans JP",system-ui,sans-serif; overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,170,60,.18) 0 40px, transparent 90px),
    radial-gradient(circle at 85% 12%, rgba(255,120,80,.14) 0 30px, transparent 80px),
    radial-gradient(circle at 70% 40%, rgba(120,160,255,.10) 0 50px, transparent 110px),
    radial-gradient(circle at 20% 70%, rgba(255,200,120,.10) 0 60px, transparent 130px),
    radial-gradient(ellipse at 50% 0%, #241a12 0%, #07060a 65%);
  background-attachment:fixed;
}
button{font:inherit; color:inherit}
.screen{display:none; min-height:100svh}
.screen.active{display:block}
.wrap{max-width:460px; margin:0 auto; padding:max(18px, env(safe-area-inset-top)) 16px 32px}

/* ===== 質問 ===== */
.brand{display:flex; align-items:center; justify-content:center; gap:8px; margin:6px 0 2px; font-family:Oswald,sans-serif; letter-spacing:.28em; font-size:12px; color:var(--muted)}
.brand i{width:22px; height:1px; background:var(--muted); opacity:.5}
.qtitle{font-size:26px; font-weight:900; text-align:center; margin:6px 0 4px; letter-spacing:.04em}
.qsub{font-size:13px; color:var(--muted); text-align:center; margin:0 0 20px}
.progress{display:flex; gap:6px; margin:18px 0 22px}
.progress span{flex:1; height:4px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; position:relative}
.progress span.on::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,#f5b83d,#ff6b8b,#8fb8ff)}
.qstep{animation:slide .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:none}}
.qnum{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.2em; color:var(--muted)}
.qtext{font-size:22px; font-weight:700; margin:4px 0 16px}
.opts{display:grid; gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  position:relative; display:flex; align-items:center; gap:14px; padding:14px; width:100%; text-align:left;
  border-radius:18px; border:1px solid var(--glass-line); background:var(--glass);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); cursor:pointer;
  transition:transform .15s, border-color .2s, background .2s;
}
.opt:active{transform:scale(.97)}
.opt:hover{border-color:rgba(255,255,255,.3)}
.opt .ic{width:62px; height:62px; flex:none; border-radius:14px; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.16), rgba(255,255,255,.02))}
.opt .ic svg{width:50px; height:50px}
.opt .t{font-size:18px; font-weight:700}
.opt .d{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5}
.opts.two .opt{flex-direction:column; text-align:center; padding:18px 10px}
.opt .emo{font-size:30px}
.opt.c-beer{background:linear-gradient(135deg, rgba(245,184,61,.22), rgba(245,184,61,.04))}
.opt.c-sake{background:linear-gradient(135deg, rgba(120,165,255,.22), rgba(120,165,255,.04))}
.opt.c-wine{background:linear-gradient(135deg, rgba(255,90,130,.22), rgba(255,90,130,.04))}
.qback{display:block; margin:18px auto 0; background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer}

/* ===== 台の決定 ===== */
.decide{text-align:center; padding-top:8vh}
.decide .lead{color:var(--muted); font-size:14px; letter-spacing:.1em}
.decide .mname{font-size:34px; font-weight:900; margin:6px 0 4px; color:var(--accent); text-shadow:0 0 24px var(--glow)}
.decide .tags{display:flex; justify-content:center; gap:8px; margin:10px 0 26px}
.tag{font-size:12px; padding:5px 12px; border-radius:999px; border:1px solid var(--glass-line); background:var(--glass)}
.preview{display:flex; justify-content:center; gap:10px; margin:0 auto 30px}
.preview div{width:76px; height:76px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(180deg,#fbf6ec,#e2d8c6); box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.2) inset; animation:float 3s ease-in-out infinite}
.preview div:nth-child(2){animation-delay:.3s} .preview div:nth-child(3){animation-delay:.6s}
.preview svg{width:58px; height:58px}
@keyframes float{50%{transform:translateY(-8px)}}
.cta{
  display:block; width:100%; padding:18px; border:none; border-radius:16px; cursor:pointer;
  font-size:17px; font-weight:900; letter-spacing:.12em; color:var(--ink);
  background:linear-gradient(180deg,var(--accent2),var(--accent)); box-shadow:0 10px 30px var(--glow);
}
.cta:active{transform:scale(.98)}

/* ===== スロット台（一人称視点） ===== */
#s-play .wrap{padding-top:max(10px, env(safe-area-inset-top)); padding-bottom:20px}
.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.topbar button{background:var(--glass); border:1px solid var(--glass-line); border-radius:999px; padding:7px 14px; font-size:12px; cursor:pointer; color:var(--text)}
.scene{perspective:1100px}
.enter{animation:approach 1.1s cubic-bezier(.2,.75,.2,1)}
@keyframes approach{from{transform:translateY(60px) scale(.62); filter:blur(8px) brightness(.4); opacity:.3} to{transform:none; filter:none; opacity:1}}
.cabinet{
  position:relative; border-radius:30px 30px 18px 18px; padding:12px 12px 0;
  background:linear-gradient(180deg, var(--body1), var(--body2) 70%);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.08) inset,
    0 0 0 1px #000,
    0 30px 60px rgba(0,0,0,.7),
    0 0 50px var(--glow);
}
.cabinet::before{ /* 側面のクロームライン */
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(90deg, rgba(255,255,255,.18), transparent 6%, transparent 94%, rgba(255,255,255,.12));
}
/* 大型モニター（リールはモニターの下部に重なる） */
.cabinet{--monH:min(48svh, 420px); --ov:calc(var(--monH) * .24)}
.monitor{
  position:relative; height:var(--monH); border-radius:22px; padding:5px; background:#000; overflow:hidden;
  box-shadow:0 0 0 2px #34343a, 0 0 0 3px rgba(255,255,255,.14), 0 6px 18px rgba(0,0,0,.6);
}
#mc{position:absolute; inset:5px; width:calc(100% - 10px); height:calc(100% - 10px); border-radius:18px; display:block}
.monitor::after{content:""; position:absolute; inset:5px; border-radius:18px; pointer-events:none;
  background:linear-gradient(165deg, rgba(255,255,255,.16), transparent 32%), radial-gradient(ellipse at 50% 120%, transparent 60%, rgba(0,0,0,.5));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 0 40px rgba(0,0,0,.6)}
.mon-ui,.lcd{display:none !important}
.mon-ui{position:absolute; left:0; right:0; top:18px; text-align:center; pointer-events:none; transition:opacity .25s}
.logo{font-family:Oswald,sans-serif; font-weight:700; font-size:44px; letter-spacing:.14em; line-height:1;
  background:linear-gradient(180deg,#fff, var(--accent2) 40%, var(--accent) 60%, #fff 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 12px var(--glow)) drop-shadow(0 2px 0 rgba(0,0,0,.7));
}
.logo-sub{font-size:11px; letter-spacing:.4em; color:var(--accent2); margin-top:6px; opacity:.9; text-shadow:0 1px 4px rgba(0,0,0,.8)}
.leds{position:absolute; left:20px; right:20px; top:9px; display:flex; justify-content:space-between; pointer-events:none}
.leds i{width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent); opacity:.25; animation:chase 1.4s linear infinite}
@keyframes chase{0%,30%{opacity:1} 60%,100%{opacity:.2}}
.cabinet.fever .leds i{animation-duration:.35s}
.monitor.live .mon-ui,.monitor.live .lcd{opacity:0}
.lcd{
  position:absolute; left:50%; transform:translateX(-50%); top:86px;
  min-width:62%; max-width:88%; padding:0 16px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center; white-space:nowrap;
  font-weight:700; font-size:14px; letter-spacing:.1em; color:#fff; transition:opacity .25s;
  text-shadow:0 0 10px var(--glow), 0 1px 2px rgba(0,0,0,.8);
  background:linear-gradient(90deg, transparent, rgba(0,0,0,.6) 18%, rgba(0,0,0,.6) 82%, transparent);
  border-top:1px solid rgba(255,255,255,.18); border-bottom:1px solid rgba(255,255,255,.18);
}
.lcd.blink{animation:blink .45s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.bezel{
  position:relative; z-index:2; margin:calc(-1 * var(--ov)) -28px 0; padding:7px; border-radius:6px;
  background:linear-gradient(180deg,#f2f2f2,#8d8d8d 18%,#dcdcdc 50%,#6f6f6f 82%,#c9c9c9);
  box-shadow:0 6px 14px rgba(0,0,0,.6);
}
.reels{position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:5px; border-radius:10px; background:#0a0a0a}
.reel{position:relative; height:calc(var(--cell) * 3); overflow:hidden; border-radius:6px; background:#fff}
.strip{position:absolute; left:0; right:0; top:0; will-change:transform}
.strip.fast{filter:blur(1.4px) saturate(1.2)}
.cell{height:var(--cell); display:grid; place-items:center}
.cell svg{width:78%; height:78%; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.cell{overflow:hidden}
.cell img{width:92%; height:calc(var(--cell) * .86); object-fit:contain; border-radius:4px; display:block; -webkit-user-drag:none; user-select:none}
.cell.win img{animation:winpulse .5s ease-in-out infinite alternate}
.r-hero{background:#fff !important}
.r-hero img{width:112px; height:112px; object-fit:contain}
.preview div{background:#fff !important; overflow:hidden}
.preview img{width:64px; height:64px; object-fit:contain}
.opt .ic{background:#fff !important}
.opt .ic{overflow:hidden}
.opt .ic img{width:54px; height:54px; object-fit:contain}
.pay-row .ic{background:#fff !important; overflow:hidden}
.pay-row .ic img{width:40px; height:40px; object-fit:contain}
.cell.win svg{animation:winpulse .5s ease-in-out infinite alternate}
@keyframes winpulse{to{transform:scale(1.14); filter:drop-shadow(0 0 10px #ffd34d) drop-shadow(0 0 2px #fff)}}
.reel::after{ /* 円筒の陰影 */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.08) 26%, transparent 40%, transparent 60%, rgba(0,0,0,.08) 74%, rgba(0,0,0,.55) 100%);
}
.glass{position:absolute; inset:7px; border-radius:8px; pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.04) 30%, transparent 55%, rgba(255,255,255,.06) 85%);
}
.payline{position:absolute; left:7px; right:7px; top:calc(12px + var(--cell)); height:var(--cell); pointer-events:none;
  border-top:2px solid rgba(230,40,40,.55); border-bottom:2px solid rgba(230,40,40,.55)}
.payline::before,.payline::after{content:""; position:absolute; top:50%; width:0; height:0; border:8px solid transparent; transform:translateY(-50%)}
.payline::before{left:-13px; border-left-color:#ff3b30; filter:drop-shadow(0 0 4px #ff3b30)}
.payline::after{right:-13px; border-right-color:#ff3b30; filter:drop-shadow(0 0 4px #ff3b30)}
.cabinet.win .payline{border-color:#ffd34d; box-shadow:0 0 18px #ffd34d, inset 0 0 18px rgba(255,211,77,.5); animation:blink .3s steps(2) infinite}
.reel.reach{box-shadow:0 0 0 3px #ff3b30, 0 0 20px #ff3b30; animation:reachglow .3s infinite alternate}
@keyframes reachglow{to{box-shadow:0 0 0 3px #ffd60a, 0 0 26px #ffd60a}}
.cabinet.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}

/* 操作パネル（手前に傾けて一人称視点に） */
.deck{
  margin:14px -12px 0; padding:18px 16px 22px; border-radius:0 0 18px 18px;
  transform-origin:top center; transform:rotateX(24deg);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
    linear-gradient(180deg,#2b2b30,#141417);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18), 0 24px 40px rgba(0,0,0,.6);
}
.stops{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 4px}
.stops .btn3d{height:50px; font-size:13px}
.btn3d{
  position:relative; height:58px; border-radius:14px; border:none; cursor:pointer;
  font-family:Oswald,sans-serif; font-weight:700; letter-spacing:.14em; font-size:15px;
  color:#5b5b5b; background:linear-gradient(180deg,#4a4a50,#2c2c31);
  box-shadow:0 7px 0 #0b0b0d, 0 10px 16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .06s, box-shadow .06s, background .2s, color .2s;
}
.btn3d.live{color:#2a0d00; background:radial-gradient(circle at 50% 30%, #fff1c7, #ffb02e 60%, #e07a00); box-shadow:0 7px 0 #7a3c00, 0 10px 22px rgba(255,160,40,.6), inset 0 1px 0 rgba(255,255,255,.7)}
.btn3d.live.stop{background:radial-gradient(circle at 50% 30%, #ffd9d9, #ff4b4b 60%, #b80f0f); color:#fff; box-shadow:0 7px 0 #600, 0 10px 22px rgba(255,60,60,.6), inset 0 1px 0 rgba(255,255,255,.6); text-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn3d.press{transform:translateY(6px); box-shadow:0 1px 0 #0b0b0d, 0 3px 6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2)}
.btn3d:disabled{cursor:default}
.startrow{display:flex; align-items:center; gap:14px; margin-top:22px; padding:0 8px}
.start{flex:1; height:64px; border-radius:32px; font-size:20px}
.credit{font-family:Oswald,sans-serif; font-size:11px; color:var(--muted); letter-spacing:.16em; text-align:center; line-height:1.3}
.credit b{display:block; color:#ffd36e; font-size:20px; text-shadow:0 0 8px rgba(255,190,60,.8)}
.hint{text-align:center; color:var(--muted); font-size:12px; margin-top:16px}

/* ===== リーチ演出 ===== */
#reach{position:fixed; z-index:30; display:none; background:#000; overflow:hidden; box-shadow:0 0 50px var(--glow)}
#reach.show{display:block}
#reach canvas,#reach video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
#reach .skip{opacity:0; transition:opacity .3s; position:absolute; right:16px; bottom:max(20px, env(safe-area-inset-bottom)); font-size:12px; color:rgba(255,255,255,.6); letter-spacing:.1em}

/* ===== 結果 ===== */
.overlay{position:fixed; inset:0; z-index:20; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.card{
  width:100%; max-width:460px; max-height:92svh; overflow:auto; padding:22px 18px max(20px, env(safe-area-inset-bottom));
  border-radius:28px 28px 0 0; background:linear-gradient(180deg, rgba(40,34,30,.96), rgba(16,13,12,.98));
  border-top:1px solid rgba(255,255,255,.18); box-shadow:0 -20px 60px rgba(0,0,0,.6);
  animation:up .5s cubic-bezier(.2,.9,.25,1.05); text-align:center;
}
@keyframes up{from{transform:translateY(100%)} to{transform:none}}
.grab{width:40px; height:4px; border-radius:4px; background:rgba(255,255,255,.25); margin:-8px auto 14px}
.r-label{font-family:Oswald,sans-serif; font-size:12px; letter-spacing:.3em; color:var(--accent)}
.r-hero{width:132px; height:132px; margin:10px auto 6px; border-radius:30px; display:grid; place-items:center;
  background:linear-gradient(180deg,#fbf6ec,#e0d5c1); box-shadow:0 14px 40px rgba(0,0,0,.6), 0 0 40px var(--glow)}
.r-hero svg{width:104px; height:104px}
.r-name{font-size:26px; font-weight:900; margin:8px 0 2px}
.r-taste{display:inline-block; font-size:11px; padding:3px 10px; border-radius:999px; background:var(--accent); color:var(--ink); font-weight:700}
.r-desc{font-size:14px; line-height:1.8; color:#ddd3c7; margin:12px 4px 14px}
.r-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; text-align:left}
.r-box{padding:12px; border-radius:14px; background:var(--glass); border:1px solid var(--glass-line)}
.r-box .k{font-size:11px; color:var(--muted)}
.r-box .v{font-size:15px; font-weight:700; margin-top:4px; line-height:1.4}
.r-msg{margin:12px 0 0; padding:14px; border-radius:14px; font-size:14px; line-height:1.7; background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border:1px solid var(--glass-line)}
.r-msg small{display:block; font-size:11px; color:var(--muted); margin-bottom:4px}
.r-staff{font-size:12px; color:var(--muted); margin:14px 0}
.r-btns{display:grid; grid-template-columns:1fr 1.3fr; gap:10px}
.r-btns button{padding:15px; border-radius:14px; font-weight:700; font-size:15px; cursor:pointer}
.b-sec{background:transparent; border:1px solid var(--glass-line)}
.b-pri{border:none; color:var(--ink); background:linear-gradient(180deg,var(--accent2),var(--accent))}
.card.rare{background:linear-gradient(180deg, #3b2b0c, #120c02)}
.card.rare .r-hero{box-shadow:0 0 0 2px #ffd34d, 0 0 60px rgba(255,211,77,.8)}
.card.rare .r-name{background:linear-gradient(180deg,#fff7cf,#ffd34d,#c28a12); -webkit-background-clip:text; background-clip:text; color:transparent}

/* 絵柄表 */
.pay{display:grid; gap:8px; text-align:left; margin-top:10px}
.pay-row{display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-line)}
.pay-row .ic{width:46px; height:46px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(180deg,#fbf6ec,#e0d5c1); flex:none}
.pay-row .ic svg{width:38px; height:38px}
.pay-row .three{display:flex; gap:2px}
.pay-row .nm{font-size:14px; font-weight:700}
.pay-row .tg{font-size:11px; color:var(--muted)}
.pay-row.mine{border-color:var(--accent)}

.sparkle{position:fixed; z-index:40; pointer-events:none; width:10px; height:16px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#reach.full .skip{opacity:1}

/* ===== 台：画面の横幅いっぱい。モニターとリールの画面幅をそろえる ===== */
#s-play .wrap{padding-left:0; padding-right:0; max-width:520px}
#s-play .topbar{padding:0 12px}
.topbar{justify-content:flex-start}
.cabinet{border-radius:0; padding:0;
  background:linear-gradient(90deg,#0c0c0e,#2a2a30 3%,#18181c 8%,#18181c 92%,#2a2a30 97%,#0c0c0e), linear-gradient(180deg, var(--body1), var(--body2));
}
.cabinet::before{display:none}
.monitor{border-radius:0; padding:0; background:linear-gradient(180deg,#3a3a40,#121214);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.6)}
#mc{inset:12px 12px 0 12px; width:calc(100% - 24px); height:calc(100% - 12px); border-radius:6px 6px 0 0}
.monitor::after{inset:12px 12px 0 12px; border-radius:6px 6px 0 0}
.leds{top:3px}
.bezel{margin:calc(-1 * var(--ov)) 0 0 !important; padding:7px !important; border-radius:0 !important;
  background:linear-gradient(180deg,#f4f4f4,#9a9a9a 16%,#e6e6e6 45%,#7c7c7c 80%,#cfcfcf) !important;
  box-shadow:0 -6px 14px rgba(0,0,0,.55), 0 8px 14px rgba(0,0,0,.6) !important}
.reels{border-radius:4px}
.reel{border-radius:3px}
/* メッキの飾りバー */
.trim{position:relative; height:20px; margin:0;
  background:linear-gradient(180deg,#fdfdfd 0%,#bdbdbd 25%,#6a6a6a 55%,#cfcfcf 80%,#5a5a5a 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.6)}
.trim i{position:absolute; left:10%; right:10%; top:8px; height:4px; border-radius:4px; background:var(--accent); box-shadow:0 0 10px var(--accent), 0 0 2px #fff}
.deck{margin:0 !important; transform:perspective(700px) rotateX(18deg) !important; border-radius:0 0 14px 14px;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.10), transparent 60%), repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px), linear-gradient(180deg,#34343a,#141417) !important}

/* STOP：丸い立体ボタン（メッキのリングにドーム型のボタン） */
.stops{padding:4px 12px 0 !important; gap:0 !important}
.stopwrap{justify-self:center; width:84px; height:84px; border-radius:50%; display:grid; place-items:center;
  background:conic-gradient(from 200deg, #fafafa, #8a8a8a, #e8e8e8, #5e5e5e, #f2f2f2, #7a7a7a, #fafafa);
  box-shadow:0 6px 12px rgba(0,0,0,.7), inset 0 0 0 2px rgba(0,0,0,.35)}
.stopwrap::after{content:""; position:absolute}
.btn3d.stop{width:66px; height:66px !important; border-radius:50% !important; padding:0; font-size:12px !important; letter-spacing:.08em;
  background:radial-gradient(circle at 50% 28%, #7a7a80 0%, #3a3a40 45%, #1c1c20 100%);
  box-shadow:0 6px 0 #0b0b0d, 0 8px 10px rgba(0,0,0,.7), inset 0 2px 3px rgba(255,255,255,.35), inset 0 -6px 10px rgba(0,0,0,.5);
  color:#77777c}
.btn3d.stop.live{color:#fff;
  background:radial-gradient(circle at 50% 26%, #ffe3e3 0%, #ff5a5a 30%, #d61414 62%, #7a0000 100%);
  box-shadow:0 6px 0 #4a0000, 0 8px 18px rgba(255,40,40,.65), inset 0 3px 4px rgba(255,255,255,.7), inset 0 -8px 12px rgba(80,0,0,.55);
  text-shadow:0 1px 1px rgba(0,0,0,.5)}
.btn3d.stop.press{transform:translateY(5px); box-shadow:0 1px 0 #2a0000, 0 2px 4px rgba(0,0,0,.6), inset 0 3px 6px rgba(0,0,0,.35)}

/* START：四角い立体ボタン */
.startrow{margin-top:20px !important; padding:0 16px 4px !important}
.start{height:62px !important; border-radius:10px !important; font-size:21px !important;
  background:linear-gradient(180deg,#ffe9a8 0%,#ffbe3b 35%,#f08f00 75%,#c46a00 100%) !important; color:#3a1c00 !important;
  box-shadow:0 7px 0 #6b3500, 0 10px 20px rgba(255,150,30,.45), inset 0 2px 0 rgba(255,255,255,.75), inset 0 -4px 8px rgba(120,50,0,.35), 0 0 0 3px #2a2a2e, 0 0 0 5px #8a8a90 !important}
.start:disabled{background:linear-gradient(180deg,#5a5a60,#2e2e33) !important; color:#77777c !important;
  box-shadow:0 7px 0 #0b0b0d, inset 0 2px 0 rgba(255,255,255,.15), 0 0 0 3px #2a2a2e, 0 0 0 5px #55555a !important}
.start.press{transform:translateY(6px) !important}

/* リーチの色：モニター枠・最後のリール */
#reach[data-tier="blue"]{box-shadow:0 0 0 3px #3da5ff, 0 0 50px #3da5ff}
#reach[data-tier="green"]{box-shadow:0 0 0 3px #3fe07a, 0 0 50px #3fe07a}
#reach[data-tier="red"]{box-shadow:0 0 0 3px #ff3b2b, 0 0 60px #ff3b2b}
#reach[data-tier="gold"]{box-shadow:0 0 0 3px #ffd34d, 0 0 70px #ffd34d}
#reach[data-tier="rainbow"]{animation:rbshadow 1s linear infinite}
@keyframes rbshadow{0%{box-shadow:0 0 0 3px #ff3b3b,0 0 70px #ff3b3b}25%{box-shadow:0 0 0 3px #ffd34d,0 0 70px #ffd34d}50%{box-shadow:0 0 0 3px #3fe07a,0 0 70px #3fe07a}75%{box-shadow:0 0 0 3px #3da5ff,0 0 70px #3da5ff}100%{box-shadow:0 0 0 3px #c86bff,0 0 70px #c86bff}}
.cabinet[data-tier="blue"] .reel.reach{animation:none; box-shadow:0 0 0 3px #3da5ff, 0 0 22px #3da5ff}
.cabinet[data-tier="green"] .reel.reach{animation:none; box-shadow:0 0 0 3px #3fe07a, 0 0 22px #3fe07a}
.cabinet[data-tier="red"] .reel.reach{animation:none; box-shadow:0 0 0 3px #ff3b2b, 0 0 24px #ff3b2b}
.cabinet[data-tier="gold"] .reel.reach{animation:none; box-shadow:0 0 0 3px #ffd34d, 0 0 28px #ffd34d}
.cabinet[data-tier="rainbow"] .reel.reach{animation:rbshadow .6s linear infinite}

/* ② 予告：モニターの暗転 */
.monfx{position:absolute; inset:12px 12px 0 12px; pointer-events:none; background:#000; opacity:0; z-index:1}
.monfx.on{animation:blackout 1.1s ease forwards}
@keyframes blackout{0%{opacity:0} 12%{opacity:1} 70%{opacity:1} 72%{opacity:.2} 76%{opacity:1} 100%{opacity:0}}
.cabinet.bigshake{animation:bigshake .7s}
@keyframes bigshake{10%{transform:translate(-8px,2px) rotate(-.6deg)} 20%{transform:translate(8px,-2px) rotate(.6deg)} 30%{transform:translate(-7px,1px)} 40%{transform:translate(7px,-1px)} 55%{transform:translate(-4px,0)} 70%{transform:translate(3px,0)} 85%{transform:translate(-1px,0)}}

#reachDim{position:fixed; inset:0; z-index:29; background:#000; opacity:0; pointer-events:none}
.monitor.prereach{animation:prereach .32s ease-out}
@keyframes prereach{0%{filter:brightness(1)} 50%{filter:brightness(1.5) saturate(1.3)} 100%{filter:brightness(1)}}

/* ===== 最初の画面：スポットライトと金の粒 ===== */
#s-q{position:relative; overflow:hidden}
#s-q::before{content:""; position:absolute; inset:-30%; pointer-events:none;
  background:conic-gradient(from 0deg at 50% 0%, transparent 0 40deg, rgba(255,215,120,.10) 50deg, transparent 62deg, transparent 150deg, rgba(255,180,90,.08) 165deg, transparent 178deg, transparent 280deg, rgba(255,230,160,.09) 292deg, transparent 305deg);
  animation:spot 9s ease-in-out infinite alternate}
@keyframes spot{from{transform:rotate(-12deg)} to{transform:rotate(12deg)}}
#s-q::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 12% 20%, #ffd98a, transparent), radial-gradient(1px 1px at 78% 12%, #fff1c4, transparent), radial-gradient(2px 2px at 42% 70%, #ffcf6b, transparent), radial-gradient(1px 1px at 88% 58%, #fff, transparent), radial-gradient(1.5px 1.5px at 24% 86%, #ffe3a0, transparent), radial-gradient(1px 1px at 62% 36%, #fff, transparent);
  background-size:260px 260px; animation:dust 14s linear infinite}
@keyframes dust{to{background-position:0 -260px}}
#s-q .wrap{position:relative; z-index:1}
.gold{background:linear-gradient(180deg,#fff6d0,#ffd34d 45%,#c8890e); -webkit-background-clip:text; background-clip:text; color:transparent}
.qtitle{font-size:28px}

/* カード */
.q1 .qtext{text-align:center; font-size:22px}
.q1 .qnum{text-align:center}
.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0 22px; perspective:900px}
.dcard{position:relative; overflow:hidden; border:none; cursor:pointer; padding:14px 6px 14px; border-radius:16px; aspect-ratio:3/4.6;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between; color:#fff;
  background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 40%, rgba(0,0,0,.25)), linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow:0 0 0 1px rgba(255,215,120,.55), 0 0 0 3px rgba(0,0,0,.6), 0 0 0 4px rgba(255,215,120,.25), 0 14px 30px rgba(0,0,0,.6);
  animation:deal .7s cubic-bezier(.2,.9,.3,1.15) backwards; animation-delay:calc(var(--i) * .14s);
  transition:transform .25s, opacity .3s, filter .3s, box-shadow .3s}
.dcard.c-beer{--c1:#7a4a08; --c2:#1e1002}
.dcard.c-sake{--c1:#1e3a6e; --c2:#070f20}
.dcard.c-wine{--c1:#6e1230; --c2:#1c030b}
@keyframes deal{from{transform:translateY(-120px) rotateY(180deg) rotateZ(-14deg) scale(.7); opacity:0} to{transform:none; opacity:1}}
.dcard:active{transform:scale(.96)}
.dc-shine{position:absolute; inset:0; background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 45%, transparent 60%); transform:translateX(-120%); animation:cshine 3.6s ease-in-out infinite; animation-delay:calc(var(--i) * .5s + 1s); pointer-events:none}
@keyframes cshine{0%,60%{transform:translateX(-120%)} 100%{transform:translateX(120%)}}
.dc-en{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.35em; color:#ffe7a6; opacity:.9}
.dc-img{width:74%; aspect-ratio:1; border-radius:50%; background:#fff; display:grid; place-items:center; overflow:hidden;
  box-shadow:0 0 0 2px #e9c46a, 0 0 0 5px rgba(0,0,0,.5), 0 0 22px rgba(255,210,110,.45)}
.dc-img img{width:78%; height:78%; object-fit:contain}
.dc-t{font-size:17px; font-weight:900; letter-spacing:.06em}
.dc-d{font-size:10.5px; color:#e8dccb; opacity:.85; margin-top:-6px}
.dcard.lit{transform:translateY(-6px) scale(1.04); box-shadow:0 0 0 2px #ffd34d, 0 0 30px #ffd34d, 0 14px 30px rgba(0,0,0,.6)}
.dcard.dim{opacity:.25; filter:grayscale(.7) blur(1px); transform:scale(.92)}
.dcard.chosen{transform:translateY(-10px) scale(1.1); z-index:2; box-shadow:0 0 0 2px #ffd34d, 0 0 50px #ffd34d, 0 0 90px rgba(255,200,80,.6); animation:chosen .6s ease}
@keyframes chosen{0%{transform:scale(1)} 40%{transform:translateY(-14px) scale(1.16) rotateY(360deg)} 100%{transform:translateY(-10px) scale(1.1) rotateY(360deg)}}
.lucky{display:block; width:100%; padding:16px; border:none; border-radius:14px; cursor:pointer; font-size:17px; font-weight:900; letter-spacing:.1em; color:#2a1600;
  background:linear-gradient(180deg,#fff4c4,#ffd34d 45%,#d99a10); box-shadow:0 6px 0 #7a5200, 0 10px 26px rgba(255,200,60,.45), inset 0 2px 0 rgba(255,255,255,.8)}
.lucky:active{transform:translateY(4px); box-shadow:0 2px 0 #7a5200}
.lucky span{display:inline-block}
.lucky.spinning span{animation:dice .25s linear infinite}
@keyframes dice{to{transform:rotate(360deg)}}
.lucky-note{text-align:center; font-size:12px; color:var(--muted); margin-top:10px}
.spark{position:fixed; z-index:50; width:6px; height:6px; border-radius:50%; pointer-events:none; box-shadow:0 0 6px currentColor; animation:spark .85s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0}}

/* 台の発表 */
.decide .done-txt{display:none} .decide.revealed .roll-txt{display:none} .decide.revealed .done-txt{display:inline}
.decide.rolling .tags,.decide.rolling .cta,.decide.rolling .qback{opacity:0; pointer-events:none}
.decide .tags,.decide .cta,.decide .qback{transition:opacity .4s .2s}
.decide.rolling .mname{animation:blink .2s steps(2) infinite}
.decide.revealed .mname{animation:reveal .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes reveal{from{transform:scale(2.2); opacity:0; filter:blur(6px)} to{transform:none; opacity:1; filter:none}}
.rollbox{width:110px !important; height:110px !important; animation:none !important; background:#fff !important}
.rollbox img{width:88px !important; height:88px !important}
/* ===== 1問目：スロットホールの台選び ===== */
.hall{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0 8px}
.mini{position:relative; border:none; cursor:pointer; padding:8px 6px 10px; border-radius:14px 14px 8px 8px; color:#fff;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  background:linear-gradient(90deg,#0d0d10,#2b2b31 8%,#17171b 20%,#17171b 80%,#2b2b31 92%,#0d0d10), linear-gradient(180deg,var(--c1),#0b0b0d);
  box-shadow:0 0 0 1px #000, 0 0 0 2px #6a6a70, 0 14px 26px rgba(0,0,0,.7), 0 0 24px var(--g);
  animation:rise .6s cubic-bezier(.2,.9,.3,1.1) backwards; animation-delay:calc(var(--i)*.12s); transition:transform .25s, opacity .3s, filter .3s}
@keyframes rise{from{transform:translateY(40px); opacity:0}}
.mini.c-beer{--c1:#6a3e06; --g:rgba(245,184,61,.35); --n:#ffc94d}
.mini.c-sake{--c1:#16305c; --g:rgba(120,165,255,.35); --n:#8fb8ff}
.mini.c-wine{--c1:#5c0f28; --g:rgba(255,90,130,.35); --n:#ff7b9a}
.mini-sign{font-family:Oswald,sans-serif; font-weight:700; font-size:18px; letter-spacing:.14em; color:#fff; padding:2px 0;
  text-shadow:0 0 6px var(--n), 0 0 14px var(--n), 0 0 26px var(--n); animation:neon 2.4s infinite}
@keyframes neon{0%,18%,22%,100%{opacity:1} 20%{opacity:.4}}
.mini-lamps{display:flex; gap:4px}
.mini-lamps i{width:5px; height:5px; border-radius:50%; background:var(--n); box-shadow:0 0 6px var(--n); animation:chase 1.1s linear infinite}
.mini-lamps i:nth-child(2){animation-delay:-.95s}.mini-lamps i:nth-child(3){animation-delay:-.8s}.mini-lamps i:nth-child(4){animation-delay:-.65s}.mini-lamps i:nth-child(5){animation-delay:-.5s}.mini-lamps i:nth-child(6){animation-delay:-.35s}.mini-lamps i:nth-child(7){animation-delay:-.2s}
.mini-screen{width:100%; aspect-ratio:1.15; border-radius:6px; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 50% 45%, #fff 0 52%, #e7e2d8 100%); box-shadow:inset 0 0 0 3px #111, inset 0 0 18px rgba(0,0,0,.35), 0 0 0 1px #777}
.mini-screen{overflow:hidden}
.mini-screen img{height:70px; width:auto; max-width:80%; object-fit:contain}
.mini-reels{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; width:100%; padding:3px; border-radius:4px;
  background:linear-gradient(180deg,#eee,#888 20%,#ddd 50%,#777 85%,#ccc)}
.mini-reels b{height:30px; overflow:hidden; background:#fff; display:grid; place-items:center; border-radius:2px; box-shadow:inset 0 3px 4px rgba(0,0,0,.25), inset 0 -3px 4px rgba(0,0,0,.25)}
.mini-reels img{height:24px; width:auto; max-width:92%; object-fit:contain}
.mini-name{font-size:14px; font-weight:900; letter-spacing:.04em}
.mini-btn{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:900; color:#fff;
  background:radial-gradient(circle at 50% 28%, #ffe3e3, #ff5a5a 32%, #c81010 66%, #6a0000);
  box-shadow:0 0 0 4px #2a2a2e, 0 0 0 6px #9a9aa0, 0 5px 0 6px #0b0b0d, 0 0 18px rgba(255,60,60,.6); margin-top:4px; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.3)}}
.mini:active{transform:scale(.97)}
.mini.dim{opacity:.25; filter:grayscale(.8); transform:scale(.94)}
.mini.chosen{transform:translateY(-8px) scale(1.06); z-index:2; box-shadow:0 0 0 2px #ffd34d, 0 0 40px #ffd34d, 0 14px 26px rgba(0,0,0,.7)}
.mini.chosen .mini-btn{transform:translateY(4px); box-shadow:0 0 0 4px #2a2a2e, 0 0 0 6px #ffd34d, 0 1px 0 6px #0b0b0d, 0 0 30px #ffd34d}
.mini.chosen .mini-lamps i{animation-duration:.3s}
.q2 .opts.two .opt{background:linear-gradient(180deg,#2f2f35,#16161a); border:1px solid #55555c;
  box-shadow:0 6px 0 #070708, 0 10px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 3px #111}
.q2 .opts.two .opt:active{transform:translateY(5px); box-shadow:0 1px 0 #070708, inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 3px #111}
.q2 .opts.two .opt .t{color:#ffd36e; text-shadow:0 0 10px rgba(255,190,60,.7)}
.q2 .qtext,.q2 .qnum{text-align:center}

/* ===== 結果：カード排出 ===== */
#cardStage{position:fixed; inset:0; z-index:45; display:none; background:radial-gradient(ellipse at 50% 20%, rgba(40,30,10,.88), rgba(0,0,0,.94))}
@keyframes fade{from{opacity:0}}
#cardStage.show{display:block; animation:fade .3s ease}
.slotbar{position:absolute; left:50%; top:max(18px, env(safe-area-inset-top)); transform:translateX(-50%); width:min(340px,90vw); height:44px; border-radius:10px;
  background:linear-gradient(180deg,#f4f4f4,#9a9a9a 18%,#e2e2e2 45%,#6a6a6a 85%,#c8c8c8); box-shadow:0 8px 18px rgba(0,0,0,.7); z-index:3}
.sb-slit{position:absolute; left:8%; right:8%; bottom:8px; height:8px; border-radius:4px; background:#050505; box-shadow:inset 0 2px 3px #000, 0 0 12px rgba(255,211,77,.9), 0 0 2px #ffd34d}
.sb-label{position:absolute; left:0; right:0; top:4px; text-align:center; font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.4em; color:#333}
.sb-lamp{position:absolute; right:10px; top:6px; width:8px; height:8px; border-radius:50%; background:#ff3b30; box-shadow:0 0 8px #ff3b30; animation:blink .3s steps(2) infinite}
.cardClip{position:absolute; left:50%; transform:translateX(-50%); top:calc(max(18px, env(safe-area-inset-top)) + 40px); width:min(330px,92vw); height:calc(100svh - 150px); overflow:hidden; perspective:1000px}
#cardStage.out .cardClip{overflow:visible}
.tcard{--rx:0deg; --ry:0deg; --mx:50%; --my:50%; position:relative; margin:0 auto; width:min(290px,80vw); max-height:calc(100svh - 190px); aspect-ratio:63/88; border-radius:14px;
  transform:translateY(-102%)}
.tcard.feed{animation:feed 1.9s steps(1) forwards}
@keyframes feed{
  0%{transform:translateY(-102%)} 8%{transform:translateY(-88%)} 16%{transform:translateY(-80%)} 24%{transform:translateY(-68%)} 32%{transform:translateY(-60%)}
  40%{transform:translateY(-48%)} 48%{transform:translateY(-40%)} 56%{transform:translateY(-28%)} 64%{transform:translateY(-20%)} 72%{transform:translateY(-10%)} 84%{transform:translateY(-4%)} 100%{transform:translateY(0)}}
#cardStage.out .tcard{animation:pop .8s cubic-bezier(.2,1.2,.4,1) forwards; transform:translateY(18px) rotateX(var(--rx)) rotateY(var(--ry)); transition:transform .15s}
@keyframes pop{0%{transform:translateY(0)} 45%{transform:translateY(30px) scale(1.1) rotateY(180deg)} 100%{transform:translateY(18px) rotateY(360deg)}}
.tc-inner{position:absolute; inset:0; border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:7px; color:#1b1408; overflow:hidden;
  background:linear-gradient(160deg,#fff9e8,#f3e4bd 60%,#e8d09a); box-shadow:inset 0 0 0 4px #c9a043, inset 0 0 0 6px #fff4d0, inset 0 0 0 7px #8a6a1e, 0 20px 50px rgba(0,0,0,.7)}
.tcard.ur .tc-inner{background:linear-gradient(160deg,#fff,#f4ecff 40%,#e9f7ff 70%,#fff3e0)}
.tc-head{display:flex; align-items:center; gap:8px}
.tc-sym{width:52px; height:52px; flex:none; border-radius:50%; background:#fff; display:grid; place-items:center; overflow:hidden;
  box-shadow:0 0 0 3px #c9a043, 0 0 0 5px #fff4d0, 0 0 0 6px #8a6a1e, 0 3px 8px rgba(0,0,0,.3)}
.tc-sym img{width:80%; height:80%; object-fit:contain}
.tc-title{flex:1; min-width:0}
.tc-cat{font-family:Oswald,sans-serif; font-size:10px; letter-spacing:.25em; color:#8a6a1e}
.tc-name{font-size:19px; font-weight:900; line-height:1.15; letter-spacing:.02em}
.tc-rar{font-family:Oswald,sans-serif; font-weight:700; font-size:18px; padding:2px 8px; border-radius:6px; color:#fff;
  background:linear-gradient(180deg,#ffd34d,#c8890e); box-shadow:0 2px 0 #7a5200; text-shadow:0 1px 0 rgba(0,0,0,.4)}
.tcard.ur .tc-rar{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#3fa7ff,#c86bff); animation:hue 2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.tc-photo{flex:1; min-height:0; border-radius:8px; background:#fff; display:grid; place-items:center; overflow:hidden;
  box-shadow:inset 0 0 0 2px #c9a043, inset 0 0 20px rgba(0,0,0,.08)}
.tc-photo img{width:88%; height:88%; object-fit:contain}
.tc-desc{font-size:12.5px; line-height:1.6; padding:7px 9px; border-radius:6px; background:rgba(255,255,255,.7); box-shadow:inset 0 0 0 1px rgba(138,106,30,.35)}
.tc-meta{display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:10.5px; color:#6a5420}
.tc-meta span{background:rgba(255,255,255,.55); border-radius:5px; padding:4px 7px}
.tc-meta b{display:block; font-size:12.5px; color:#1b1408}
.tc-foot{display:flex; justify-content:space-between; font-family:Oswald,sans-serif; font-size:9px; letter-spacing:.2em; color:#8a6a1e}
.tc-foil{position:absolute; inset:0; border-radius:14px; pointer-events:none; mix-blend-mode:color-dodge; opacity:0; transition:opacity .4s;
  background:linear-gradient(115deg, transparent 20%, rgba(255,120,200,.35) 35%, rgba(120,220,255,.35) 45%, rgba(160,255,160,.3) 55%, rgba(255,240,120,.35) 65%, transparent 80%);
  background-size:250% 250%; animation:foil 3s linear infinite}
@keyframes foil{from{background-position:0% 50%} to{background-position:250% 50%}}
.tc-glare{position:absolute; inset:0; border-radius:14px; pointer-events:none; opacity:0; transition:opacity .4s;
  background:radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.55), transparent 45%)}
#cardStage.out .tc-foil{opacity:.8} #cardStage.out .tc-glare{opacity:.6}
.tcard.ur .tc-foil{background:linear-gradient(115deg, rgba(255,80,80,.45), rgba(255,200,80,.45), rgba(80,255,140,.45), rgba(80,180,255,.45), rgba(200,100,255,.45), rgba(255,80,80,.45)); background-size:300% 300%}
#cardStage.out .tcard{filter:drop-shadow(0 0 22px rgba(255,211,77,.55))}
#cardStage.out .tcard.ur{filter:drop-shadow(0 0 30px rgba(255,255,255,.7))}
.cardBtns{position:absolute; left:50%; transform:translateX(-50%); bottom:max(16px, env(safe-area-inset-bottom)); width:min(340px,92vw); opacity:0; pointer-events:none; transition:opacity .4s}
.cardBtns.show{opacity:1; pointer-events:auto}
.cb-note{text-align:center; font-size:12px; color:#cbbfa6; margin-bottom:8px}
.cb-row{display:grid; grid-template-columns:1fr 1.4fr; gap:10px}
.cb-row button{padding:14px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer}
/* ===== スマホ全体を台の枠で囲う ===== */
:root{--fT:66px; --fS:10px; --fB:16px; --fTop:calc(var(--fT) + env(safe-area-inset-top))}
body{padding:var(--fTop) var(--fS) var(--fB)}
.screen{min-height:calc(100svh - var(--fTop) - var(--fB))}
.cab-frame{position:fixed; inset:0; z-index:60; pointer-events:none}
.cf-top{position:absolute; left:0; right:0; top:0; height:var(--fTop); padding-top:env(safe-area-inset-top);
  background:linear-gradient(180deg,#3a3a40 0%,#1a1a1e 55%,#0c0c0e 100%);
  box-shadow:inset 0 -2px 0 #6a6a70, inset 0 -4px 0 #0a0a0a, 0 6px 14px rgba(0,0,0,.7)}
.cf-top::before{content:""; position:absolute; left:0; right:0; top:env(safe-area-inset-top); height:2px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.cf-sign{position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 7px); text-align:center; font-family:Oswald,sans-serif; font-weight:700; font-size:15px; letter-spacing:.32em;
  color:#fff7d6; text-shadow:0 0 6px #ffcc33, 0 0 14px #ff9900, 0 0 26px #ff7a00; animation:neon 3s infinite}
.cf-lamps{position:absolute; top:calc(env(safe-area-inset-top) + 13px); width:70px; height:6px;
  background:radial-gradient(circle, #ffd34d 0 2.4px, transparent 3px) 0 0/10px 6px repeat-x; filter:drop-shadow(0 0 3px #ffb300); animation:lampsx .6s steps(2) infinite}
.cf-lamps.l{left:10px} .cf-lamps.r{right:10px}
@keyframes lampsx{50%{opacity:.35}}
/* カードの取り出し口（いつも表示） */
.cf-slot{position:absolute; left:50%; bottom:5px; transform:translateX(-50%); width:min(300px,78vw); height:24px; border-radius:7px;
  background:linear-gradient(180deg,#f4f4f4,#9a9a9a 22%,#e2e2e2 48%,#6a6a6a 86%,#c8c8c8); box-shadow:0 2px 4px rgba(0,0,0,.6)}
.cf-slot i{position:absolute; left:7%; right:7%; top:8px; height:7px; border-radius:4px; background:#030303; box-shadow:inset 0 2px 3px #000, 0 0 6px rgba(255,211,77,.45)}
.cf-slot b{position:absolute; right:-16px; top:8px; width:8px; height:8px; border-radius:50%; background:#5a1010; box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.cf-slot em{position:absolute; left:-58px; top:5px; font-style:normal; font-family:Oswald,sans-serif; font-size:9px; letter-spacing:.18em; color:#9a9aa0}
.cab-frame.feeding .cf-slot i{box-shadow:inset 0 2px 3px #000, 0 0 14px #ffd34d, 0 0 3px #fff3c4}
.cab-frame.feeding .cf-slot b{background:#ff3b30; box-shadow:0 0 8px #ff3b30; animation:blink .3s steps(2) infinite}
/* 左右の柱：LEDが流れる */
.cf-side{position:absolute; top:var(--fTop); bottom:0; width:var(--fS);
  background:linear-gradient(90deg,#0c0c0e,#4a4a52 40%,#1a1a1e)}
.cf-side.l{left:0} .cf-side.r{right:0; transform:scaleX(-1)}
.cf-side::after{content:""; position:absolute; left:3px; width:4px; top:6px; bottom:6px; border-radius:2px;
  background:repeating-linear-gradient(180deg, var(--accent) 0 6px, rgba(0,0,0,.6) 6px 14px); box-shadow:0 0 8px var(--accent);
  animation:ledflow 1.2s linear infinite; opacity:.85}
@keyframes ledflow{to{background-position:0 28px}}
.cf-bottom{position:absolute; left:0; right:0; bottom:0; height:var(--fB);
  background:linear-gradient(180deg,#5a5a60,#1a1a1e 40%,#0a0a0c); box-shadow:0 -2px 0 #0a0a0a}
.frame-inner{position:fixed; top:var(--fTop); left:var(--fS); right:var(--fS); bottom:var(--fB); pointer-events:none; visibility:hidden}
/* 枠の内側に収める */
#reachDim{inset:var(--fTop) var(--fS) var(--fB) !important}
#cardStage{inset:var(--fTop) var(--fS) var(--fB) !important; overflow:hidden}
.cardClip{top:0 !important; height:100% !important}
.tcard{max-height:calc(100svh - var(--fTop) - var(--fB) - 150px) !important}
.cardBtns{bottom:12px !important}
#cardStage .slotbar{display:none}
#s-play .wrap{padding-top:8px}
.sparkle{z-index:55}

/* ===== カード：お酒ごとに色が変わるリアルなカード ===== */
.tcard{--cA:#f3c14b; --cB:#8a5a0c; --cC:#fff3c4; --bg1:#fff8e6; --bg2:#f3dfa8; --ink:#2a1a04; --plate1:#6b4306; --plate2:#2e1c02; --pt:#fff2c8}
.tcard .tc-inner{inset:0; border-radius:15px; padding:9px; gap:6px; color:var(--ink);
  background:
    linear-gradient(135deg, var(--cC) 0%, var(--cA) 18%, var(--cB) 38%, var(--cA) 55%, var(--cC) 70%, var(--cB) 100%);
  box-shadow:0 0 0 2px #0b0b0b, 0 20px 46px rgba(0,0,0,.75)}
.tcard .tc-inner::before{content:""; position:absolute; inset:7px; border-radius:9px; z-index:0;
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 6px),
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.6), transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 0 18px rgba(0,0,0,.12)}
.tcard .tc-inner > *{position:relative; z-index:1}
.tcard .tc-head{padding:2px 2px 0}
.tcard .tc-sym{width:54px; height:54px; box-shadow:0 0 0 3px var(--cA), 0 0 0 5px var(--cB), 0 0 0 6px #000, 0 4px 10px rgba(0,0,0,.4)}
.tcard .tc-title{background:linear-gradient(180deg,var(--plate1),var(--plate2)); border-radius:6px; padding:4px 9px 5px; color:var(--pt);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 1px var(--cA)}
.tcard .tc-cat{color:var(--cC); opacity:.85}
.tcard .tc-name{color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); font-size:18px}
.tcard .tc-rar{position:relative; background:linear-gradient(180deg,var(--cC),var(--cA) 50%,var(--cB)); color:#fff; box-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 0 1px #000}
.tcard .tc-photo{background:#fff; border-radius:6px; box-shadow:0 0 0 3px var(--cB), 0 0 0 4px var(--cA), inset 0 0 24px rgba(0,0,0,.12), 0 3px 8px rgba(0,0,0,.3); margin:3px 3px 0}
.tcard .tc-desc{background:rgba(255,255,255,.78); color:#222; box-shadow:inset 0 0 0 1px var(--cB)}
.tcard .tc-meta{color:var(--ink)} .tcard .tc-meta span{background:rgba(255,255,255,.6); box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tcard .tc-foot{color:var(--plate1); font-weight:700; padding:0 3px}
/* ホログラムは写真と枠だけに */
.tcard .tc-foil{inset:0; border-radius:15px; mix-blend-mode:overlay}
/* 7（大当たり）：黒地に虹の枠 */
.tcard.ur .tc-inner{background:conic-gradient(from 0deg, #ff4d4d, #ffb340, #fff35c, #4dff88, #4dc3ff, #9a5cff, #ff4dd2, #ff4d4d); animation:urspin 4s linear infinite}
@keyframes urspin{to{filter:hue-rotate(360deg)}}
.tcard.ur .tc-inner::before{background:repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 2px, transparent 2px 6px), radial-gradient(ellipse at 50% 0%, rgba(255,215,90,.35), transparent 60%), linear-gradient(180deg,#22222a,#0b0b10)}
.tcard.ur .tc-desc{background:rgba(255,255,255,.92)}
.tcard.ur .tc-foot{color:#ffd34d}

/* 調整 */
.cf-slot em{display:none}
.tcard .tc-photo{position:relative}
.tcard .tc-photo img{position:absolute; left:6%; top:6%; width:88%; height:88%; object-fit:contain}
.tcard.ur .tc-inner{animation:none}
.cabinet{--monH:min(40svh, 360px) !important}

/* ===== 最初の説明文 ===== */
.intro{text-align:center; margin:2px auto 14px; padding:12px 14px; max-width:360px; border-radius:12px; font-size:13px; line-height:1.8; color:#e9dfcf;
  background:linear-gradient(180deg, rgba(255,215,120,.10), rgba(255,215,120,.03)); box-shadow:inset 0 0 0 1px rgba(255,215,120,.25)}
.intro p{margin:0}
.intro b{color:#ffd36e}
.intro-lead{font-weight:900; font-size:14px; color:#fff; letter-spacing:.06em}
.intro-go{margin-top:6px !important; font-weight:900; color:#ffd34d; text-shadow:0 0 10px rgba(255,190,60,.6); animation:pulse 1.6s ease-in-out infinite}
.q1 .qtext{font-size:20px}

/* ===== カード：大きく・立体的に ===== */
#cardStage .cardClip{perspective:1100px}
#cardStage.out .tcard{animation:none !important; transform-origin:50% 50%;
  transform:translateY(var(--ty,18px)) scale(var(--s,1.04)) rotateX(var(--rx)) rotateY(calc(360deg + var(--ry)));
  transition:transform .9s cubic-bezier(.2,1.15,.35,1)}
.tcard{transform-style:preserve-3d}
/* カードの厚み（側面）と床への影 */
.tcard .tc-inner{box-shadow:
  0 0 0 2px #0b0b0b,
  0 1px 0 2px #d8d8d8, 0 2px 0 2px #bdbdbd, 0 3px 0 2px #a8a8a8, 0 4px 0 2px #8a8a8a,
  0 18px 30px rgba(0,0,0,.55), 0 40px 60px rgba(0,0,0,.45)}
/* 表面のつや（ラミネート） */
.tcard .tc-glare{opacity:.75 !important; mix-blend-mode:soft-light;
  background:radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.95), rgba(255,255,255,.25) 25%, transparent 55%)}
.tcard .tc-gloss{position:absolute; inset:0; border-radius:15px; pointer-events:none; z-index:3;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) calc(var(--mx) - 6%), rgba(255,255,255,.05) calc(var(--mx) + 4%), transparent 70%)}
#cardStage.out .tc-foil{opacity:.9 !important}
#cardStage{background:radial-gradient(ellipse at 50% 40%, rgba(60,45,15,.92), rgba(0,0,0,.97))}

/* 説明文：1行ずつ折り返さない */
.intro p{white-space:nowrap}
.intro{font-size:13.5px}
/* ハズレの表示 */
.losetoast{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.6); z-index:5; pointer-events:none; opacity:0;
  padding:10px 22px; border-radius:12px; text-align:center; background:rgba(10,10,14,.88); box-shadow:0 0 0 2px #6a6a70, 0 8px 20px rgba(0,0,0,.6); white-space:nowrap}
.losetoast b{display:block; font-size:22px; font-weight:900; color:#fff; letter-spacing:.06em}
.losetoast small{display:block; font-size:12px; color:#cbbfa6; margin-top:2px}
.losetoast.show{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0; transform:translate(-50%,-50%) scale(.6)} 12%{opacity:1; transform:translate(-50%,-50%) scale(1.06)} 20%{transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) scale(1)}}
/* カードの裏面 */
.tcard .tc-inner,.tcard .tc-foil,.tcard .tc-glare,.tcard .tc-gloss{backface-visibility:hidden; -webkit-backface-visibility:hidden}
.tc-back{position:absolute; inset:0; border-radius:15px; transform:rotateY(180deg); backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  background:
    repeating-linear-gradient(45deg, rgba(255,211,77,.10) 0 2px, transparent 2px 12px),
    repeating-linear-gradient(-45deg, rgba(255,211,77,.10) 0 2px, transparent 2px 12px),
    radial-gradient(circle at 50% 45%, #3a2a08, #120c02 70%);
  box-shadow:0 0 0 2px #0b0b0b, inset 0 0 0 6px #c9a043, inset 0 0 0 8px #3a2a08, inset 0 0 0 9px #8a6a1e, 0 20px 46px rgba(0,0,0,.75)}
.tb-ring{width:46%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle, #2a1e06 55%, transparent 56%), conic-gradient(#fff3c4, #c9a043, #fff3c4, #8a6a1e, #fff3c4);
  box-shadow:0 0 30px rgba(255,211,77,.5)}
.tb-ring span{font-family:Oswald,sans-serif; font-weight:700; font-size:64px; background:linear-gradient(180deg,#fff6d0,#ffd34d 50%,#c8890e); -webkit-background-clip:text; background-clip:text; color:transparent}
.tb-title{font-family:Oswald,sans-serif; font-weight:700; font-size:18px; letter-spacing:.3em; color:#ffd34d; text-shadow:0 0 10px rgba(255,190,60,.6)}
.tb-sub{font-family:Oswald,sans-serif; font-size:11px; letter-spacing:.5em; color:#c9a043}
/* 取り出し口から出てくるときは裏向き */
.tcard.feed{animation-name:feedback !important}
@keyframes feedback{
  0%{transform:translateY(-102%) rotateY(180deg)} 8%{transform:translateY(-88%) rotateY(180deg)} 16%{transform:translateY(-80%) rotateY(180deg)} 24%{transform:translateY(-68%) rotateY(180deg)} 32%{transform:translateY(-60%) rotateY(180deg)}
  40%{transform:translateY(-48%) rotateY(180deg)} 48%{transform:translateY(-40%) rotateY(180deg)} 56%{transform:translateY(-28%) rotateY(180deg)} 64%{transform:translateY(-20%) rotateY(180deg)} 72%{transform:translateY(-10%) rotateY(180deg)} 84%{transform:translateY(-4%) rotateY(180deg)} 100%{transform:translateY(0) rotateY(180deg)}}
/* 出きったら：くるくる回りながら大きくなって、表で止まる */
#cardStage.out .tcard{transform:translateY(var(--ty,18px)) scale(var(--s,1.04)) rotateX(var(--rx)) rotateY(calc(1080deg + var(--ry))) !important;
  transition:transform 1.3s cubic-bezier(.15,.75,.25,1) !important}
.cardFlash{position:absolute; inset:0; background:radial-gradient(circle at 50% 40%, #fff, rgba(255,240,200,.6) 40%, transparent 70%); opacity:0; pointer-events:none; z-index:5}
.cardFlash.on{animation:cflash .7s ease-out}
@keyframes cflash{0%{opacity:0} 15%{opacity:1} 100%{opacity:0}}

/* 3Dの裏表が正しく出るように：カード本体にはfilterをかけない（光は後ろに） */
#cardStage.out .tcard,#cardStage.out .tcard.ur{filter:none !important}
#cardStage .cardClip::before{content:""; position:absolute; left:50%; top:46%; width:120%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%;
  background:radial-gradient(circle, rgba(255,211,77,.35), transparent 60%); opacity:0; transition:opacity .6s .8s; pointer-events:none}
#cardStage.out .cardClip::before{opacity:1}
/* ===== 遊ぶ画面：スマホ1画面に収めて固定 ===== */
html.lockplay,html.lockplay body{overflow:hidden; overscroll-behavior:none; height:100%}
html.lockplay #s-play{height:calc(100svh - var(--fTop) - var(--fB)); min-height:0; overflow:hidden; touch-action:none}
#s-play .wrap{height:100%; display:flex; flex-direction:column; padding-bottom:0 !important}
#s-play .topbar{flex:none; margin-bottom:6px}
#s-play .scene{flex:1; min-height:0; display:flex}
#s-play .cabinet{flex:1; min-height:0; display:flex; flex-direction:column; --ov:0px !important}
#s-play .bezel{margin-top:0 !important}
#s-play .monitor{flex:1 1 auto; min-height:110px; height:auto !important}
#s-play .bezel,#s-play .trim,#s-play .deck{flex:none}
#s-play .deck{padding:12px 16px 14px !important}
#s-play .stopwrap{width:74px; height:74px}
#s-play .btn3d.stop{width:58px; height:58px !important}
#s-play .startrow{margin-top:14px !important}
#s-play .start{height:56px !important}

/* ===== リーチ：金色に光る ===== */
.cab-frame.gold .cf-side::after{background:repeating-linear-gradient(180deg,#fff3c4 0 4px,#ffd34d 4px 8px,rgba(0,0,0,.55) 8px 14px); box-shadow:0 0 14px #ffd34d, 0 0 4px #fff; animation-duration:.3s; opacity:1}
.cab-frame.gold .cf-top{box-shadow:inset 0 -2px 0 #ffd34d, inset 0 -4px 0 #0a0a0a, 0 6px 26px rgba(255,211,77,.65)}
.cab-frame.gold .cf-sign{color:#fff; text-shadow:0 0 8px #ffd34d, 0 0 18px #ffb300, 0 0 34px #ff9900}
.cab-frame.gold .cf-lamps{animation-duration:.15s}
.cab-frame.gold .cf-bottom{box-shadow:0 -2px 0 #ffd34d, 0 -8px 24px rgba(255,211,77,.6)}
.cab-frame::after{content:""; position:absolute; top:var(--fTop); left:var(--fS); right:var(--fS); bottom:var(--fB); pointer-events:none; opacity:0; transition:opacity .3s;
  box-shadow:inset 0 0 0 2px #ffd34d, inset 0 0 36px rgba(255,211,77,.55)}
.cab-frame.gold::after{opacity:1; animation:goldpulse .5s ease-in-out infinite alternate}
@keyframes goldpulse{from{box-shadow:inset 0 0 0 2px #ffd34d, inset 0 0 22px rgba(255,211,77,.35)} to{box-shadow:inset 0 0 0 3px #fff3c4, inset 0 0 50px rgba(255,211,77,.75)}}
/* 揃いそうなリールの枠は金色（どの色のリーチでも） */
.cabinet .reel.reach{animation:goldreel .45s ease-in-out infinite alternate !important; z-index:2}
@keyframes goldreel{from{box-shadow:0 0 0 3px #ffd34d, 0 0 18px #ffd34d, inset 0 0 12px rgba(255,211,77,.5)} to{box-shadow:0 0 0 4px #fff3c4, 0 0 34px #ffd34d, 0 0 60px rgba(255,180,0,.6), inset 0 0 22px rgba(255,211,77,.8)}}
.cabinet.fever .bezel{box-shadow:0 0 0 2px #ffd34d, 0 0 30px rgba(255,211,77,.6), 0 8px 14px rgba(0,0,0,.6) !important}
/* 最後のリール：止まる直前のドキドキ */
.reel.tension{animation:tension .32s ease-in-out infinite !important}
@keyframes tension{0%,100%{box-shadow:0 0 0 4px #fff3c4, 0 0 40px #ffd34d; filter:brightness(1)} 50%{box-shadow:0 0 0 5px #fff, 0 0 70px #ffb300; filter:brightness(1.15)}}
/* 最後のSTOPが黄金に開く */
.stopwrap{position:relative}
.stopwrap::before{content:""; position:absolute; inset:-16px; border-radius:50%; opacity:0; pointer-events:none;
  background:repeating-conic-gradient(rgba(255,230,140,.85) 0 8deg, transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle, transparent 46%, #000 48%, #000 62%, transparent 72%); mask:radial-gradient(circle, transparent 46%, #000 48%, #000 62%, transparent 72%)}
.stopwrap.goldopen{background:conic-gradient(from 200deg, #fff8d6, #c8890e, #ffe27a, #8a5a00, #fff3c4, #b8860b, #fff8d6) !important;
  box-shadow:0 0 0 2px #fff3c4, 0 0 30px #ffd34d, 0 6px 12px rgba(0,0,0,.7) !important; animation:ringopen .7s cubic-bezier(.2,1.5,.4,1)}
.stopwrap.goldopen::before{opacity:1; animation:rays 2.4s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes ringopen{0%{transform:scale(.6)} 60%{transform:scale(1.22)} 100%{transform:scale(1)}}
.btn3d.stop.gold{animation:goldflip .7s ease-out;
  background:radial-gradient(circle at 50% 26%, #fffbe6 0%, #ffe27a 28%, #e0a816 62%, #7a4e00 100%) !important; color:#3a2200 !important; text-shadow:0 1px 0 rgba(255,255,255,.6) !important;
  box-shadow:0 6px 0 #5a3a00, 0 8px 22px rgba(255,200,60,.8), inset 0 3px 4px rgba(255,255,255,.85), inset 0 -8px 12px rgba(120,70,0,.5) !important}
@keyframes goldflip{0%{transform:rotateY(0) scale(.7); filter:brightness(2)} 50%{transform:rotateY(180deg) scale(1.15)} 100%{transform:rotateY(360deg) scale(1); filter:brightness(1)}}

/* ===== 2問目：味の選択 ===== */
.q2 .qtext{font-size:21px}
.tastes{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0 10px}
.tbtn{position:relative; border:none; cursor:pointer; padding:16px 8px 14px; border-radius:16px; color:#fff; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  box-shadow:0 0 0 1px #000, 0 0 0 3px #6a6a70, 0 14px 26px rgba(0,0,0,.7), 0 0 26px var(--g);
  animation:rise .6s cubic-bezier(.2,.9,.3,1.1) backwards; animation-delay:calc(var(--i)*.12s); transition:transform .25s, opacity .3s, filter .3s}
.tbtn.t0{--g:rgba(90,200,255,.45); --n:#7fdcff; background:radial-gradient(ellipse at 50% 0%, rgba(120,220,255,.35), transparent 60%), linear-gradient(180deg,#0f3550,#071620)}
.tbtn.t1{--g:rgba(255,170,70,.45); --n:#ffb347; background:radial-gradient(ellipse at 50% 0%, rgba(255,190,110,.35), transparent 60%), linear-gradient(180deg,#4a2508,#1a0c02)}
.tb-bulbs{position:absolute; inset:5px; border-radius:12px; pointer-events:none;
  background:

.tbtn:active{transform:scale(.97)}

/* ================= v9：よりリアルな光とボタン ================= */
/* --- STOP：クロームの台座＋ガラスのドーム --- */
#s-play .stopwrap{width:76px; height:76px; position:relative;
  background:
    radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.55) 60%, transparent 66%),
    conic-gradient(from 210deg, #f7f7f7, #8c8c92 12%, #e9e9ee 24%, #5a5a60 38%, #d8d8dd 52%, #6e6e74 66%, #fafafa 80%, #9a9aa0 92%, #f7f7f7) !important;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 -2px 3px rgba(0,0,0,.45) inset, 0 8px 14px rgba(0,0,0,.75), 0 2px 0 #0a0a0a !important}
#s-play .btn3d.stop{width:58px; height:58px !important; position:relative; overflow:hidden; font-family:Oswald,sans-serif; font-size:12px !important; letter-spacing:.12em;
  background:radial-gradient(circle at 50% 35%, #6a6a70 0%, #303036 50%, #121215 100%) !important;
  box-shadow:0 5px 0 #050506, 0 7px 10px rgba(0,0,0,.7), inset 0 -6px 10px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.08) !important; color:#6c6c72 !important}
/* ガラスの映りこみ（上のハイライト）と下の照り返し */
#s-play .btn3d.stop::before{content:""; position:absolute; left:16%; right:16%; top:7%; height:40%; border-radius:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.08)); pointer-events:none}
#s-play .btn3d.stop::after{content:""; position:absolute; left:22%; right:22%; bottom:8%; height:16%; border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,.28), transparent 70%); pointer-events:none}
#s-play .btn3d.stop.live{color:#fff !important; text-shadow:0 1px 2px rgba(80,0,0,.8) !important;
  background:radial-gradient(circle at 50% 38%, #ff8a80 0%, #ff2d20 32%, #c40f06 62%, #5e0300 100%) !important;
  box-shadow:0 5px 0 #3a0000, 0 7px 12px rgba(0,0,0,.6), 0 0 18px rgba(255,40,20,.55), 0 0 40px rgba(255,40,20,.25), inset 0 -8px 12px rgba(60,0,0,.6), inset 0 0 14px rgba(255,120,100,.35) !important}
/* --- 黄金のSTOP：磨いた金属＋光のにじみ（光線はやめる） --- */
.stopwrap::before{display:none !important}
#s-play .stopwrap.goldopen{
  background:
    radial-gradient(circle at 50% 50%, transparent 58%, rgba(60,30,0,.6) 60%, transparent 66%),
    conic-gradient(from 210deg, #fffbe8, #b07a10 12%, #ffe9a6 24%, #7a4e00 38%, #ffd86a 52%, #8a5a08 66%, #fff6d6 80%, #c08a18 92%, #fffbe8) !important;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 -2px 3px rgba(80,40,0,.5) inset, 0 8px 14px rgba(0,0,0,.75),
    0 0 14px rgba(255,214,90,.9), 0 0 34px rgba(255,190,40,.65), 0 0 70px rgba(255,170,0,.35) !important;
  animation:ringopen .7s cubic-bezier(.2,1.4,.4,1), goldbreath 1.1s ease-in-out .7s infinite !important}
@keyframes goldbreath{50%{box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 -2px 3px rgba(80,40,0,.5) inset, 0 8px 14px rgba(0,0,0,.75),
    0 0 20px rgba(255,224,120,1), 0 0 50px rgba(255,190,40,.8), 0 0 100px rgba(255,170,0,.45)}}
/* 床（操作パネル）への光の映りこみ */
#s-play .stopwrap.goldopen::after{content:""; position:absolute; left:50%; top:62%; width:170%; height:90%; transform:translateX(-50%); z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse at 50% 30%, rgba(255,200,70,.45), transparent 65%); filter:blur(4px)}
#s-play .btn3d.stop.gold{animation:goldpress .6s cubic-bezier(.2,1.3,.4,1) !important; color:#4a2c00 !important; text-shadow:0 1px 0 rgba(255,240,200,.8) !important;
  background:
    radial-gradient(ellipse at 50% 30%, #fffdf2 0%, #ffe9a0 18%, transparent 42%),
    radial-gradient(circle at 50% 60%, #ffd24a 0%, #e0a316 40%, #a66d00 75%, #5a3800 100%) !important;
  box-shadow:0 5px 0 #4a2e00, 0 7px 12px rgba(0,0,0,.6), inset 0 -7px 10px rgba(110,60,0,.55), inset 0 2px 3px rgba(255,255,255,.9), inset 0 0 16px rgba(255,240,180,.6) !important}
/* 金属の表面を光が流れる */
#s-play .btn3d.stop.gold::after{left:-40%; right:auto; bottom:auto; top:0; width:40%; height:100%; border-radius:0;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.85), transparent); transform:skewX(-18deg); animation:goldsheen 1.6s ease-in-out .5s infinite}
@keyframes goldsheen{0%{left:-50%} 60%,100%{left:120%}}
@keyframes goldpress{0%{transform:scale(.82); filter:brightness(2.2)} 60%{transform:scale(1.08)} 100%{transform:scale(1); filter:brightness(1)}}
#s-play .btn3d.stop.press{transform:translateY(4px) !important}

/* --- START：小さめ・メタルの縁＋光るアクリル --- */
#s-play .startrow{gap:16px !important; margin-top:12px !important; padding:0 28px 2px !important}
#s-play .start{flex:0 1 190px; margin:0 auto; height:46px !important; font-size:17px !important; letter-spacing:.2em; border-radius:9px !important; position:relative; overflow:hidden;
  background:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 45%, transparent 50%),
    linear-gradient(180deg,#ffcf5a 0%,#ff9d0a 55%,#d86d00 100%) !important; color:#3a1a00 !important; text-shadow:0 1px 0 rgba(255,230,170,.7);
  box-shadow:0 0 0 2px #1a1a1d, 0 0 0 4px #8d8d93, 0 0 0 5px #2a2a2e, 0 6px 0 5px #0a0a0b, 0 10px 18px rgba(0,0,0,.7), 0 0 26px rgba(255,160,20,.45), inset 0 -4px 8px rgba(120,50,0,.4) !important}

  box-shadow:0 0 0 2px #1a1a1d, 0 0 0 4px #6a6a70, 0 0 0 5px #2a2a2e, 0 6px 0 5px #0a0a0b, 0 10px 18px rgba(0,0,0,.7) !important}
#s-play .start.press{transform:translateY(5px) !important}
#s-play .credit b{font-size:18px}

/* --- 台の枠：本物の電球のように（粒＋にじみ＋照り返し） --- */
.cf-side{overflow:visible}
.cf-side::after{left:1px !important; width:8px !important; top:4px !important; bottom:4px !important; border-radius:0 !important; opacity:1 !important;
  background:radial-gradient(circle at 50% 50%, #fff 0 1.2px, var(--accent) 2px, rgba(0,0,0,0) 3.6px) 0 0/8px 12px repeat-y !important;
  box-shadow:none !important; filter:drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 5px var(--accent));
  animation:bulbchase 1.2s steps(12) infinite !important}
@keyframes bulbchase{to{background-position:0 12px}}
/* 柱の光が画面側へにじむ */
.cf-side::before{content:""; position:absolute; top:0; bottom:0; left:100%; width:22px; pointer-events:none;
  background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, transparent), transparent); opacity:.6; transition:opacity .3s}
/* リーチ中：金の電球が速く流れ、強くにじむ */
.cab-frame.gold .cf-side::after{background:radial-gradient(circle at 50% 50%, #fff 0 1.5px, #ffd34d 2.4px, rgba(0,0,0,0) 4px) 0 0/8px 12px repeat-y !important;
  filter:drop-shadow(0 0 3px #ffd34d) drop-shadow(0 0 8px #ffb300) drop-shadow(0 0 14px rgba(255,170,0,.7)); animation-duration:.4s !important}
.cab-frame.gold .cf-side::before{background:linear-gradient(90deg, rgba(255,200,60,.45), transparent); opacity:1; width:40px}
.cab-frame::after{box-shadow:none !important; animation:none !important;
  background:
    linear-gradient(180deg, rgba(255,205,80,.32), transparent 9%),
    linear-gradient(0deg, rgba(255,205,80,.28), transparent 7%)}
.cab-frame.gold::after{opacity:1; animation:goldspill 1.1s ease-in-out infinite !important}
@keyframes goldspill{50%{opacity:.6}}
/* リーチのリール枠：金の縁取り＋にじみ（チカチカ点滅はやめる） */
.cabinet .reel.reach{animation:reelglow 1.1s ease-in-out infinite !important}
@keyframes reelglow{
  0%,100%{box-shadow:0 0 0 2px #fff1b8, 0 0 0 4px #c98e12, 0 0 14px 2px rgba(255,205,70,.75), 0 0 34px 6px rgba(255,170,0,.35), inset 0 0 16px rgba(255,214,90,.45)}
  50%{box-shadow:0 0 0 2px #fffbe6, 0 0 0 4px #e8ab22, 0 0 22px 4px rgba(255,220,110,.95), 0 0 56px 12px rgba(255,170,0,.5), inset 0 0 26px rgba(255,224,120,.7)}}
.reel.tension{animation:reelglow .38s ease-in-out infinite !important}

/* ===== カード：つながりのある出し方 ===== */
/* 吸い込まれる絵柄 */
.flyer{position:fixed; z-index:70; display:grid; place-items:center; pointer-events:none; border-radius:10px;
  background:radial-gradient(circle, rgba(255,240,190,.9), rgba(255,211,77,.35) 55%, transparent 72%);
  animation:flyup 1.35s cubic-bezier(.5,0,.7,.25) both}
.flyer img{width:80%; height:80%; object-fit:contain; filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #ffd34d)}
@keyframes flyup{
  0%{transform:translate(0,0) scale(1); opacity:1; filter:brightness(1.4)}
  25%{transform:translate(0,-10px) scale(1.15)}
  100%{transform:translate(var(--dx),var(--dy)) scale(.12); opacity:.85; filter:brightness(2.2)}}
/* 取り出し口がチャージされて光る */
.cab-frame.charged .cf-slot{box-shadow:0 0 0 2px #fff3c4, 0 0 24px #ffd34d, 0 0 50px rgba(255,180,0,.7); animation:slotkick .3s ease}

@keyframes slotkick{50%{transform:translateX(-50%) scale(1.06)}}
/* 台は見せたまま、少しだけ暗く */
#cardStage{background:radial-gradient(ellipse at 50% 30%, rgba(30,22,8,.35), rgba(0,0,0,.62)) !important; animation:fadein .35s ease}

#cardStage .cardClip::before{opacity:0}
#cardStage.out .cardClip::before{opacity:1; transition:opacity .4s .3s}
.cardBtns{padding:10px 10px 4px; border-radius:14px; background:rgba(8,8,10,.82); box-shadow:0 -6px 20px rgba(0,0,0,.6)}
/* 一気にシューッと出て、少し揺れて止まる（裏向き） */
.tcard.feed{animation:feedslide 1.7s cubic-bezier(.25,.7,.25,1) forwards !important}
@keyframes feedslide{
  0%{transform:translateY(-102%) rotateY(180deg) rotateZ(0)}
  62%{transform:translateY(5%) rotateY(180deg) rotateZ(.8deg)}
  78%{transform:translateY(-2%) rotateY(180deg) rotateZ(-.6deg)}
  90%{transform:translateY(1%) rotateY(180deg) rotateZ(.3deg)}
  100%{transform:translateY(0) rotateY(180deg) rotateZ(0)}}
/* 1回だけ裏返して大きく */
#cardStage.out .tcard{transform:translateY(var(--ty,18px)) scale(var(--s,1.04)) rotateX(var(--rx)) rotateY(calc(360deg + var(--ry))) !important;
  transition:transform .85s cubic-bezier(.3,1.25,.4,1) !important}
#cardStage:not(.out) .tcard:not(.feed){transform:translateY(-102%) rotateY(180deg)}

html.lockplay #s-q,html.lockplay #s-decide{height:calc(100svh - var(--fTop) - var(--fB)); min-height:0; overflow:hidden; touch-action:none}
#s-q .wrap,#s-decide .wrap{will-change:transform}

.tc-back{gap:14px !important;

.tcard.showback .tc-inner,.tcard.showback .tc-foil,.tcard.showback .tc-glare,.tcard.showback .tc-gloss{visibility:hidden}

.tc-back,.tc-inner{-webkit-backface-visibility:visible !important; backface-visibility:visible !important}
#cardStage .tcard.flip1{transform:translateY(calc(var(--ty,18px) * .4)) scale(calc(1 + (var(--s,1) - 1) * .4)) rotateY(270deg) !important;
  transition:transform .38s cubic-bezier(.55,0,.9,.45) !important}
#cardStage.out .tcard{transition:transform .7s cubic-bezier(.15,.9,.3,1.15) !important}
/* リールの絵柄はセルの大きさに合わせる */
.cell img{height:calc(var(--cell) * .86) !important}

/* ===== お酒の注意書き（台座） ===== */
:root{--fB:22px !important}
.cf-bottom{display:flex; align-items:center; justify-content:center; padding-bottom:env(safe-area-inset-bottom)}

@supports(height:env(safe-area-inset-bottom)){ :root{--fB:calc(22px + env(safe-area-inset-bottom)) !important} .cf-bottom{height:var(--fB) !important} }

  .rm-phone::after{content:""; position:absolute; left:50%; bottom:5px; width:10px; height:3px; margin-left:-5px; border-radius:2px; background:#ffd34d}
  @keyframes rotphone{0%,20%{transform:rotate(-90deg)} 55%,100%{transform:rotate(0)}}
}

function shuffleStrip(list){
  for(let tries=0; tries<200; tries++){
    const a=[...list].sort(()=>Math.random()-.5);
    if(a.every((x,i)=>x!==a[(i+1)%a.length])) return a;

}

const IDLE = {
  beer(ctx,W,H,s,P){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#d98a0c"); g.addColorStop(.55,"#8a4a02"); g.addColorStop(1,"#2a1300");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(let i=0;i<4;i++){ const x=W*(.15+.25*i)+Math.sin(s*.4+i)*30; const gr=ctx.createLinearGradient(x,0,x+60,H);
      gr.addColorStop(0,"rgba(255,230,150,.10)"); gr.addColorStop(1,"rgba(255,230,150,0)"); ctx.fillStyle=gr;
      ctx.beginPath(); ctx.moveTo(x-20,0); ctx.lineTo(x+40,0); ctx.lineTo(x+120,H); ctx.lineTo(x+40,H); ctx.fill(); }
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle="rgba(255,250,230,.75)";
    P.forEach(p=>{ const y=H-((p.y*H + s*p.s*60)%H); ctx.beginPath(); ctx.arc(p.x*W+Math.sin(s*2+p.a)*3, y, p.r*.6, 0, 7); ctx.fill(); });
    ctx.fillStyle="rgba(255,250,238,.95)";

  },

/* ===== 速達生便：景色が流れ、トラックが左から右へ走る ===== */
const Delivery = (()=>{
  const OVERLAP = .24;
  const load = src=>{ const im=new Image(); im.decoding="async"; im.src=src; return im; };
  const truck = load(TRUCK_IMG);
  const segs = ROUTE.map(r=>({...r, im:load(r.f)}));
  let panU = 0, jump = 0, boost = 0, t = 0, puffT = 0, puffs = [], last = 0, brakeT = 0, bubble = null;
  const ok = im=>im.complete && im.naturalWidth;
  // 右向きのトラック：左右反転し、荷台の広告だけ元の向きで貼りなおす（文字が鏡文字にならないように）
  let truckR = null;
  const truckRight = ()=>{
    if(truckR) return truckR;
    const w=truck.naturalWidth, h=truck.naturalHeight, c=document.createElement("canvas"); c.width=w; c.height=h;
    const x=c.getContext("2d"); x.save(); x.translate(w,0); x.scale(-1,1); x.drawImage(truck,0,0); x.restore();
    const a=.33, b=.945, tt=.06, bt=.70;
    x.drawImage(truck, w*a, h*tt, w*(b-a), h*(bt-tt), w*(1-b), h*tt, w*(b-a), h*(bt-tt));
    return (truckR=c);
  };
  const feather = im=>{   // 左はしを透明にぼかした版（前の景色に重ねて、つなぎ目をなめらかに）
    if(im.fe) return im.fe;
    const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const x=c.getContext("2d"); x.drawImage(im,0,0); x.globalCompositeOperation="destination-in";
    const g=x.createLinearGradient(0,0,c.width,0); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(OVERLAP,"#000"); g.addColorStop(1,"#000");
    x.fillStyle=g; x.fillRect(0,0,c.width,c.height); return (im.fe=c);
  };
  const aspect = sg=> ok(sg.im) ? sg.im.naturalWidth/sg.im.naturalHeight : 1.98;

  function draw(c, W, H, now, ovPx){
    const dt = Math.min(.05, last ? (now-last)/1000 : 0); last = now; t += dt;
    const visH = H - ovPx;                       // リールに隠れない部分
    const ih = Math.max(visH*.98, W/1.98);       // 景色の高さ
    brakeT = Math.max(0, brakeT-dt);
    const brk = brakeT>0 ? (brakeT>.9 ? 1-(brakeT-.9)/.5 : brakeT/.9) : 0;   // 0→1→0：止まって、また走り出す
    const speedU = .34*(boost>0 ? 2.3 : 1)*(1-brk*.98), speed = speedU*ih;   // 1秒に景色の高さの何倍進むか
    panU += speedU*dt; boost = Math.max(0, boost-dt); jump = Math.max(0, jump-dt*1.7);
    if(bubble) bubble.t += dt;

    // 景色（ずっとループ）
    const starts=[]; let u=0; segs.forEach(sg=>{ starts.push(u); u += aspect(sg)*ih*(1-OVERLAP); });
    const loopLen = u;
    c.fillStyle="#9cc3e6"; c.fillRect(0,0,W,H);
    const pan = panU*ih, p = ((pan % loopLen)+loopLen)%loopLen;
    const vis=[];
    for(let rep=-1; rep<=1; rep++) segs.forEach((sg,i)=>{ const xl=starts[i]-p+rep*loopLen, w=aspect(sg)*ih; if(xl<W && xl+w>0) vis.push({sg,xl,w}); });
    vis.sort((a,b)=>a.xl-b.xl);
    vis.forEach((v,k)=>{ if(!ok(v.sg.im)) return; c.drawImage(k===0 ? v.sg.im : feather(v.sg.im), v.xl, 0, v.w, ih); });
    // 景色の下（リールの裏）は道路の色でつなぐ
    const gr=c.createLinearGradient(0,ih-2,0,H); gr.addColorStop(0,"#4a4d52"); gr.addColorStop(1,"#141518");
    c.fillStyle=gr; c.fillRect(0,ih-2,W,H-ih+2);

    // トラックの位置の道路の高さ（2枚が重なる所は間をとる）
    const tx = W*.44, TW = Math.min(W*.5, ih*.6), TH = TW*178/436;
    let road = .88, best=-1;
    vis.forEach(v=>{ const cx=tx-v.xl; if(cx>=0 && cx<=v.w){ const into=cx/(v.w*OVERLAP); if(best<0){ road=v.sg.road; best=1; } else road = road*(1-Math.min(1,into)) + v.sg.road*Math.min(1,into); } });
    const base = road*ih;
    const bob = Math.sin(t*22)*.8, jh = jump>0 ? Math.sin(jump*Math.PI)*TH*.75 : 0;
    const x = tx-TW/2, y = base-TH+bob-jh;

    // 影・スピード線・けむり
    const sl = 1-Math.sin(jump*Math.PI)*.45;
    c.fillStyle="rgba(0,0,0,.32)"; c.beginPath(); c.ellipse(tx, base+1, TW*.48*sl, 4*sl, 0, 0, 7); c.fill();
    if(boost>0){ c.strokeStyle=`rgba(255,255,255,${Math.min(1,boost)*.85})`; c.lineCap="round"; c.lineWidth=2.5;
      for(let k=0;k<5;k++){ const yy=y+TH*(.2+k*.16), l=30+((t*400+k*53)%50); c.beginPath(); c.moveTo(x-6-l,yy); c.lineTo(x-6,yy); c.stroke(); } }
    puffT -= dt;
    // けむりはトラックからの相対位置（景色の高さ基準）で持つ
    if(puffT<=0){ puffT = boost>0 ? .05 : .13; puffs.push({dx:-TW*.48/ih, dy:(TH*.86-TH)/ih, r:.01, a:.45});
      if(brakeT>.9){ puffs.push({dx:-TW*.25/ih, dy:-TH*.05/ih, r:.016, a:.7}, {dx:TW*.28/ih, dy:-TH*.05/ih, r:.016, a:.7}); puffT=.03; } }
    puffs.forEach(q=>{ q.dx -= (.12+speedU*.35)*dt; q.dy -= .04*dt; q.r += .05*dt; q.a -= .55*dt; });
    puffs = puffs.filter(q=>q.a>0);
    puffs.forEach(q=>{ c.fillStyle=`rgba(235,235,235,${q.a})`; c.beginPath(); c.arc(tx+q.dx*ih, base+q.dy*ih, q.r*ih, 0, 7); c.fill(); });
    if(ok(truck)){
      c.save(); c.translate(x,y);
      if(jump>0){ c.translate(TW/2,TH); c.rotate(-Math.sin(jump*Math.PI)*.08); c.translate(-TW/2,-TH); }
      if(brakeT>.9){ c.translate(TW,TH); c.rotate(.05*Math.sin((brakeT-.9)/.5*Math.PI)); c.translate(-TW,-TH); }
      c.drawImage(truckRight(), 0, 0, TW, TH); c.restore();
    }
    // 吹き出し
    if(bubble && bubble.t < 1.5){
      const bt = bubble.t, pop = bt<.18 ? easeOutBack(bt/.18) : 1, fade = bt>1.25 ? 1-(bt-1.25)/.25 : 1;
      const fs = Math.max(13, Math.min(24, ih*.075));
      c.save(); c.globalAlpha = fade;
      c.font = `900 ${fs}px "Noto Sans JP", sans-serif`;
      const tw = c.measureText(bubble.text).width, bw = tw+fs*1.3, bh = fs*1.9;
      const bx = Math.min(W-bw/2-8, Math.max(bw/2+8, tx+TW*.18)), by = y - bh*.75 - 8;
      c.translate(bx, by); c.scale(pop, pop);
      c.shadowColor="rgba(0,0,0,.35)"; c.shadowBlur=8; c.shadowOffsetY=3;
      c.fillStyle="#fff"; c.strokeStyle="#1a1a1a"; c.lineWidth=2.5;
      c.beginPath(); c.roundRect(-bw/2,-bh/2,bw,bh,bh/2); c.fill(); c.shadowColor="transparent"; c.stroke();
      c.beginPath(); c.moveTo(-bw*.12, bh/2-1); c.lineTo(-bw*.22, bh/2+fs*.7); c.lineTo(bw*.02, bh/2-1); c.closePath();
      c.fill(); c.beginPath(); c.moveTo(-bw*.12, bh/2); c.lineTo(-bw*.22, bh/2+fs*.7); c.lineTo(bw*.02, bh/2); c.stroke();
      c.fillStyle="#1a1a1a"; c.textAlign="center"; c.textBaseline="middle"; c.fillText(bubble.text, 0, 1);
      c.restore();
    }
  }
  return { draw, say(text){ bubble = {text, t:0}; }, jump(){ jump=1; boost=Math.max(boost,.7); }, dash(sec){ boost=Math.max(boost,sec); jump=1; brakeT=0; }, brake(){ brakeT=1.4; boost=0; } };
})();

function drawMonitor(now){

function loop(now){
  const dt = Math.min(.05,(now-last)/1000); last=now;
  reels.forEach((r,i)=>{
    if(r.state==="spin"){ r.v=Math.min(V_MAX, r.v+V_MAX*3*dt); r.offset-=r.v*dt; }
    else if(r.state==="stopping"){
      const a=r.anim, p=Math.min(1,(now-a.t0)/a.dur);
      r.offset = a.o0 - a.d*(a.slow ? easeSlide(p) : easeOutBack(p));
      if(a.slow){ const cell=Math.floor(r.offset); if(cell!==a.lastCell){ a.lastCell=cell; sfx.slide(p); } }
      if(p>=1){ r.offset=a.T; r.v=0; r.state="stopped"; onStopped(i); }
    }
  });
  if(reels.length) render();
  drawMonitor(now);
  requestAnimationFrame(loop);
}
function easeSlide(x){ return 1-Math.pow(1-x,4); }
function easeOutBack(x){ const c1=1.25, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }

const BUBBLES = [

// リーチの色：上に行くほど7（大当たり）が来やすい
const TIERS = ["blue","green","red","gold","rainbow"];
const TIER_W = {                     // 出やすさ（合計1）
  normal:{blue:.50, green:.32, red:.15, gold:.03, rainbow:0},
  rare:  {blue:0,   green:.05, red:.15, gold:.40, rainbow:.40},

// STARTを押した瞬間の予告が出る確率
const YOKOKU = { normal:.12, rare:.65 };
function pickW(w){ let x=Math.random(); for(const k of Object.keys(w)){ x-=w[k]; if(x<0) return k; } return Object.keys(w).pop(); }
function runYokoku(kind){

    const f=$("#monfx"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");

// 何回目で当たるか（1回目・2回目・3回目以降の当たる確率）
const HIT_BY_TRY = [0, .5, 1];
// ハズレのとき、リーチまで行ってから外れる確率
const REACH_MISS_RATE = .6;
// ハズレのリーチの色（青・緑が多め）
const MISS_TIER_W = {blue:.55, green:.33, red:.12, gold:0, rainbow:0};
let tries = 0;   // 前の当たりから何回まわしたか
function decideOutcome(){
  const M = MACHINES[ans.m];
  const pool = M.pool[ans.taste];
  tries++;
  const hitRate = HIT_BY_TRY[Math.min(tries, HIT_BY_TRY.length)-1];
  if(Math.random() >= hitRate){
    // ハズレ
    if(Math.random() < REACH_MISS_RATE)
      return {type:"reachMiss", sym:pick(pool), rare:false, tier:pickW(MISS_TIER_W),
              yokoku: Math.random() < .05 ? pick(["blackout","shake","brake"]) : null};
    const items = Object.keys(ITEMS).sort(()=>Math.random()-.5);
    return {type:"miss", syms:items.slice(0,3), rare:false, tier:"blue", yokoku:null};
  }
  tries = 0;
  const rare = Math.random() < RATE.rare;
  const kind = rare ? "rare" : "normal";
  return {type:"hit", sym: rare ? RARE.id : pick(pool), rare,
          tier: pickW(TIER_W[kind]),
          yokoku: Math.random() < YOKOKU[kind] ? pick(["blackout","shake","brake"]) : null};
}
function targetFor(i, committed){
  const r = reels[i], o = outcome;
  if(o.type==="miss") return T=>symAt(r,T)===o.syms[i];
  if(o.type==="reachMiss" && committed>=2)   // 最後のリールは1コマずれて止まる（おしい！）
    return T=>symAt(r,T)!==o.sym && (r.order[mod(T,L)]===o.sym || r.order[mod(T+2,L)]===o.sym);
  return T=>symAt(r,T)===o.sym;
}

async function onStopped(i){

    const [a,b] = stopped;
    if(symAt(reels[a],reels[a].offset)===symAt(reels[b],reels[b].offset)){

      spinTicker = setInterval(()=>sfx.tick(420+Math.random()*80,.02), 110);
      // 最後のSTOPが黄金に開く

      stopBtns[left].classList.add("gold"); sfx.goldopen(); buzz([30,30,60]);
      // 押さなくても、少し待つと自動で止まる
      clearTimeout(autoStopT); autoStopT = setTimeout(()=>doStop(left), 2600);
    }
  }
  if(stopped.length===3){
    clearInterval(spinTicker); clearTimeout(autoStopT);
    $("#cabFrame").classList.remove("gold");
    document.querySelectorAll(".stopwrap").forEach(w=>w.classList.remove("goldopen"));

    delete $("#cab").dataset.tier;
    $("#cab").classList.remove("fever");
    const s = reels.map(r=>symAt(r,r.offset));
    if(s[0]===s[1] && s[1]===s[2]) win(s[0]);
