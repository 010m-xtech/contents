<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おさかな シルエット クイズ</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Game1,2用のStickとGame3用のYomogi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stick&family=Yomogi&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 共通・Game1・Game2用 */
            --ai: #2C4A78;
            --ai-light: #4C6A94;
            --ai-pale: #DCE7F5;
            --shu: #E8563E;
            --shu-pale: #FFE3DA;
            --maru: #2E86AB;
            --batsu: #E8563E;
            --sumi: #3A342C;
            --font: 'Stick', sans-serif;

            /* Game3 (おおきさくらべ)用 */
            --g3-kinari: rgba(253, 248, 240, 0.75);
            --g3-ai: #30547A;
            --g3-ai-light: #52759E;
            --g3-ai-pale: #E4EDF7;
            --g3-shu: #E25B45;
            --g3-shu-pale: #FCE7E3;
            --g3-sumi: #3A3228;
            --g3-line: #D4C5AC; /* 【修正1】未定義だった変数を追加 */
            --g3-font: 'Yomogi', cursive;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font);
            background-color: transparent;
            color: #4a3b32;
            word-break: keep-all;
            overflow-wrap: break-word;
            -webkit-font-smoothing: antialiased;
            margin: 0; padding: 0;
            min-height: 100vh;
        }

        /* 共通背景（動画なし/読み込み失敗時は、この静止背景が表示される） */
        .video-bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -10;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.55) 0, rgba(255, 255, 255, 0) 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 176, 124, 0.35) 0, rgba(255, 176, 124, 0) 50%),
                #FDECC8;
        }
        .video-bg-container video {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            transition: opacity 1.5s linear;
        }
        /* 【修正4】軽量モード・動画失敗時は動画を完全に非表示 */
        body.lite .video-bg-container video,
        .video-bg-container.no-video video { display: none; }

        /* オープニング用のCSS */
        #intro-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #FFFFFF; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 1s ease; cursor: pointer;
        }
        #intro-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transition: opacity 1s ease;
        }
        /* 横長のオープニング動画：縦画面ではロゴが小さくなりすぎないよう拡大して中央に置く */
        @media (orientation: portrait) {
            #intro-video { top: 50%; left: -40%; width: 180%; height: auto; transform: translateY(-50%); object-fit: fill; }
        }
        #intro-logo {
            position: relative; z-index: 10; max-width: 55%; max-height: 55%;
            opacity: 0; transform: scale(0.92); transition: opacity 1s ease, transform 1.2s ease; object-fit: contain;
        }
        #intro-logo[style*="opacity: 1"] { transform: scale(1); }
        #intro-skip-text {
            position: absolute; bottom: 8vh; left: 50%; transform: translateX(-50%);
            color: #6b7280; font-size: 15px; font-weight: bold; z-index: 20;
            white-space: nowrap; letter-spacing: 0.1em;
                        animation: blinkAndFloat 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes blinkAndFloat {
            0%, 100% { opacity: 0.3; transform: translate(-50%, 0); }
            50% { opacity: 1; transform: translate(-50%, -10px); }
        }

        /* 【修正2】誤タップ防止：この間は押せない */
        .tap-lock { pointer-events: none !important; }

        .kirie-box {
            background-color: rgba(255, 255, 255, 0.85);
            clip-path: polygon(2% 3%, 30% 1%, 75% 2%, 98% 4%, 99% 30%, 97% 75%, 96% 97%, 70% 99%, 25% 97%, 4% 96%, 1% 70%, 2% 25%);
            filter: drop-shadow(6px 6px 0px rgba(74, 59, 50, 0.4));
            transform: rotate(-1deg);
        }
        .kirie-btn {
            clip-path: polygon(3% 4%, 25% 1%, 80% 3%, 97% 5%, 99% 50%, 96% 96%, 75% 98%, 20% 96%, 4% 97%, 1% 50%);
            filter: drop-shadow(4px 4px 0px rgba(74, 59, 50, 0.4));
            transition: all 0.2s ease;
            position: relative;
        }
        .kirie-btn:nth-child(odd) {
            clip-path: polygon(1% 5%, 40% 1%, 98% 3%, 96% 50%, 99% 95%, 60% 98%, 3% 97%, 4% 50%);
            transform: rotate(1deg);
        }
        .kirie-btn:nth-child(even) {
            clip-path: polygon(4% 2%, 70% 3%, 96% 1%, 98% 60%, 95% 98%, 30% 96%, 1% 95%, 2% 40%);
            transform: rotate(-1deg);
        }
        .kirie-btn:active {
            transform: translate(4px, 4px) rotate(0deg) !important;
            filter: drop-shadow(0px 0px 0px rgba(74, 59, 50, 0.4)) !important;
        }

        .kirie-title { display: inline-block; transform: rotate(-2deg); }
        .kirie-badge {
            clip-path: polygon(4% 3%, 96% 5%, 98% 95%, 5% 96%);
            filter: drop-shadow(3px 3px 0px rgba(74, 59, 50, 0.3));
            transform: rotate(2deg);
        }
        .kirie-img-box {
            background-color: #fdf6e3;
            clip-path: polygon(2% 3%, 97% 2%, 96% 97%, 3% 96%);
            filter: drop-shadow(4px 4px 0px rgba(74, 59, 50, 0.15));
        }
        .btn-orange { background-color: #ffb07c; }
        .btn-blue { background-color: #93c5fd; }
        .btn-green { background-color: #86efac; }
        .btn-pink { background-color: #f9a8d4; }
        .btn-yellow { background-color: #fde047; }
        .btn-gray { background-color: #e5e7eb; }

        .silhouette { filter: brightness(0); transition: filter 0.3s ease; }
        .hint-mode { filter: brightness(0.3) grayscale(0.5); transition: filter 0.3s ease; }

        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .swim-in { animation: swimIn 2.5s ease-in-out forwards; }
        @keyframes swimIn {
            0% { opacity: 0; transform: translateX(60px) translateY(10px) rotate(-3deg); }
            50% { opacity: 0.8; transform: translateX(20px) translateY(-5px) rotate(2deg); }
            100% { opacity: 1; transform: translateX(0) translateY(0) rotate(0deg); }
        }

        @keyframes animSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes animFlip { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        @keyframes animShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) rotate(-3deg); }
            20%, 40%, 60%, 80% { transform: translateX(5px) rotate(3deg); }
        }
        .anim-spin { animation: animSpin 0.6s ease; }
        .anim-flip { animation: animFlip 0.6s ease; }
        .anim-shake { animation: animShake 0.6s ease; }


        /* ===== ごほうび／はげまし演出（音なし） ===== */
        #fx-layer { position: fixed; inset: 0; z-index: 100000; pointer-events: none; overflow: hidden; }
        .fx-piece { position: absolute; left: 50%; top: 45%; font-size: 30px; line-height: 1; opacity: 0;
            animation: fxFly 1.5s ease-out forwards; }
        @keyframes fxFly {
            0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3) rotate(0deg); }
            15% { opacity: 1; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--rot)); }
        }
        .fx-swim { position: absolute; left: -20%; font-size: 44px; line-height: 1; animation: fxSwim 2.4s ease-in-out forwards; }
        @keyframes fxSwim {
            0% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(65vw) translateY(-14px); }
            100% { transform: translateX(135vw) translateY(0); }
        }
        .fx-bubble { position: absolute; bottom: -10%; font-size: 26px; line-height: 1; opacity: 0; animation: fxRise 2.2s ease-in forwards; }
        @keyframes fxRise {
            0% { opacity: 0; transform: translateY(0); }
            20% { opacity: .9; }
            100% { opacity: 0; transform: translateY(-85vh) translateX(var(--sx)); }
        }
        .fx-wobble { animation: fxWobble 0.9s ease-in-out; }
        @keyframes fxWobble {
            0%,100% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-6deg) scale(1.05); }
            40% { transform: rotate(5deg) scale(0.97); }
            60% { transform: rotate(-3deg) scale(1.02); }
            80% { transform: rotate(2deg); }
        }
        .fx-hop { animation: fxHop 0.7s ease-out; }
        @keyframes fxHop { 0% { transform: scale(0.6); } 55% { transform: scale(1.15); } 100% { transform: scale(1); } }

        /* ===== すいそう：水の中の背景 ===== */
        #g1-aqua-box { background: linear-gradient(#c9f0ff 0%, #78cbf0 40%, #2f89c6 100%) !important; }
        #g1-aqua-box .aqua-rays { position: absolute; inset: -20% -10% 0 -10%; z-index: 0; pointer-events: none; opacity: .35;
            background: repeating-linear-gradient(105deg, rgba(255,255,255,0) 0 28px, rgba(255,255,255,.55) 28px 52px, rgba(255,255,255,0) 52px 96px);
            -webkit-mask-image: linear-gradient(#000, transparent 85%); mask-image: linear-gradient(#000, transparent 85%);
            animation: aquaRays 9s ease-in-out infinite alternate; }
        @keyframes aquaRays { from { transform: translateX(-18px); } to { transform: translateX(18px); } }
        #g1-aqua-box .aqua-sand { position: absolute; left: 0; right: 0; bottom: 0; height: 38px; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse 60px 14px at 20% 0, #f3dca4 98%, transparent 100%), radial-gradient(ellipse 80px 16px at 65% 0, #f3dca4 98%, transparent 100%), #e9cf8f; }
        #g1-aqua-box .aqua-weed { position: absolute; bottom: 24px; z-index: 1; pointer-events: none; transform-origin: 50% 100%; animation: aquaSway 3.4s ease-in-out infinite alternate; }
        @keyframes aquaSway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
        #g1-aqua-box .aqua-bub { position: absolute; bottom: 20px; z-index: 2; pointer-events: none; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.85); background: rgba(255,255,255,.25); animation: aquaBub 6s ease-in infinite; }
        @keyframes aquaBub { 0% { transform: translateY(0) translateX(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-300px) translateX(14px); opacity: 0; } }
        #g1-aqua-box #g1-aquarium-fish-area { position: relative; z-index: 3; }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- オープニング（デモ用：MMGロゴを表示） -->
    <div id="intro-container">
        <img id="intro-logo" src="mmg_logo.webp" alt="MMG">
        <div id="intro-skip-text">画面をタップしてスキップ</div>
    </div>

    <!-- 共通背景動画（失敗・軽量モード時は .video-bg-container の静止背景が見える） -->
    <div class="video-bg-container" id="bg-container">
        <video id="bg-video-1" data-src="marubatsu_back.mp4" muted playsinline preload="auto" style="opacity: 1;"></video>
        <video id="bg-video-2" data-src="marubatsu_back.mp4" muted playsinline preload="none" style="opacity: 0;"></video>
    </div>

    <!-- GAME 1: おさかな シルエット クイズ -->
    <div id="game1-container" class="w-full max-w-md mx-auto relative overflow-hidden p-4">
        <!-- スタート画面 -->
        <div id="screen-start" class="kirie-box p-8 text-center flex flex-col items-center justify-center min-h-[400px]">
            <h1 class="text-4xl font-bold mb-8 leading-snug kirie-title text-orange-600">おさかな<br>シルエット<br>クイズ</h1>
            <button onclick="g1_startGame()" class="kirie-btn btn-orange text-2xl font-bold py-5 px-10 mb-5 w-full">スタート！</button>
        </div>

        <!-- クイズ画面 -->
        <div id="screen-quiz" class="hidden -mt-6">
            <div class="kirie-box p-4 pt-5 flex flex-col items-center min-h-[400px]">
                <h2 id="g1-question-number" class="text-2xl font-bold mb-2 btn-yellow inline-block px-6 py-2 kirie-badge">1 もんめ</h2>
                <p class="mb-2 font-bold text-lg">これは なんの おさかな かな？</p>
                <div class="w-48 h-48 mb-2 relative flex justify-center items-center kirie-img-box p-2">
                    <img id="g1-fish-image" src="" alt="おさかな" class="max-w-full max-h-full object-contain">
                </div>
                <button onclick="g1_showHint()" id="g1-hint-btn" class="kirie-btn btn-green text-xl font-bold py-3 px-10 mb-5">ひんと</button>

            </div>
        </div>

        <!-- 結果ポップアップ -->
        <div id="g1-popup-result" class="hidden fixed top-0 left-0 w-full h-full bg-black/40 flex items-center justify-center p-4 z-50">
            <div class="kirie-box p-8 text-center bg-white w-full max-w-sm fade-in flex flex-col items-center">
                <h2 id="g1-popup-title" class="text-4xl font-bold mb-4 text-red-500 kirie-title">せいかい！</h2>
                <div class="w-40 h-40 mb-4 relative flex justify-center items-center kirie-img-box p-2">
                    <img id="g1-result-image" src="" alt="こたえの おさかな" class="max-w-full max-h-full object-contain cursor-pointer" onclick="g1_playResultAnimation()">
                </div>
                <p id="g1-popup-text" class="text-xl mb-6 font-bold"></p>
                <p id="g1-popup-trivia" class="text-base mb-6 font-bold text-gray-700 bg-yellow-100 p-3 rounded-lg kirie-box w-full"></p>
                <button id="g1-next-btn" onclick="g1_nextQuestion()" class="kirie-btn btn-blue text-2xl font-bold py-4 px-8 w-full">つぎの もんだい へ</button>
            </div>
        </div>

        <!-- おわりの画面 -->
        <div id="screen-end" class="hidden kirie-box p-8 text-center flex flex-col items-center justify-center min-h-[400px]">
            <h2 class="text-4xl font-bold mb-6 kirie-title">おしまい！</h2>
            <div class="mb-8">
                <p class="text-xl font-bold mb-4">きみの せいかい かず は...</p>
                <p id="g1-final-score" class="text-4xl font-bold btn-yellow inline-block px-8 py-4 kirie-badge">5 もん</p>
            </div>
            <button onclick="g1_showAquarium()" class="kirie-btn btn-blue text-xl font-bold py-5 px-10 mb-5 w-full">すいそう を みる！</button>
            <button onclick="g1_resetGame()" class="kirie-btn btn-green text-xl font-bold py-5 px-10 mb-5 w-full">もういちど あそぶ</button>
        </div>

        <!-- すいそう画面 -->
        <div id="screen-aquarium" class="hidden kirie-box p-6 flex flex-col items-center justify-center min-h-[500px] w-full">
            <h2 class="text-2xl font-bold mb-4 kirie-badge btn-blue px-6 py-2">きみの すいそう</h2>
            <div id="g1-aqua-box" class="w-full h-[300px] relative overflow-hidden mb-6 kirie-img-box">
                <div class="aqua-rays"></div><svg class="aqua-weed" style="left:6%;animation-delay:0s" width="34" height="90" viewBox="0 0 34 90"><path d="M17 90 C5 67 29 45 17 27 S5 13 17 0" fill="none" stroke="#2f9e5c" stroke-width="7" stroke-linecap="round"/></svg><svg class="aqua-weed" style="left:14%;animation-delay:1.2s" width="34" height="64" viewBox="0 0 34 64"><path d="M17 64 C5 48 29 32 17 19 S5 9 17 0" fill="none" stroke="#49b872" stroke-width="7" stroke-linecap="round"/></svg><svg class="aqua-weed" style="left:80%;animation-delay:0.6s" width="34" height="80" viewBox="0 0 34 80"><path d="M17 80 C5 60 29 40 17 24 S5 12 17 0" fill="none" stroke="#2f9e5c" stroke-width="7" stroke-linecap="round"/></svg><svg class="aqua-weed" style="left:90%;animation-delay:1.8s" width="34" height="58" viewBox="0 0 34 58"><path d="M17 58 C5 43 29 29 17 17 S5 8 17 0" fill="none" stroke="#49b872" stroke-width="7" stroke-linecap="round"/></svg><div class="aqua-sand"></div><span class="aqua-bub" style="left:12%;width:10px;height:10px;animation-delay:0.0s;animation-duration:6.0s"></span><span class="aqua-bub" style="left:30%;width:14px;height:14px;animation-delay:2.1s;animation-duration:7.0s"></span><span class="aqua-bub" style="left:52%;width:8px;height:8px;animation-delay:1.2s;animation-duration:5.5s"></span><span class="aqua-bub" style="left:70%;width:12px;height:12px;animation-delay:3.4s;animation-duration:6.5s"></span><span class="aqua-bub" style="left:88%;width:9px;height:9px;animation-delay:0.7s;animation-duration:5.8s"></span>
                <div id="g1-aquarium-fish-area" class="w-full h-full relative"></div>
            </div>
            <button onclick="g1_resetGame()" class="kirie-btn btn-green text-xl font-bold py-5 px-10 mb-5 w-full">もういちど あそぶ</button>
        </div>
    </div>



    <div id="fx-layer" aria-hidden="true"></div>
    <script>
        // ===== ごほうび／はげまし演出 =====
        const FX_LAYER = () => document.getElementById('fx-layer');
        function fxClear(ms) { setTimeout(() => { const l = FX_LAYER(); if (l) l.innerHTML = ''; }, ms); }
        function fxReward(big) {
            const l = FX_LAYER(); if (!l) return;
            const icons = ['⭐', '✨', '🐟', '🫧', '🌟', '🐠'];
            const n = big ? 26 : 16;
            for (let i = 0; i < n; i++) {
                const p = document.createElement('span'); p.className = 'fx-piece';
                p.textContent = icons[Math.floor(Math.random() * icons.length)];
                const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * (big ? 230 : 170);
                p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
                p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
                p.style.animationDelay = (Math.random() * 0.15) + 's';
                l.appendChild(p);
            }
            const f = document.createElement('span'); f.className = 'fx-swim';
            f.textContent = ['🐟', '🐠', '🐡'][Math.floor(Math.random() * 3)];
            f.style.top = (18 + Math.random() * 55) + '%';
            l.appendChild(f);
            fxClear(2600);
        }
        // まちがえたとき：やさしく あわが のぼる
        function fxCheer() {
            const l = FX_LAYER(); if (!l) return;
            for (let i = 0; i < 9; i++) {
                const b = document.createElement('span'); b.className = 'fx-bubble';
                b.textContent = '🫧';
                b.style.left = (8 + Math.random() * 84) + '%';
                b.style.setProperty('--sx', (Math.random() * 60 - 30) + 'px');
                b.style.animationDelay = (Math.random() * 0.6) + 's';
                l.appendChild(b);
            }
            fxClear(3000);
        }
        const FX_CHEER_WORDS = ['だいじょうぶ！', 'つぎは できるよ！', 'いいちょうせん！', 'もうすこし！'];
        const fxCheerWord = () => FX_CHEER_WORDS[Math.floor(Math.random() * FX_CHEER_WORDS.length)];
    </script>

    <script>
        // ------------------------------------------------
        // 設定
        // ------------------------------------------------
        const IDLE_RETURN_MS = 60000; // 操作がなければ最初の画面へ戻るまでの時間（ミリ秒）
        const TAP_LOCK_MS = 500;      // 【修正2】誤タップ防止の時間（ミリ秒）

        // ------------------------------------------------
        // 【修正2】誤タップ防止ヘルパー
        // ------------------------------------------------
        function lockTap(elements, ms) {
            const list = Array.from(elements).filter(Boolean);
            list.forEach(el => el.classList.add('tap-lock'));
            setTimeout(() => list.forEach(el => el.classList.remove('tap-lock')), ms || TAP_LOCK_MS);
        }

        // ------------------------------------------------
        // 【修正4】軽量モード判定
        //   ?lite=1 で軽量モード（この端末に記憶）、?lite=0 で解除
        //   端末の「データセーバー」設定でも自動で軽量モード
        // ------------------------------------------------
        let isLite = false;
        (function detectLite() {
            const params = new URLSearchParams(location.search);
            const q = params.get('lite');
            try {
                if (q === '1') localStorage.setItem('fishQuizLite', '1');
                if (q === '0') localStorage.removeItem('fishQuizLite');
                isLite = localStorage.getItem('fishQuizLite') === '1';
            } catch (e) {
                isLite = (q === '1');
            }
            try {
                if (navigator.connection && navigator.connection.saveData) isLite = true;
                if (window.matchMedia && window.matchMedia('(prefers-reduced-data: reduce)').matches) isLite = true;
            } catch (e) {}
            if (isLite) document.body.classList.add('lite');
        })();

        function resetToStart() {
            document.getElementById("g1-popup-result").classList.add("hidden");
            document.getElementById("screen-aquarium").classList.add("hidden");
            document.getElementById("screen-quiz").classList.add("hidden");
            document.getElementById("screen-end").classList.add("hidden");
            document.getElementById("screen-start").classList.remove("hidden");
            window.scrollTo({top: 0});
        }

        // ------------------------------------------------
        // 操作がなければ、お店の端末で次のお客さんがすぐ遊べるよう最初の画面に戻す
        // ------------------------------------------------
        let idleTimer = null;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(resetToStart, IDLE_RETURN_MS);
        }
        ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'scroll'].forEach(evt => {
            window.addEventListener(evt, resetIdleTimer, { passive: true });
        });
        resetIdleTimer();

        // ------------------------------------------------
        // 共通: 背景動画（クロスフェードループ）とオープニング
        // 【修正4】軽量モード／再生失敗時は静止背景にフォールバック
        // ------------------------------------------------
        function disableBgVideo() {
            const box = document.getElementById('bg-container');
            if (box) box.classList.add('no-video');
            ['bg-video-1', 'bg-video-2'].forEach(id => {
                const v = document.getElementById(id);
                if (v) { try { v.pause(); } catch (e) {} v.removeAttribute('src'); v.load(); }
            });
        }

        function initBackgroundVideo() {
            const v1 = document.getElementById('bg-video-1');
            const v2 = document.getElementById('bg-video-2');
            if (!v1 || !v2) return;

            if (isLite) { disableBgVideo(); return; }

            v1.src = v1.dataset.src;
            v2.src = v2.dataset.src;
            v2.preload = 'auto';

            const fadeDuration = 1.5;
            let activeVideo = v1;
            let nextVideo = v2;
            let isSwapping = false;
            let failed = false;

            const fail = () => { if (failed) return; failed = true; disableBgVideo(); };

            v1.addEventListener('error', fail);
            v2.addEventListener('error', fail);
            v1.play().catch(fail);

            // 4秒たっても再生が始まらなければ静止背景にする（iOS Safariの自動再生制限など）
            setTimeout(() => {
                if (!failed && (v1.paused || v1.readyState < 2 || v1.currentTime === 0)) fail();
            }, 4000);

            function handleTimeUpdate(e) {
                const vid = e.target;
                if (vid !== activeVideo) return;

                if (vid.duration > 0 && (vid.duration - vid.currentTime <= fadeDuration)) {
                    if (isSwapping) return;
                    isSwapping = true;

                    nextVideo.currentTime = 0;
                    nextVideo.play().catch(() => {});
                    nextVideo.style.opacity = 1;
                    activeVideo.style.opacity = 0;

                    setTimeout(() => {
                        let temp = activeVideo;
                        activeVideo = nextVideo;
                        nextVideo = temp;
                        isSwapping = false;
                    }, fadeDuration * 1000);
                }
            }
            v1.addEventListener('timeupdate', handleTimeUpdate);
            v2.addEventListener('timeupdate', handleTimeUpdate);

            // タブが隠れたときは動画を止めて電池を節約
            document.addEventListener('visibilitychange', () => {
                if (failed) return;
                if (document.hidden) { v1.pause(); v2.pause(); }
                else { activeVideo.play().catch(() => {}); }
            });
        }

        function initIntro() {
            const introContainer = document.getElementById('intro-container');
            const introVideo = document.getElementById('intro-video');
            const introLogo = document.getElementById('intro-logo');
            if (!introContainer) return;

            let introSkipped = false;
            let introTimeouts = [];
            let introPhaseTriggered = false;

            const endIntro = () => {
                if (introSkipped) return;
                introSkipped = true;
                introTimeouts.forEach(clearTimeout);
                introContainer.style.opacity = '0';
                setTimeout(() => {
                    introContainer.style.display = 'none';
                    if (introVideo) { try { introVideo.pause(); } catch (e) {} }
                }, 1000);
            };

            // 動画なしでロゴだけ見せて終了する
            const logoOnly = () => {
                if (introSkipped || introPhaseTriggered) return;
                introPhaseTriggered = true;
                if (introVideo) { try { introVideo.pause(); } catch (e) {} introVideo.style.display = 'none'; }
                if (introLogo) introLogo.style.opacity = '1';
                introTimeouts.push(setTimeout(endIntro, 2800));
            };

            introContainer.addEventListener('click', endIntro);
            introContainer.addEventListener('touchstart', endIntro, {passive: true});

            if (isLite || !introVideo) {
                logoOnly();
                return;
            }

            introVideo.src = introVideo.dataset.src;
            introVideo.addEventListener('error', logoOnly);
            introVideo.play().catch(logoOnly);

            // 3.5秒たっても動画が動かなければロゴだけにする
            introTimeouts.push(setTimeout(() => {
                if (!introPhaseTriggered && (introVideo.paused || introVideo.currentTime === 0)) logoOnly();
            }, 3500));

            // 新しいオープニング動画はロゴの演出まで動画の中に入っているので、
            // 終わったらそのままゲームへ進む（ロゴ画像は動画が使えないときだけ表示）
            introVideo.addEventListener('ended', () => {
                if (!introSkipped && !introPhaseTriggered) {
                    introPhaseTriggered = true;
                    endIntro();
                }
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            initBackgroundVideo();
            initIntro();
        });

        // ================================================
        // GAME 1 の ロジック
        // ================================================
        const g1_isRandomMode = true;
        const g1_maxQuestions = 5;
        const g1_allFishData = [
            { name: "まぐろ", img: "maguro.webp", options: ["まぐろ", "じんべえざめ", "まんぼう"], trivia: "まぐろ は とっても はやく およぐよ！" },
            { name: "じんべえざめ", img: "zinnbe.webp", options: ["くじら", "じんべえざめ", "えい"], trivia: "せかいで いちばん おおきい おさかな だよ！" },
            { name: "まんぼう", img: "manbo.webp", options: ["えい", "たつのおとしご", "まんぼう"], trivia: "とっても おおきくて のんびりやさん だよ！" },
            { name: "えい", img: "ei.webp", options: ["えい", "ひらめ", "とびうお"], trivia: "うみの そこを ひらひら とぶように およぐよ！" },
            { name: "ひらめ", img: "hirame.webp", options: ["まぐろ", "ひらめ", "ちょうちんあんこう"], trivia: "すな に かくれて かくれんぼ が じょうず！" },
            { name: "たつのおとしご", img: "tatsuoto.webp", options: ["たつのおとしご", "えい", "とびうお"], trivia: "くるくる の しっぽ で くさ を つかむんだよ！" },
            { name: "とびうお", img: "tobiuo.webp", options: ["じんべえざめ", "とびうお", "まんぼう"], trivia: "むなびれ を ひろげて そら を とぶよ！" },
            { name: "ちょうちんあんこう", img: "ankoo.webp", options: ["ちょうちんあんこう", "まぐろ", "ひらめ"], trivia: "あたま の ひかり で えもの を よぶよ！" }
        ];

        let g1_currentQuestions = [];
        let g1_currentIndex = 0;
        let g1_score = 0;
        let g1_correctFishes = [];
        const g1_btnColors = ["btn-orange", "btn-blue", "btn-pink"];

        function g1_startGame() {
            g1_score = 0;
            g1_currentIndex = 0;
            g1_correctFishes = [];
            if (g1_isRandomMode) {
                let shuffled = [...g1_allFishData].sort(() => 0.5 - Math.random());
                g1_currentQuestions = shuffled.slice(0, g1_maxQuestions);
            } else {
                g1_currentQuestions = g1_allFishData.slice(0, g1_maxQuestions);
            }
            document.getElementById("screen-start").classList.add("hidden");
            document.getElementById("screen-quiz").classList.remove("hidden");
            g1_setQuestion();
        }

        function g1_setQuestion() {
            const q = g1_currentQuestions[g1_currentIndex];
            document.getElementById("g1-question-number").textContent = `${g1_currentIndex + 1} もんめ`;

            const fishImage = document.getElementById("g1-fish-image");
            fishImage.src = q.img;
            fishImage.classList.remove("hint-mode");
            fishImage.classList.add("silhouette");
            document.getElementById("g1-hint-btn").style.display = "block";

            fishImage.classList.remove("fade-in", "swim-in");
            void fishImage.offsetWidth;
            fishImage.classList.add("swim-in");

            const optionsContainer = document.getElementById("g1-options-container");
            optionsContainer.innerHTML = "";
            let shuffledOptions = [...q.options].sort(() => 0.5 - Math.random());

            shuffledOptions.forEach((optionText, index) => {
                const btn = document.createElement("button");
                btn.textContent = optionText;
                const colorClass = g1_btnColors[index % g1_btnColors.length];
                btn.className = `kirie-btn ${colorClass} text-2xl font-bold py-5 px-6 w-full`;
                btn.onclick = () => g1_checkAnswer(optionText, q.name);
                optionsContainer.appendChild(btn);
            });

            // 【修正2】前のポップアップの「つぎへ」連打で、次の問題を誤って答えないようにする
            lockTap(optionsContainer.children);
        }

        function g1_checkAnswer(selected, correct) {
            document.getElementById("g1-popup-result").classList.remove("hidden");
            // 【修正2】ポップアップが出た直後は「つぎへ」を押せない
            lockTap([document.getElementById("g1-next-btn")]);

            const q = g1_currentQuestions[g1_currentIndex];
            const resultImage = document.getElementById("g1-result-image");
            resultImage.src = q.img;

            const fishImage = document.getElementById("g1-fish-image");
            fishImage.classList.remove("silhouette", "hint-mode");
            resultImage.className = "max-w-full max-h-full object-contain cursor-pointer";

            const popupTitle = document.getElementById("g1-popup-title");
            const popupText = document.getElementById("g1-popup-text");
            if (selected === correct) {
                g1_score++;
                g1_correctFishes.push(q);
                const msgs = ["すごいね！", "やったね！"];
                popupTitle.textContent = msgs[Math.floor(Math.random() * msgs.length)];
                popupTitle.className = "text-4xl font-bold mb-4 text-red-500 kirie-title";
                resultImage.classList.add("fx-hop");
                fxReward(g1_score === g1_currentQuestions.length);
            } else {
                popupTitle.textContent = fxCheerWord();
                popupTitle.className = "text-3xl font-bold mb-4 text-blue-500 kirie-title";
                resultImage.classList.add("fx-wobble");
                fxCheer();
            }
            popupText.innerHTML = `せいかい は<br>「${correct}」でした！`;
            document.getElementById("g1-popup-trivia").innerHTML = `💡 まめちしき<br><span class="text-sm">${q.trivia}</span>`;
        }

        function g1_playResultAnimation() {
            const resultImage = document.getElementById("g1-result-image");
            const anims = ["anim-spin", "anim-flip", "anim-shake"];
            const randomAnim = anims[Math.floor(Math.random() * anims.length)];
            resultImage.classList.remove("anim-spin", "anim-flip", "anim-shake");
            void resultImage.offsetWidth;
            resultImage.classList.add(randomAnim);
        }

        function g1_showHint() {
            const fishImage = document.getElementById("g1-fish-image");
            fishImage.classList.remove("silhouette");
            fishImage.classList.add("hint-mode");
            document.getElementById("g1-hint-btn").style.display = "none";
        }

        function g1_nextQuestion() {
            document.getElementById("g1-popup-result").classList.add("hidden");
            g1_currentIndex++;
            if (g1_currentIndex < g1_currentQuestions.length) {
                g1_setQuestion();
            } else {
                g1_showEndScreen();
            }
        }

        function g1_showEndScreen() {
            document.getElementById("screen-quiz").classList.add("hidden");
            document.getElementById("screen-end").classList.remove("hidden");
            document.getElementById("g1-final-score").textContent = `${g1_score} もん`;
            if (g1_score === g1_currentQuestions.length) fxReward(true);
            // 【修正2】終了画面でも直後の誤タップを防ぐ
            lockTap(document.querySelectorAll('#screen-end button'));
        }

        function g1_showAquarium() {
            document.getElementById("screen-end").classList.add("hidden");
            const screenAquarium = document.getElementById("screen-aquarium");
            screenAquarium.classList.remove("hidden");

            const area = document.getElementById("g1-aquarium-fish-area");
            area.innerHTML = "";

            if (g1_correctFishes.length === 0) {
                area.innerHTML = '<p class="text-white text-center mt-20 font-bold">おさかな が いないみたい...</p>';
                return;
            }

            g1_correctFishes.forEach((fish) => {
                const img = document.createElement("img");
                img.src = fish.img; img.alt = fish.name;
                img.className = "absolute object-contain cursor-pointer drop-shadow-md";

                const size = 60 + Math.random() * 50;
                img.style.width = `${size}px`; img.style.height = `${size}px`;

                let currentX = Math.random() * 80;
                let currentY = Math.random() * 70;
                let currentScaleX = 1;

                img.style.left = `${currentX}%`; img.style.top = `${currentY}%`;
                img.style.transform = `scaleX(${currentScaleX})`;

                let isDragging = false, swimTimer = null, startX = 0, startY = 0, lastDragX = 0, hasMoved = false;

                const swimFreely = () => {
                    if (!screenAquarium.classList.contains("hidden") && !isDragging) {
                        const nextX = Math.random() * 80;
                        const nextY = Math.random() * 70;
                        const nextRotate = -15 + Math.random() * 30;
                        const duration = 4000 + Math.random() * 4000;

                        if (nextX < currentX) currentScaleX = -1;
                        else if (nextX > currentX) currentScaleX = 1;
                        currentX = nextX;

                        img.style.transition = `all ${duration}ms ease-in-out`;
                        img.style.left = `${nextX}%`; img.style.top = `${nextY}%`;
                        img.style.transform = `rotate(${nextRotate}deg) scaleX(${currentScaleX})`;
                        swimTimer = setTimeout(swimFreely, duration);
                    }
                };

                swimTimer = setTimeout(swimFreely, 100 + Math.random() * 1000);

                const startDrag = (e) => {
                    isDragging = true; hasMoved = false; clearTimeout(swimTimer);
                    img.style.transition = 'none';
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    startX = clientX; startY = clientY; lastDragX = clientX;
                    if(e.cancelable) e.preventDefault();
                    document.addEventListener('mousemove', doDrag, {passive: false});
                    document.addEventListener('touchmove', doDrag, {passive: false});
                    document.addEventListener('mouseup', endDrag);
                    document.addEventListener('touchend', endDrag);
                };

                const doDrag = (e) => {
                    if (!isDragging) return;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    if (Math.abs(clientX - startX) > 5 || Math.abs(clientY - startY) > 5) hasMoved = true;

                    const moveX = clientX - lastDragX;
                    if (moveX < -2) currentScaleX = -1;
                    if (moveX > 2) currentScaleX = 1;
                    img.style.transform = `scaleX(${currentScaleX})`;
                    lastDragX = clientX;

                    const rect = area.getBoundingClientRect();
                    let x = clientX - rect.left - (size / 2);
                    let y = clientY - rect.top - (size / 2);
                    x = Math.max(0, Math.min(x, rect.width - size));
                    y = Math.max(0, Math.min(y, rect.height - size));

                    currentX = (x / rect.width) * 100;
                    img.style.left = `${currentX}%`;
                    img.style.top = `${(y / rect.height) * 100}%`;
                    if(e.cancelable) e.preventDefault();
                };

                const endDrag = (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    document.removeEventListener('mousemove', doDrag);
                    document.removeEventListener('touchmove', doDrag);
                    document.removeEventListener('mouseup', endDrag);
                    document.removeEventListener('touchend', endDrag);

                    if (!hasMoved) {
                        img.classList.remove("anim-spin"); void img.offsetWidth;
                        img.classList.add("anim-spin");
                        setTimeout(() => { img.classList.remove("anim-spin"); swimFreely(); }, 600);
                    } else {
                        swimFreely();
                    }
                };

                img.addEventListener('mousedown', startDrag);
                img.addEventListener('touchstart', startDrag, {passive: false});
                area.appendChild(img);
            });
        }

        function g1_resetGame() {
            document.getElementById("screen-end").classList.add("hidden");
            document.getElementById("screen-aquarium").classList.add("hidden");
            document.getElementById("screen-start").classList.remove("hidden");
        }


    </script>
</body>
