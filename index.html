<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート</title>
  <style>
    :root {
      --dark-gray: #333333;
      --medium-gray: #666666;
      --border-gray: #cccccc;
      --bg-gray: #f5f5f5;
      --selected-bg: #ececec;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fafafa;
      color: var(--dark-gray);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
    }

    .survey-container {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 24px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #eaeaea;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.5;
      margin: 0 0 24px 0;
      text-align: center;
      color: var(--dark-gray);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--dark-gray);
    }

    /* 4つのボタンを配置するグリッドレイアウト */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    /* ラジオボタン自体のポインタを隠す */
    .choice-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* カード型ボタンの見た目（縦の長さを110pxの150%＝165pxに設定） */
    .choice-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      border: 1.5px solid var(--border-gray);
      border-radius: 12px;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.2s ease;
      min-height: 165px;
      box-sizing: border-box;
      user-select: none;
    }

    .choice-card:hover {
      border-color: var(--dark-gray);
      background-color: #fcfcfc;
    }

    /* 選択時のアクティブ状態 */
    .choice-card.selected {
      border-color: var(--dark-gray);
      background-color: var(--selected-bg);
      border-width: 2px;
      box-shadow: inset 0 0 0 1px var(--dark-gray);
    }

    /* アイコンの枠と画像スタイル */
    .choice-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* 年代アイコン（under35 / over35）のみ80%のサイズに縮小 */
    .choice-icon img.age-icon {
      transform: scale(0.8);
    }

    .choice-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--dark-gray);
      text-align: center;
    }

    /* 送信ボタン（濃いグレー） */
    button.submit-btn {
      width: 100%;
      background-color: var(--dark-gray);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.submit-btn:hover {
      background-color: #1a1a1a;
    }

    button.submit-btn:active {
      transform: scale(0.99);
    }

    button.submit-btn:disabled {
      background-color: #888888;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="survey-container">
    <h1>サービス向上のため<br>アンケートにご協力ください</h1>

    <form id="surveyForm">
      <!-- 1. 性別セクション -->
      <div class="section-title">性別</div>
      <div class="choices-grid">
        <!-- 男性 -->
        <label class="choice-card" onclick="selectCard(this, 'gender')">
          <input type="radio" name="gender" value="男性" required>
          <div class="choice-icon">
            <img src="./user-male.svg" alt="男性">
          </div>
          <span class="choice-label">男性</span>
        </label>

        <!-- 女性 -->
        <label class="choice-card" onclick="selectCard(this, 'gender')">
          <input type="radio" name="gender" value="女性" required>
          <div class="choice-icon">
            <img src="./user-female.svg" alt="女性">
          </div>
          <span class="choice-label">女性</span>
        </label>
      </div>

      <!-- 2. 年代セクション -->
      <div class="section-title">年代</div>
      <div class="choices-grid">
        <!-- 35歳未満 -->
        <label class="choice-card" onclick="selectCard(this, 'age')">
          <input type="radio" name="age" value="35歳未満" required>
          <div class="choice-icon">
            <img src="./under35.svg" alt="35歳未満" class="age-icon">
          </div>
          <span class="choice-label">35歳未満</span>
        </label>

        <!-- 35歳以上 -->
        <label class="choice-card" onclick="selectCard(this, 'age')">
          <input type="radio" name="age" value="35歳以上" required>
          <div class="choice-icon">
            <img src="./over35.svg" alt="35歳以上" class="age-icon">
          </div>
          <span class="choice-label">35歳以上</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">回答して進む</button>
    </form>
  </div>

  <script>
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbywUquCksD91EOG9taXWzUZ5ncoD0IhjIF4etILA__iK8Du0fMR5SpbyLtvPlSBIvddRg/exec';

    // 1. 店舗ID取得（画面非表示でも裏側でしっかり取得します）
    function getShopId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('shop_id') || params.get('cd') || '';
    }

    // 2. デバイスIDの生成・取得
    function getOrCreateDeviceId() {
      let deviceId = localStorage.getItem('device_id');
      if (!deviceId) {
        deviceId = 'dev_' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2));
        localStorage.setItem('device_id', deviceId);
      }
      return deviceId;
    }

    // 3. URLにdevice_idを安全に付与する
    function appendDeviceId(targetUrlString, deviceId) {
      const url = new URL(targetUrlString);
      url.searchParams.set('device_id', deviceId);
      return url.toString();
    }

    // 4. データ送信関数
    async function sendDataToGAS(payload) {
      try {
        await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error('送信エラー:', err);
      }
    }

    // 日本時間取得
    function getFormattedTimestamp() {
      const d = new Date();
      return d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
    }

    // カードクリック時に選択状態スタイルを更新するUI制御
    function selectCard(clickedCard, groupName) {
      const groupCards = document.querySelectorAll(`input[name="${groupName}"]`);
      groupCards.forEach(input => {
        input.closest('.choice-card').classList.remove('selected');
      });
      clickedCard.classList.add('selected');
      const radio = clickedCard.querySelector('input[type="radio"]');
      radio.checked = true;
    }

    // 初期化
    const currentShopId = getShopId();
    const deviceId = getOrCreateDeviceId();

    // 画面表示イベント（survey_view）
    window.addEventListener('DOMContentLoaded', () => {
      sendDataToGAS({
        type: 'event',
        timestamp: getFormattedTimestamp(),
        shop_id: currentShopId,
        device_id: deviceId,
        event: 'survey_view',
        content_name: 'アンケート画面'
      });
    });

    // フォーム送信処理
    document.getElementById('surveyForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      const formData = new FormData(e.target);
      const timestamp = getFormattedTimestamp();

      try {
        const res = await fetch('./routing.json');
        const routeConfig = await res.json();
        const targetConfig = routeConfig[currentShopId] || routeConfig['default'];

        if (!targetConfig || !targetConfig.url) {
          throw new Error('遷移先設定が見つかりません');
        }

        const targetUrl = targetConfig.url;
        const targetContentName = targetConfig.name || '不明なコンテンツ';

        // 1. ユーザーデータ送信
        const userPromise = sendDataToGAS({
          type: 'user',
          timestamp: timestamp,
          shop_id: currentShopId,
          device_id: deviceId,
          gender: formData.get('gender'),
          age: formData.get('age')
        });

        // 2. イベントデータ（survey_submit）送信
        const eventPromise = sendDataToGAS({
          type: 'event',
          timestamp: timestamp,
          shop_id: currentShopId,
          device_id: deviceId,
          event: 'survey_submit',
          content_name: targetContentName
        });

        await Promise.all([userPromise, eventPromise]);

        const nextUrl = appendDeviceId(targetUrl, deviceId);
        window.location.href = nextUrl;

      } catch (err) {
        console.error('処理エラー:', err);
        alert('エラーが発生しました。設定をご確認ください。');
        submitBtn.disabled = false;
        submitBtn.textContent = '回答して進む';
      }
    });
  </script>
</body>
</html>
