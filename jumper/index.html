<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ホップ・ステップ・キャッチ！</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1b1b1b;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Mochiy Pop One", "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    background: #ffffff;
    overflow: hidden;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<div id="stage">
<canvas id="game"></canvas>
</div>
<script>
"use strict";

// ★GASのウェブアプリURLを貼り付けてください★
const GAS_URL = "https://script.google.com/macros/s/AKfycb.../exec";

// --- 店舗CD & デバイスIDの取得 ---
let storeCd = "000000";
let deviceId = localStorage.getItem('device_id') || 'unknown';

function getStoreCdFromUrl() {
  const hash = window.location.hash.replace('#', '').trim();
  if (hash && hash.length === 6) {
    storeCd = hash;
  }
}
getStoreCdFromUrl();

// GASアクセスログ送信
function logAccess(actionName) {
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: 'access_log',
      store_cd: storeCd,
      device_id: deviceId,
      action: actionName
    })
  }).catch(err => console.warn("ログ送信失敗:", err));
}

const stage = document.getElementById("stage");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, dpr = 1;
let groundY = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = stage.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  groundY = Math.floor(H * 0.76);
}
let resizeScheduled = false;
function scheduleResize() {
  if (resizeScheduled) return;
  resizeScheduled = true;
  requestAnimationFrame(() => { resizeScheduled = false; resize(); });
}
window.addEventListener("resize", scheduleResize);
window.addEventListener("orientationchange", scheduleResize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleResize);
resize();

// ジェスチャー制限
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("gesturechange", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
document.addEventListener("contextmenu", (e) => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ----------------------------- 画像読み込み ---------------------------
const defaultPlayerPath = 'image/000000.png';
let currentPlayerPath = storeCd !== "000000" ? `image/${storeCd}.png` : defaultPlayerPath;

const playerImg = new Image();
let playerImgLoaded = false;
playerImg.onload = () => { playerImgLoaded = true; };
playerImg.onerror = () => {
  if (currentPlayerPath !== defaultPlayerPath) {
    currentPlayerPath = defaultPlayerPath;
    playerImg.src = defaultPlayerPath;
  }
};
playerImg.src = currentPlayerPath;

// ダイヤモンド画像 (1〜6)
const diamondImgs = [];
for (let i = 1; i <= 6; i++) {
  const img = new Image();
  img.src = `image/diamond${i}.webp`;
  diamondImgs.push(img);
}

// ----------------------------- サウンド ---------------------------
function createSfxPool(src, size, vol) {
  const pool = [];
  for (let i = 0; i < size; i++) {
    const a = new Audio(src);
    a.preload = "auto";
    a.volume = vol;
    pool.push(a);
  }
  let i = 0;
  return () => {
    const a = pool[i];
    i = (i + 1) % pool.length;
    try { a.currentTime = 0; } catch (e) {}
    a.play().catch(() => {});
  };
}
const sndJump = createSfxPool("assets/jump.mp3", 3, 0.6);
const sndGem  = createSfxPool("assets/gem.mp3", 4, 0.7);
const sndHit  = createSfxPool("assets/hit.mp3", 2, 0.7);

// ----------------------------- ステート ---------------------------
const STATE = { READY: 0, PLAY: 1, EVENT: 2, OVER: 3, CLEAR: 4 };
let state = STATE.READY;

const GOAL_SCORE = 200;     // ゴール目標スコア
const BALL_R = 22;          
const GRAVITY = 1600;       
const JUMP_V = -680;        
const BASE_SPEED = 210;     
const MAX_SPEED = 450;      

const ball = { x: 0, y: 0, vy: 0, jumpsLeft: 2, onGround: true, squash: 0 };
let speed = BASE_SPEED;
let distance = 0;
let gemsScore = 0;
let score = 0;
let best = 0;
try { best = parseInt(localStorage.getItem("hc_best") || "0", 10) || 0; } catch (e) {}

let obstacles = [];
let gems = [];
let particles = [];
let clouds = [];
let distToNextSpawn = 0;
let overTime = 0;
let shake = 0;

// 坂道イベント用変数
let eventProgress = 0;      // 連打進捗 (0 〜 100)
let eventTriggered = false; // イベント既発生フラグ
let slopeAngle = 0;         // 地面の傾斜角

function initClouds() {
  clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x: Math.random() * W,
      y: Math.random() * groundY * 0.7 + 20,
      r: 12 + Math.random() * 25,
      s: 0.1 + Math.random() * 0.15
    });
  }
}
initClouds();

function resetGame() {
  ball.x = Math.max(90, W * 0.24);
  ball.y = groundY - BALL_R;
  ball.vy = 0;
  ball.jumpsLeft = 2;
  ball.onGround = true;
  ball.squash = 0;
  speed = BASE_SPEED;
  distance = 0;
  gemsScore = 0;
  score = 0;
  obstacles = [];
  gems = [];
  particles = [];
  distToNextSpawn = W * 1.1;
  shake = 0;
  eventProgress = 0;
  eventTriggered = false;
  slopeAngle = 0;
}
resetGame();

// ----------------------------- 入力 ---------------------------
function press() {
  if (state === STATE.READY) {
    state = STATE.PLAY;
    logAccess("ゲーム開始: ホップ・ステップ・キャッチ！");
    return;
  }
  if (state === STATE.OVER || state === STATE.CLEAR) {
    if (overTime > 0.6) {
      resetGame();
      state = STATE.PLAY;
      logAccess("リトライ: ホップ・ステップ・キャッチ！");
    }
    return;
  }
  
  // 坂道イベント中のタップ処理（連打）
  if (state === STATE.EVENT) {
    eventProgress += 8; // 連打で進行度アップ
    sndJump();
    spawnDust(ball.x, ball.y + BALL_R, 3, -1);
    if (eventProgress >= 100) {
      // イベントクリア
      state = STATE.PLAY;
      gemsScore += 20; // 坂道走破ボーナス
      spawnBurst(W / 2, H / 2, 25, "#ff2a8d");
    }
    return;
  }

  // プレイ中（2段ジャンプ可）
  if (ball.jumpsLeft > 0) {
    ball.vy = ball.jumpsLeft === 2 ? JUMP_V : JUMP_V * 0.88;
    ball.jumpsLeft--;
    ball.onGround = false;
    ball.squash = -0.25;
    sndJump();
    spawnDust(ball.x, groundY, 4, -1);
  }
}
window.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); }, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    press();
  }
});

// --------------------------- スポーン ---------------------------
function spawnObstacleGroup() {
  // イベント中やゴール間近は障害物を生成しない
  if (state === STATE.EVENT || score > GOAL_SCORE - 15) return;

  const t = Math.random();
  const x = W + 80;
  
  if (t < 0.60) {
    const n = Math.random() < 0.7 ? 1 : 2; 
    const sw = 28;
    obstacles.push({ x: x, w: sw * n, h: 32, kind: "spike", n: n });
  } else {
    const h = 38 + Math.random() * 20;
    obstacles.push({ x: x, w: 32, h: h, kind: "block" });
  }

  if (Math.random() < 0.70) {
    const gx = x + 160 + Math.random() * 80;
    const n = 3 + Math.floor(Math.random() * 2);
    const imgIdx = Math.floor(Math.random() * 6);
    for (let i = 0; i < n; i++) {
      const px = gx + i * 40;
      const py = groundY - 70 - Math.sin((i / (n - 1)) * Math.PI) * 70;
      gems.push({ x: px, y: py, r: 14, phase: Math.random() * 6.28, imgIdx: imgIdx });
    }
  }

  distToNextSpawn = Math.max(340, speed * (1.1 + Math.random() * 0.5));
}

function spawnDust(x, y, n, dir) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 14,
      y: y - Math.random() * 6,
      vx: (Math.random() * 50 + 20) * (Math.random() < 0.5 ? -1 : 0.4) - speed * 0.15,
      vy: (dir || -1) * (Math.random() * 50 + 20),
      life: 0, maxLife: 0.4 + Math.random() * 0.25,
      size: 3 + Math.random() * 3,
      color: "#ffb6d5"
    });
  }
}

function spawnBurst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 200;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,
      life: 0, maxLife: 0.5 + Math.random() * 0.4,
      size: 3 + Math.random() * 4,
      color: color
    });
  }
}

// -------------------------- 当たり判定 ---------------------------
function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

function gameOver() {
  state = STATE.OVER;
  overTime = 0;
  shake = 10;
  sndHit();
  spawnBurst(ball.x, ball.y, 20, "#ff52a2");

  logAccess(`ゲームオーバー: ホップ・ステップ・キャッチ！ (${score}点)`);

  if (score > best) {
    best = score;
    try { localStorage.setItem("hc_best", String(best)); } catch (e) {}
  }
}

function gameClear() {
  state = STATE.CLEAR;
  overTime = 0;
  shake = 5;
  sndGem();
  spawnBurst(W / 2, H / 2, 40, "#ff2a8d");

  logAccess(`ゲームクリア: ホップ・ステップ・キャッチ！ (${score}点)`);

  if (score > best) {
    best = score;
    try { localStorage.setItem("hc_best", String(best)); } catch (e) {}
  }
}

// ---------------------------- 更新 ----------------------------
function update(dt) {
  const bgSpeed = (state === STATE.PLAY || state === STATE.EVENT) ? speed : 30;
  for (const c of clouds) {
    c.x -= bgSpeed * c.s * dt;
    if (c.x < -c.r * 2) {
      c.x = W + c.r * 2;
      c.y = Math.random() * groundY * 0.7 + 20;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
    p.vy += 800 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.y > groundY - 2) { p.y = groundY - 2; p.vy *= -0.4; }
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  if (state === STATE.OVER || state === STATE.CLEAR) {
    overTime += dt;
    return;
  }

  if (state === STATE.READY) {
    ball.vy += GRAVITY * dt;
    ball.y += ball.vy * dt;
    if (ball.y >= groundY - BALL_R) {
      ball.y = groundY - BALL_R;
      ball.vy = -420;
      spawnDust(ball.x, groundY, 2, -1);
    }
    return;
  }

  // 坂道イベント中の更新
  if (state === STATE.EVENT) {
    eventProgress = Math.max(0, eventProgress - 15 * dt); // 自動で少しずつ下がる
    slopeAngle = -0.25; // 画面傾斜
    ball.y = groundY - BALL_R - (eventProgress * 1.2); // 走破進捗に応じて高くなる
    ball.squash += (0 - ball.squash) * Math.min(1, dt * 12);
    distance += speed * 0.5 * dt;
    score = Math.floor(distance / 50) + gemsScore;
    return;
  } else {
    slopeAngle = 0;
  }

  // プレイ中スピード制御
  speed = Math.min(MAX_SPEED, speed + 5 * dt);
  distance += speed * dt;
  score = Math.floor(distance / 50) + gemsScore;

  // ゴール判定 (200点到達)
  if (score >= GOAL_SCORE) {
    gameClear();
    return;
  }

  // 坂道イベントトリガー (120点到達で1回だけ発動)
  if (score >= 120 && !eventTriggered) {
    eventTriggered = true;
    state = STATE.EVENT;
    eventProgress = 10;
    obstacles = []; // イベント発生時に画面上の障害物を消去
    return;
  }

  const wasAirborne = !ball.onGround;
  ball.vy += GRAVITY * dt;
  ball.y += ball.vy * dt;
  if (ball.y >= groundY - BALL_R) {
    ball.y = groundY - BALL_R;
    ball.vy = 0;
    ball.onGround = true;
    ball.jumpsLeft = 2;
    if (wasAirborne) {
      ball.squash = 0.25;
      spawnDust(ball.x, groundY, 5, -1);
    }
  } else {
    ball.onGround = false;
  }
  ball.squash += (0 - ball.squash) * Math.min(1, dt * 12);

  // スポーン制御
  distToNextSpawn -= speed * dt;
  if (distToNextSpawn <= 0) spawnObstacleGroup();

  // 障害物更新
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed * dt;
    if (o.x + o.w < -60) { obstacles.splice(i, 1); continue; }
    
    const cr = BALL_R - 6;
    if (o.kind === "spike") {
      if (circleRectHit(ball.x, ball.y, cr, o.x + 6, groundY - o.h + 12, o.w - 12, o.h - 12)) {
        gameOver(); return;
      }
    } else {
      if (circleRectHit(ball.x, ball.y, cr, o.x + 4, groundY - o.h + 4, o.w - 8, o.h - 4)) {
        gameOver(); return;
      }
    }
  }

  // ダイヤモンド取得判定
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.x -= speed * dt;
    g.phase += dt * 3;
    if (g.x < -40) { gems.splice(i, 1); continue; }
    const dx = g.x - ball.x, dy = (g.y + Math.sin(g.phase) * 4) - ball.y;
    if (dx * dx + dy * dy < (BALL_R + g.r + 6) * (BALL_R + g.r + 6)) {
      gems.splice(i, 1);
      gemsScore += 5;
      sndGem();
      spawnBurst(g.x, g.y, 8, "#00e5ff");
    }
  }
}

// ----------------------------- 描画 -----------------------------
function drawBall() {
  const sq = ball.squash;
  ctx.save();
  ctx.translate(ball.x, ball.y + sq * BALL_R * 0.5);
  ctx.scale(1 + sq * 0.5, 1 - sq * 0.5);

  if (playerImgLoaded) {
    // キャラクター画像を従来の150%サイズ（1.5倍）に拡大描画
    const size = BALL_R * 3.6; 
    ctx.drawImage(playerImg, -size / 2, -size / 2, size, size);
  } else {
    ctx.fillStyle = "#ff6eb4";
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawObstacle(o) {
  ctx.fillStyle = "#ff52a2";
  if (o.kind === "spike") {
    const sw = o.w / o.n;
    for (let i = 0; i < o.n; i++) {
      const sx = o.x + i * sw;
      ctx.beginPath();
      ctx.moveTo(sx, groundY);
      ctx.lineTo(sx + sw / 2, groundY - o.h);
      ctx.lineTo(sx + sw, groundY);
      ctx.closePath();
      ctx.fill();
    }
  } else {
    const r = 6;
    const x = o.x, y = groundY - o.h, w = o.w, h = o.h;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
    ctx.fill();
  }
}

function drawGem(g) {
  const y = g.y + Math.sin(g.phase) * 4;
  const size = g.r * 2.2;
  const img = diamondImgs[g.imgIdx];

  ctx.save();
  ctx.translate(g.x, y);

  if (img && img.complete && img.naturalWidth !== 0) {
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
  } else {
    ctx.fillStyle = "#00e5ff";
    ctx.beginPath();
    ctx.moveTo(0, -g.r);
    ctx.lineTo(g.r, 0);
    ctx.lineTo(0, g.r);
    ctx.lineTo(-g.r, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawCenteredText(text, x, y, size, weight, color) {
  ctx.fillStyle = color;
  ctx.font = (weight || "700") + " " + size + "px 'Mochiy Pop One', 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // 坂道イベント時の画面全体の傾斜
  if (slopeAngle !== 0) {
    ctx.translate(W / 2, H / 2);
    ctx.rotate(slopeAngle);
    ctx.translate(-W / 2, -H / 2);
  }

  // 背景
  ctx.fillStyle = "#e0f7fa";
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // パララックス雲
  ctx.fillStyle = "#b2ebf2";
  for (const c of clouds) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 地面
  ctx.fillStyle = "#ff6eb4";
  ctx.fillRect(-20, groundY, W + 40, 4);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(-20, groundY + 4, W + 40, H - groundY);

  // 地面のライン
  ctx.strokeStyle = "#ffcee6";
  ctx.lineWidth = 2;
  const tickGap = 80;
  const off = -(distance % tickGap);
  for (let x = off; x < W + tickGap; x += tickGap) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + 14);
    ctx.lineTo(x + 24, groundY + 14);
    ctx.stroke();
  }

  // 宝石・障害物
  for (const g of gems) drawGem(g);
  for (const o of obstacles) drawObstacle(o);

  // パーティクル
  for (const p of particles) {
    const a = 1 - p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  // キャラクター描画
  if (state !== STATE.OVER || overTime < 0.05) drawBall();

  // ---------------- UI ----------------
  if (state === STATE.PLAY) {
    drawCenteredText(`${score} / ${GOAL_SCORE}`, W / 2, H * 0.12, 46, "900", "#ff2a8d");
  }

  // 坂道イベント中UI
  if (state === STATE.EVENT) {
    drawCenteredText("れんだして さかみちを のぼれ！", W / 2, H * 0.18, Math.min(22, W * 0.055), "900", "#ff2a8d");
    
    // 連打進捗ゲージの描画
    const barW = W * 0.7;
    const barH = 20;
    const barX = (W - barW) / 2;
    const barY = H * 0.25;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(barX, barY, barW, barH);
    ctx.strokeStyle = "#ff2a8d";
    ctx.lineWidth = 3;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = "#ff2a8d";
    ctx.fillRect(barX, barY, barW * (eventProgress / 100), barH);
  }

  if (state === STATE.READY) {
    drawCenteredText("ホップ・ステップ・キャッチ！", W / 2, H * 0.22, Math.min(28, W * 0.075), "900", "#ff2a8d");
    drawCenteredText("タップでふわっとジャンプ（2段ジャンプ可）", W / 2, H * 0.32, Math.min(16, W * 0.038), "700", "#555555");
    drawCenteredText(`めざせ！ ${GOAL_SCORE} てん ゴール！`, W / 2, H * 0.37, Math.min(18, W * 0.042), "900", "#ff2a8d");
    
    if (Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでスタート", W / 2, H * 0.48, Math.min(24, W * 0.055), "900", "#ff2a8d");
    }
    if (best > 0) {
      drawCenteredText("ベスト記録: " + best, W / 2, H * 0.56, 18, "700", "#888888");
    }
  }

  if (state === STATE.OVER) {
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    drawCenteredText("ざんねん！", W / 2, H * 0.28, Math.min(42, W * 0.08), "900", "#ff2a8d");
    drawCenteredText("スコア", W / 2, H * 0.40, 18, "700", "#666666");
    drawCenteredText(String(score), W / 2, H * 0.48, 52, "900", "#ff2a8d");
    drawCenteredText("ベスト記録: " + best, W / 2, H * 0.57, 18, "700", "#888888");
    if (overTime > 0.6 && Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでリトライ", W / 2, H * 0.68, 22, "900", "#ff2a8d");
    }
  }

  if (state === STATE.CLEAR) {
    ctx.fillStyle = "rgba(255,255,255,0.88)";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    drawCenteredText("🎉 GOAL!! クリア！ 🎉", W / 2, H * 0.28, Math.min(32, W * 0.075), "900", "#ff2a8d");
    drawCenteredText("すごい！ゴールまで走りきったよ！", W / 2, H * 0.38, Math.min(16, W * 0.04), "700", "#555555");
    drawCenteredText(String(score) + " 点", W / 2, H * 0.48, 52, "900", "#ff2a8d");
    if (overTime > 0.6 && Math.floor(performance.now() / 600) % 2 === 0) {
      drawCenteredText("タップでもう一度あそぶ", W / 2, H * 0.65, 22, "900", "#ff2a8d");
    }
  }

  ctx.restore();
}

// ----------------------------- ループ -----------------------------
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 1 / 30) dt = 1 / 30;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastT = performance.now();
});
</script>
</body>
</html>
