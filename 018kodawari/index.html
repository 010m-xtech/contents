main{max-width:520px;margin:0 auto;padding:20px 22px 64px}
h1,h2{text-shadow:1px 2px 3px rgba(0,0,0,.28);text-wrap:balance;font-weight:800;line-height:1.4;margin:0}
h1{font-size:28px}
h1 .sub-title{display:block;font-size:20px;margin-top:4px}
h2{text-wrap:balance;font-size:26px;margin:6px 0 14px}
p{margin:0 0 1em}
.pg{text-align:center;font-size:16px;color:var(--mut);margin-bottom:26px}
.pg b{font-size:28px;font-weight:800;color:var(--fg);letter-spacing:.08em}
.ln{display:block;white-space:nowrap;font-size:clamp(10px, calc((100vw - 110px) / 20.5), 20px);letter-spacing:-0.02em}
.why .ln b{color:var(--fg)}
.ln2{display:block;white-space:nowrap;font-size:min(17px,3.5vw)}
button{font:inherit;cursor:pointer}
.rv{display:none;margin-top:16px}
.rv.show{display:block}
.rv .lb{font-size:14px;color:var(--acc);font-weight:700;margin:0 0 2px}
.btn{display:block;width:100%;background:var(--acc);color:var(--bg);border:0;border-radius:6px;padding:14px;font-weight:700;font-size:18px;margin-top:22px}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line);font-size:15px;font-weight:400}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.lead{font-size:18px}
.small{font-size:14px;color:var(--mut)}
.course-title{display:block;white-space:nowrap;font-size:clamp(10px, calc((100vw - 110px) / 18.5), 23px);letter-spacing:-0.05em;color:var(--acc);margin-bottom:12px}
.glass-box{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:26px 14px;margin:28px 0;box-shadow:0 8px 24px rgba(0,0,0,0.06);text-align:center}
.glass-box .ln b{color:var(--fg)}
[hidden]{display:none!important}
.cd{display:grid;width:100%;background:none;border:0;padding:0;perspective:900px;text-align:left;color:inherit;margin:8px 0 20px}
.fc{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:22px 18px;min-height:190px;border-radius:6px;border:1px solid var(--line);backface-visibility:hidden;transition:transform .6s}
.fr{background:var(--card);font-size:18px}.fr small{color:var(--acc);font-size:14px}
.bk{background:var(--acc);color:var(--bg);transform:rotateY(180deg);font-size:16px;line-height:1.8}

/* ===== V266 第1回：質感の統一（和紙・金の二重罫・札） ===== */
:root{--gold:#c9a45c;--gold2:rgba(201,164,92,.38);--paper:#fffdf6}
#hd{background:linear-gradient(180deg,#fcf8ea,#f1e8d0);border-bottom:1px solid var(--gold);box-shadow:0 2px 0 var(--gold2),0 8px 14px rgba(70,45,15,.10)}
#hd b{font-weight:800;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.cb,.cbox,.glass-box,.msg-window:not(.nowin){background:rgba(255,253,246,.93);border:1px solid #d8c79c;box-shadow:0 4px 12px rgba(70,45,15,.10),inset 0 0 0 3px rgba(255,253,246,.95),inset 0 0 0 4px var(--gold2)}
.cb::before{background:#fffdf6;border-color:#d8c79c}
.cf .cb::before{border-color:#d8c79c}
.msg-window:not(.nowin)::before{border-bottom-color:#d8c79c}
.msg-window:not(.nowin)::after{border-bottom-color:#fffdf6}
.glass-box{backdrop-filter:none;-webkit-backdrop-filter:none}
.ph{border:5px solid #fffdf6;border-radius:5px;box-shadow:0 0 0 1px #d8c79c,0 8px 16px rgba(70,45,15,.18)}
.btn{background:linear-gradient(180deg,#c97a2c,#a95a1a);border-radius:12px;text-shadow:0 1px 0 rgba(0,0,0,.22);box-shadow:0 3px 0 #7a3f10,0 8px 14px rgba(80,40,10,.22),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a3f10,0 3px 6px rgba(80,40,10,.2),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.fin{background:linear-gradient(180deg,#4a362a,#2e2018);box-shadow:0 3px 0 #140d07,0 8px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14)}
.zkb{background:linear-gradient(180deg,#fffaf0,#f6ead0);border:1.5px solid var(--gold);color:#8a3e12;box-shadow:0 2px 0 var(--gold2)}
.hrow .cslab{background:linear-gradient(180deg,#fffaf0,#f3e5c3);border:1.5px solid var(--gold);border-radius:999px;padding:3px 16px;box-shadow:0 2px 0 var(--gold2)}
.tz{border:1.5px solid var(--gold);border-radius:14px;background:linear-gradient(180deg,#fff9e8,#f3e4c0);color:#8a3e12;box-shadow:0 2px 0 var(--gold2),inset 0 0 0 3px rgba(255,253,246,.7)}
.cd.hasimg .fr{align-items:center;justify-content:center;text-align:center;gap:12px;background:linear-gradient(150deg,#fffaf0,#f3e5c3);border:2px solid var(--gold);box-shadow:0 8px 18px rgba(70,45,15,.16),inset 0 0 0 4px rgba(255,253,246,.9),inset 0 0 0 5px var(--gold2);border-radius:10px}
.cd.hasimg .fr b{font-size:19px}
.cd.hasimg .fr small{align-self:center;padding:3px 16px}
.cd.hasimg .fr small::before{content:"↻　"}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* ===== V267 第2回：描写の質感（図カード・箇条書き・セリフ枠・見出し・写真） ===== */
.pf,.ck{background:linear-gradient(180deg,#fffefa,#fbf4e2);border:1px solid #d8c79c;border-radius:20px;box-shadow:0 4px 12px rgba(70,45,15,.10),inset 0 0 0 3px rgba(255,253,246,.95),inset 0 0 0 4px var(--gold2)}
.pf.pig svg>rect{fill:none}
.rsi{background:linear-gradient(180deg,#fffefa,#f9f1de);border:1px solid #d8c79c;border-radius:12px;box-shadow:0 2px 0 var(--gold2),inset 0 0 0 2px rgba(255,253,246,.9)}
.rsi i{background:linear-gradient(180deg,#cf8132,#a95a1a);box-shadow:0 2px 0 #7a3f10,inset 0 1px 0 rgba(255,255,255,.3)}
.lwt{background:#fffdf6;border:2px solid var(--acc);border-radius:22px 22px 6px 22px;padding:8px 16px;box-shadow:0 2px 0 rgba(58,42,28,.14)}
.lwt::after{background:#fffdf6;border-top-width:2px;border-right-width:2px}
.lwr.lwp .lwt::after{border-right-width:2px;border-bottom:2px solid var(--acc)}
.pg b{display:inline-flex;align-items:center;gap:12px}
.pg b::before,.pg b::after{content:"";flex:none;width:30px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.pg b::after{transform:scaleX(-1)}
img.cph{filter:saturate(1.06) contrast(1.04) sepia(.05)}

/* ===== V272 案A：背景を炭色に（カードは紙色のまま） ===== */
html{background:#15100c}
body::after{background:radial-gradient(120% 55% at 50% 108%,rgba(196,98,28,.30),transparent 62%),radial-gradient(90% 60% at 50% 0%,rgba(255,236,200,.05),transparent 70%),linear-gradient(180deg,#1c1510,#120d09 60%,#1a120b)!important}
#hd{background:linear-gradient(180deg,#241a12,#17110c);border-bottom:1px solid var(--gold);box-shadow:0 2px 0 rgba(201,164,92,.25),0 8px 16px rgba(0,0,0,.45);color:#f3e7cb}
#hd *{color:#f3e7cb}
h1,h1 .sub-title{color:#f6ecd2;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.pg b{color:#f6ecd2;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#pg b{color:#e8b25a}
.pg b::before,.pg b::after{background:linear-gradient(90deg,transparent,#d9b66c)}
.pgl{color:#e8b25a}
.pgl b{border-bottom-color:#d9b66c;color:#f6ecd2}
:root{--card:#f7f0de;--msg-bg:#f7f0de}
#hd{background:linear-gradient(180deg,#241a12,#17110c)!important}
#hd b{text-shadow:0 1px 2px rgba(0,0,0,.6)}
#hd img{filter:invert(1) hue-rotate(180deg) brightness(1.15);}
.cb,.cbox,.glass-box,.msg-window:not(.nowin){background:linear-gradient(180deg,#fffefa,#f8f0dd)}
#rmore>p b,#rend b,#rp+p,#rp+p b{color:#f3e7cb}
#rmore>p b span{color:#e8b25a!important}
.zkb{color:#3a2a1c}
.cb,.cf .cb,.rch .cb,.fch .cb{background:linear-gradient(180deg,#fffefa,#f8f0dd)!important}
.cf .cb::before{background:#fffefa!important}
.rch .cb::before,.rch .cb::after{display:none!important}

.cf .cb::before{border-radius:3px!important;background:#fffdf4!important;border-color:#cdb784!important}
.pf,.ck{border-radius:12px!important;border-color:#cdb784!important;box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 0 0 3px #fdf7e6,inset 0 0 0 4px rgba(201,164,92,.55)!important}
.rsi{border-radius:8px!important;border-color:#cdb784!important;box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 2px #fdf7e6,inset 0 0 0 3px rgba(201,164,92,.45)!important}
.lwt,.sy{border-color:#b8651f!important;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 2px #fdf7e6!important}
.chat .mo .seg button,.seg button{border-radius:8px;background:linear-gradient(180deg,#fffdf4,#f3e5c4);border:1px solid #b8651f;box-shadow:0 2px 0 rgba(120,70,20,.35),inset 0 0 0 2px #fdf7e6;color:#2b1d12}
.btn{border:1px solid #c9a45c!important;border-radius:10px!important;letter-spacing:.14em}
.btn.fin{border-color:#c9a45c!important;color:#f3e7cb}
.cb b,.cbox b,.glass-box b{color:inherit}

/* ===== V277 案B：金を「見出し・カード枠・ボタン縁」の3か所に統一 ===== */
:root{--gold:#c9a45c;--goldL:#e4c682;--gold2:rgba(201,164,92,.5)}
#pg b,.pgl,.pg b{color:var(--goldL)}
.pg b::before,.pg b::after{background:linear-gradient(90deg,transparent,var(--goldL))}
.pgl b{border-bottom-color:var(--goldL)}
.cb,.cf .cb,.cbox,.glass-box,.pf,.ck,.rsi{border-color:var(--gold)!important}
.cb,.cf .cb,.cbox,.glass-box,.pf,.ck{box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 0 0 3px #fdf7e6,inset 0 0 0 4px var(--gold2)!important}
.cf .cb::before{border-color:var(--gold)!important}
.lwt,.sy,.seg button,.chat .mo .seg button{border-color:var(--gold)!important}
.seg button,.chat .mo .seg button{box-shadow:0 2px 0 rgba(90,60,20,.4),inset 0 0 0 2px #fdf7e6!important}
.btn,.btn.fin{border-color:var(--gold)!important}
.zkb{border:1px solid var(--gold)}
.av{border-color:var(--gold)!important}
.ph{box-shadow:0 0 0 1px var(--gold),0 6px 14px rgba(0,0,0,.45)}

h1.ttl{text-align:center;margin:0 0 16px;text-shadow:none;line-height:0}
h1.ttl img{display:block;margin:0 auto;width:min(62vw,230px);height:auto;filter:drop-shadow(0 0 12px rgba(255,170,80,.25))}

/* V279 ヘッダー：店名の文字を外し、ロゴだけ中央に */
#hd{justify-content:center}
#hd b{display:none}
#hd img:not(.hdn){width:44px;height:44px}

#hd{gap:12px}
#hd img.hdn{height:auto;width:min(200px,calc(100vw - 110px));min-width:0;filter:drop-shadow(0 0 8px rgba(255,170,80,.25))}

/* V283 ヘッダー：元ロゴのレイアウト（炭火焼を上、なみひらを下）*/
#hd{padding:8px 16px;min-height:60px;overflow:visible}
#hd img.hdn{height:42px;width:auto;max-width:calc(100vw - 110px);object-fit:contain}

/* V284 ヘッダーを上に固定（スクロールしても・プレビューでも見切れない） */
#hd{position:sticky;top:0;z-index:60;padding:16px 16px 12px;min-height:72px;background:linear-gradient(180deg,rgba(26,19,13,.98) 0%,rgba(26,19,13,.96) 70%,rgba(21,16,12,0) 100%)!important}
html{scroll-padding-top:90px}

/* V290 背景ロゴ：大きさは変えず、輪郭がぼわっと滲む */
#bgl{opacity:.8;animation:nmGlow 6s ease-in-out infinite}
@keyframes nmGlow{0%,100%{filter:blur(0) drop-shadow(0 0 3px rgba(255,170,80,.30))}50%{filter:blur(1.3px) drop-shadow(0 0 20px rgba(255,160,70,.85))}}
@media (prefers-reduced-motion:reduce){#bgl{animation:none}}

/* ===== V292 世界観と読みやすさの両立：大将の吹き出し＝墨色の札、読み物・図＝焼けた和紙 ===== */
.cb,.cf .cb,.rch .cb,.fch .cb,.chat{background-image:linear-gradient(180deg,#2e2218,#1f1710)!important;background-color:#241a12!important;color:#f6ecd2!important;border:1px solid var(--gold)!important;box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 0 0 3px #1b140e,inset 0 0 0 4px rgba(201,164,92,.55)!important}
.cb b,.cb p,.chat b,.chat p,.chat .lead{color:#f6ecd2}
.cb .pn,.cb .op,.cb .hz,.chat .pn,.chat .op,.chat .hz{color:#ff8a6a!important}
.cb small.tl{color:#e8b25a}
.cb [style*="--acc"],.chat [style*="--acc"]{color:#f0b060!important}
.cf .cb::before,.rch .cb::before{background:#2e2218!important;border-color:var(--gold)!important}
.chat .seg button,.chat .mo .seg button{background:linear-gradient(180deg,#3a2b1d,#271c13)!important;color:#f6ecd2!important;border:1px solid var(--gold)!important;box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 0 0 2px #1b140e!important}
.chat .small,.chat .mo .small{color:#d9c9a4}
.lwt,.sy{background-image:linear-gradient(180deg,#2e2218,#1f1710)!important;background-color:#241a12!important;color:#f6ecd2!important;border-color:var(--gold)!important;box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 0 0 2px #1b140e!important}
.lwt::after,.sy::after{background:#241a12!important;border-top-color:var(--gold)!important}
.cbox,.glass-box,.rsi,.pf,.ck{background-image:linear-gradient(180deg,#f1e4c4,#e4d3a8)!important;background-color:#ead9b4!important}

.cf .av b{color:#e4c682!important}
.chat::before,.chat::after{background:#2e2218!important;border-color:var(--gold)!important}

.cb,.cf .cb,.rch .cb,.fch .cb,.chat{border-radius:18px!important;box-shadow:0 2px 4px rgba(40,25,10,.08),0 8px 20px rgba(40,25,10,.14)!important}
